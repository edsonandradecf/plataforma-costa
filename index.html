async function etqGerarPDF() {
  var data = etqGetData();
  if (!data.nome || !data.endereco) {
    document.getElementById('etq-status').textContent = '⚠ Preencha Nome e Endereço.';
    return;
  }
  var status = document.getElementById('etq-status');
  var total = data.volumes;
  status.textContent = 'Gerando ' + total + ' etiquetas...';

  // Build all labels as HTML, convert to PDF using jsPDF
  var doc = new jspdf.jsPDF({ unit: 'mm', format: [100, 150], orientation: 'portrait' });
  doc.setProperties({ title: 'Etiquetas Transportadora - Costa Nature Life' });

  for (var i = 1; i <= total; i++) {
    if (i > 1) doc.addPage();
    status.textContent = 'Gerando etiqueta ' + i + '/' + total + '...';

    // Render label to canvas via HTML
    var container = document.createElement('div');
    container.style.cssText = 'position:fixed;left:-9999px;top:0;background:#fff';
    container.innerHTML = etqBuildLabel(i, total, data);
    document.body.appendChild(container);

    // Wait a frame for render
    await new Promise(r => setTimeout(r, 30));

    try {
      var canvas = await html2canvas(container.firstChild, {
        scale: 3,
        backgroundColor: '#fff',
        logging: false,
        width: 377,
        height: 566,
      });
      var imgData = canvas.toDataURL('image/jpeg', 0.97);
      doc.addImage(imgData, 'JPEG', 0, 0, 100, 150);
    } catch(e) {
      // Fallback: draw text directly
      doc.setFontSize(10);
      doc.text('Volume ' + i + '/' + total, 10, 20);
      doc.text(data.nome, 10, 30);
      doc.text(data.endereco, 10, 40);
    }
    document.body.removeChild(container);
  }

  doc.save('etiquetas-transportadora.pdf');
  status.textContent = 'v ' + total + ' etiquetas geradas com sucesso!';
  setTimeout(function(){ status.textContent = ''; }, 4000);
}

function getLabelaryDpi(sel) {
  return sel || '8dpmm';
}

function sleep(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }

async function fetchLabelaryPage(zplPage, dpm, wMm, hMm, attempt) {
  if (!attempt) attempt = 0;
  var wIn = (wMm / 25.4).toFixed(2);
  var hIn = (hMm / 25.4).toFixed(2);
  var url = 'https://api.labelary.com/v1/printers/' + dpm + '/labels/' + wIn + 'x' + hIn + '/0/';
  if (attempt > 0) await sleep(attempt * 1500);
  var resp;
  try {
    resp = await fetch(url, {
      method: 'POST',
      headers: { 'Accept': 'image/png', 'Content-Type': 'application/x-www-form-urlencoded' },
      body: zplPage,
    });
  } catch(e) { throw new Error('Sem conexao com Labelary. Verifique sua internet.'); }
  if (resp.status === 429) {
    if (attempt < 5) return fetchLabelaryPage(zplPage, dpm, wMm, hMm, attempt + 1);
    throw new Error('Limite de requisicoes atingido. Aguarde 30 seg e tente novamente.');
  }
  if (!resp.ok) throw new Error('Labelary erro ' + resp.status + '. Verifique o ZPL.');
  var blob = await resp.blob();
  return new Promise(function(res, rej) {
    var r = new FileReader();
    r.onload = function() { res(r.result); };
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

function splitZplLabels(zpl) {
  var parts = zpl.split(/\^XZ/i).map(function(s){ return s.trim(); }).filter(Boolean);
  return parts.map(function(p) {
    var label = (p.startsWith('^XA') || p.startsWith('^xa')) ? p : ('^XA\n' + p);
    return label + '\n^XZ';
  });
}

  pagesDiv.innerHTML = '';

  try {
    var labels = splitZplLabels(zpl);
    var firstImg = await fetchLabelaryPage(labels[0], dpm, w, h, 0);
    previewDiv.innerHTML = '<img src="' + firstImg + '" style="max-width:100%;max-height:340px;border-radius:4px;border:1px solid var(--border)">';
    if (labels.length > 1) {
      status.textContent = labels.length + ' etiquetas detectadas. Clique em Baixar PDF para gerar todas.';
      var thumbCount = Math.min(labels.length, 4);
      for (var i = 1; i < thumbCount; i++) {

        var el = document.createElement('img');
        el.src = thumb;
        el.style.cssText = 'height:60px;border-radius:4px;border:1px solid var(--border);cursor:pointer';
        el.title = 'Etiqueta ' + (i+1);
        (function(t, pd){ el.onclick = function(){ pd.innerHTML = '<img src="' + t + '" style="max-width:100%;max-height:340px;border-radius:4px;border:1px solid var(--border)">'; }; })(thumb, previewDiv);
        pagesDiv.appendChild(el);
      }
      if (labels.length > thumbCount) {
        var more = document.createElement('span');
        more.textContent = '+' + (labels.length - thumbCount) + ' mais';
        more.style.cssText = 'font-size:0.78rem;color:var(--text3);align-self:center';
        pagesDiv.appendChild(more);
      }
    } else {
      status.textContent = 'Previa gerada com sucesso!';
      setTimeout(function(){ status.textContent = ''; }, 3000);
    }
  } catch(e) {
    status.textContent = 'Erro: ' + e.message;
    previewDiv.innerHTML = '<span style="color:var(--red);font-size:0.85rem">Falha na previa</span>';

async function gerarEtiqueta() {
  var zpl = document.getElementById('zpl-input').value.trim();
  var w = parseFloat(document.getElementById('lbl-w').value) || 100;
  var h = parseFloat(document.getElementById('lbl-h').value) || 150;
  var dpm = document.getElementById('lbl-dpi').value;
  var status = document.getElementById('lbl-status');

  if (!zpl) { status.textContent = 'Por favor, insira o codigo ZPL.'; return; }

  var labels = splitZplLabels(zpl);
  status.textContent = 'Iniciando: ' + labels.length + ' etiqueta(s)...';

  try {
    var jsPDFLib = window.jspdf;
    var orientation = w >= h ? 'landscape' : 'portrait';
    var doc = new jsPDFLib.jsPDF({ orientation: orientation, unit: 'mm', format: [w, h] });

    for (var i = 0; i < labels.length; i++) {
      status.textContent = 'Gerando etiqueta ' + (i+1) + ' de ' + labels.length + '...';
      if (i > 0) await sleep(450);
      var imgData = await fetchLabelaryPage(labels[i], dpm, w, h, 0);
      if (i > 0) doc.addPage([w, h], orientation);
      doc.addImage(imgData, 'PNG', 0, 0, w, h);
    }

    doc.save('etiquetas-costa.pdf');
    addLog('Gerou ' + labels.length + ' etiqueta(s) ZPL em PDF (' + w + 'x' + h + 'mm)');
    status.textContent = 'PDF com ' + labels.length + ' etiqueta(s) baixado com sucesso!';
    setTimeout(function(){ status.textContent = ''; }, 5000);
  } catch(e) {
    status.textContent = 'Erro ao gerar PDF: ' + e.message;
  }
}

function renderAgenda() {
  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const days = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y, m, 1).getDay();
  const total = new Date(y, m+1, 0).getDate();
  const today = new Date();

  let html = `<div style="margin-bottom:1rem;display:flex;gap:8px">
    <button class="btn btn-green" onclick="openModalEvento()">+ Novo Compromisso</button>
  </div>
  <div class="card" style="padding:0">
    <div class="calendar">
      <div class="calendar-header">
        <button class="calendar-nav" onclick="calNav(-1)">‹</button>
        <strong>${months[m]} ${y}</strong>
        <button class="calendar-nav" onclick="calNav(1)">›</button>
      </div>
      <div class="calendar-grid">`;

  days.forEach(d => { html += `<div class="cal-day-header">${d}</div>`; });

  // Pad start
  for (let i = 0; i < first; i++) {
    const d = new Date(y, m, -first+i+1);
    html += `<div class="cal-day other-month"><div class="cal-day-num">${d.getDate()}</div></div>`;
  }

  for (let d = 1; d <= total; d++) {
    const isToday = d === today.getDate() && m === today.getMonth() && y === today.getFullYear();
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const events = state.agenda.filter(e => e.date === dateStr);
    let evHtml = events.map(e => `<div class="cal-event" title="${esc(e.title)}" onclick="viewEvento('${e.id}')">${esc(e.title)}</div>`).join('');
    html += `<div class="cal-day${isToday?' today':''}">
      <div class="cal-day-num">${d}</div>
      ${evHtml}
    </div>`;
  }

  // Pad end
  const remaining = 7 - ((first + total) % 7);
  if (remaining < 7) {
    for (let i = 1; i <= remaining; i++) {
      html += `<div class="cal-day other-month"><div class="cal-day-num">${i}</div></div>`;
    }
  }

  html += `</div></div></div>`;

  // Upcoming events
  const upcoming = state.agenda.sort((a,b)=>a.date.localeCompare(b.date));
  if (upcoming.length) {
    html += `<div class="card" style="margin-top:1rem"><div class="card-header"><span class="card-title">Próximos Compromissos</span></div>`;
    upcoming.slice(0,10).forEach(e => {
      const d = new Date(e.date+'T'+e.time).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
      html += `<div class="flex items-center gap-2 mb-1" style="padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="width:14px;height:14px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0"></span>
        <span class="text-sm" style="flex:1"><strong>${esc(e.title)}</strong></span>
        <span class="text-sm text-muted">${d}</span>
        <button class="task-delete" onclick="deleteEvento('${e.id}')">x</button>
      </div>`;
    });
    html += `</div>`;
  }

  return html;
}

function bindAgenda() {}

function calNav(dir) {
  state.calMonth += dir;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  document.getElementById('page-content').innerHTML = renderAgenda();
  bindAgenda();
}

function openModalEvento() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('modal-content').innerHTML = `
    <h3>Novo Compromisso</h3>
    <input type="text" id="ev-title" placeholder="Título do compromisso">
    <input type="date" id="ev-date" value="${today}">
    <input type="time" id="ev-time" value="09:00">
    <textarea id="ev-desc" placeholder="Descrição (opcional)" style="min-height:60px"></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-green" onclick="saveEvento()">Salvar</button>
    </div>`;
  document.getElementById('modal').style.display = 'flex';
}

function saveEvento() {
  const title = document.getElementById('ev-title').value.trim();
  const date = document.getElementById('ev-date').value;
  const time = document.getElementById('ev-time').value;
  if (!title || !date) return;
  const ev = { id: 'ev_'+Date.now(), title, date, time, desc: document.getElementById('ev-desc').value };
  state.agenda.push(ev);
  addLog(`Adicionou compromisso na agenda: "${title}" em ${date}`);
  saveState();
  closeModal();
  document.getElementById('page-content').innerHTML = renderAgenda();
}

function viewEvento(id) {
  const e = state.agenda.find(x => x.id === id);
  if (!e) return;
  const d = new Date(e.date+'T'+e.time).toLocaleString('pt-BR',{dateStyle:'long',timeStyle:'short'});
  document.getElementById('modal-content').innerHTML = `
    <h3>${esc(e.title)}</h3>
    <p style="color:var(--text2);margin-bottom:1rem">${d}</p>
    ${e.desc ? `<p style="font-size:0.9rem;margin-bottom:1rem">${esc(e.desc)}</p>` : ''}
    <div class="modal-actions">
      <button class="btn btn-red" onclick="deleteEvento('${e.id}');closeModal()">Excluir</button>
      <button class="btn btn-green" onclick="closeModal()">Fechar</button>
    </div>`;
  document.getElementById('modal').style.display = 'flex';
}

function deleteEvento(id) {
  const e = state.agenda.find(x => x.id === id);
  if (e) addLog(`Removeu compromisso da agenda: "${e.title}"`);
  state.agenda = state.agenda.filter(x => x.id !== id);
  saveState();
  document.getElementById('page-content').innerHTML = renderAgenda();
}

async function mlLoadInicio() {
  var chartEl = document.getElementById('inicio-chart-content');
  var diaEl   = document.getElementById('inicio-pedidos-dia');
  var mesEl   = document.getElementById('inicio-pedidos-mes');
  var rankEl  = document.getElementById('inicio-ranking-content');
  if (!chartEl) return;

  // Try to refresh token if expired
  if (!mlTokenValid()) {
    try {
      await mlRefreshToken();
    } catch(e) {
      var noData = '<span style="color:var(--text3);font-size:0.8rem">Conecte o Mercado Livre em Vendas</span>';
      if (chartEl) chartEl.innerHTML = noData;
      if (rankEl)  rankEl.innerHTML  = noData;
      if (diaEl)   diaEl.textContent = '--';
      if (mesEl)   mesEl.textContent = '--';
      return;
    }
  }

  try {
    var result      = await mlFetchVendas();
    var orders      = result.orders;
    var ordersMonth = result.ordersMonth;
    var now         = new Date();

    // Counts
    if (diaEl) diaEl.textContent = result.totalDay;

    // Shopee hoje -- usa cache se disponível, senão tenta carregar
    var shopeeEl = document.getElementById('inicio-pedidos-shopee-dia');
    if (shopeeEl) {
      if (shopeeTokenValid()) {
        if (vendaCacheValido(_shopeeCache)) {
          shopeeEl.textContent = _shopeeCache.data.pedidosHoje || 0;
          if (mesEl) mesEl.textContent = result.totalMonth + (_shopeeCache.data.totalPedidos || 0);
        } else {
          shopeeEl.textContent = '...';
          shopeeCarregarDados().then(function(data) {
            var el2 = document.getElementById('inicio-pedidos-shopee-dia');
            if (el2) el2.textContent = data.pedidosHoje || 0;
            var mesEl2 = document.getElementById('inicio-pedidos-mes');
            if (mesEl2) mesEl2.textContent = result.totalMonth + (data.totalPedidos || 0);
          }).catch(function(){ var el2 = document.getElementById('inicio-pedidos-shopee-dia'); if(el2) el2.textContent = '--'; });
        }
      } else {
        shopeeEl.textContent = '--';
        if (mesEl) mesEl.textContent = result.totalMonth;
      }
    } else {
      if (mesEl) mesEl.textContent = result.totalMonth;
    }

    // Chart SVG
    if (chartEl) {
      var daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
      var chartData = new Array(daysInMonth).fill(0);
      // Also add today's orders from dayData (avoids timezone issues for current day)
      var allForChart = ordersMonth.concat(orders);
      // Deduplicate by order id
      var seenIds = {};
      allForChart = allForChart.filter(function(o) {
        if (!o.id || seenIds[o.id]) return false;
        seenIds[o.id] = true;
        return true;
      });
      allForChart.forEach(function(o) {
        if (!o.date_created) return;
        // Use Brazil timezone (UTC-3) to get correct day
        var d = new Date(new Date(o.date_created).getTime() - 3*60*60*1000);
        var day = d.getUTCDate() - 1;
        var month = d.getUTCMonth();
        var year = d.getUTCFullYear();
        if (year === now.getFullYear() && month === now.getMonth() && day >= 0 && day < daysInMonth) {
          chartData[day]++;
        }
      });
      var maxVal = Math.max.apply(null, chartData) || 1;
      var W = 700, H = 170, padL = 38, padR = 10, padT = 20, padB = 30;
      var iW = W - padL - padR, iH = H - padT - padB;
      var pts = chartData.map(function(v, i) {
        var x = padL + (i / Math.max(daysInMonth-1,1)) * iW;
        var y = padT + iH - (v / maxVal) * iH;
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
      var todayIdx = now.getDate() - 1;
      var tx = (padL + (todayIdx / Math.max(daysInMonth-1,1)) * iW).toFixed(1);
      var ty = (padT + iH - (chartData[todayIdx] / maxVal) * iH).toFixed(1);

      var xLabels = '';
      for (var i = 0; i < daysInMonth; i++) {
        var lx = (padL + (i / Math.max(daysInMonth-1,1)) * iW).toFixed(1);
        // Label every day
        xLabels += '<text x="' + lx + '" y="' + (H-4) + '" fill="var(--text3)" font-size="7.5" text-anchor="middle">' + (i+1) + '</text>';
        // Tick mark
        xLabels += '<line x1="' + lx + '" y1="' + (padT+iH) + '" x2="' + lx + '" y2="' + (padT+iH+3) + '" stroke="var(--border)" stroke-width="1"/>';
      }

      // Y axis labels at 50, 100, 150... up to maxVal rounded to nearest 50
      var yStep = 50;
      var yLines = '';
      for (var yv = yStep; yv <= maxVal; yv += yStep) {
        var ly = (padT + iH - (yv / maxVal) * iH).toFixed(1);
        yLines +=
          '<line x1="' + padL + '" y1="' + ly + '" x2="' + (padL+iW) + '" y2="' + ly + '" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>' +
          '<text x="' + (padL-3) + '" y="' + (parseFloat(ly)+3) + '" fill="var(--text3)" font-size="8" text-anchor="end">' + yv + '</text>';
      }

      chartEl.innerHTML =
        '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' +
          // Axes
          '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT+iH) + '" stroke="var(--border)" stroke-width="1"/>' +
          '<line x1="' + padL + '" y1="' + (padT+iH) + '" x2="' + (padL+iW) + '" y2="' + (padT+iH) + '" stroke="var(--border)" stroke-width="1"/>' +
          // Y grid lines + labels
          yLines +
          // Line chart
          '<polyline points="' + pts + '" fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
          // Today dot + label
          '<circle cx="' + tx + '" cy="' + ty + '" r="4" fill="var(--green)"/>' +
          '<text x="' + tx + '" y="' + (parseFloat(ty)-8) + '" fill="var(--green)" font-size="9" text-anchor="middle" font-weight="bold">' + chartData[todayIdx] + '</text>' +
          // X labels -- every day
          xLabels +
        '</svg>';
    }

    // Ranking top 10
    if (rankEl) {
      var prodMap = mlProdMap(ordersMonth);
      var top10 = Object.entries(prodMap).sort(function(a,b){ return b[1]-a[1]; }).slice(0,10);
      if (!top10.length) {
        rankEl.innerHTML = '<span style="color:var(--text3);font-size:0.8rem">Sem dados do mês</span>';
      } else {
        var maxQ = top10[0][1];
        var medals = ['🥇','🥈','🥉'];
        var html = '<div style="overflow-y:auto;max-height:170px;padding-right:4px">';
        top10.forEach(function(p, i) {
          var bar = Math.round((p[1]/maxQ)*100);
          var icon = i < 3 ? medals[i] : '<span style="font-size:0.75rem;color:var(--text3);min-width:18px;display:inline-block;text-align:center">' + (i+1) + '</span>';
          html +=
            '<div style="margin-bottom:8px">' +
              '<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">' +
                '<span>' + icon + '</span>' +
                '<span style="flex:1;font-size:0.78rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(p[0]) + '">' + esc(p[0]) + '</span>' +
                '<span style="font-size:0.78rem;font-weight:700;color:var(--green);white-space:nowrap">' + p[1] + ' un.</span>' +
              '</div>' +
              '<div style="background:var(--bg3);border-radius:99px;height:4px">' +
                '<div style="background:var(--green);border-radius:99px;height:4px;width:' + bar + '%"></div>' +
              '</div>' +
            '</div>';
        });
        html += '</div>';
        rankEl.innerHTML = html;
      }
    }
  } catch(e) {
    var errMsg = '<span style="color:var(--text3);font-size:0.8rem">Indisponível no momento</span>';
    if (chartEl) chartEl.innerHTML = errMsg;
    if (rankEl)  rankEl.innerHTML  = errMsg;
  }
}

var _prodTab = 'custo'; // 'custo' | 'historico'

function renderProdutos() {
  var tabBar =
    '<div style="display:flex;gap:4px;margin-bottom:1.5rem;border-bottom:1.5px solid var(--border);padding-bottom:0">'+
      '<button class="fin-tab'+(_prodTab==='custo'?' active':'')+'" onclick="prodSetTab(\'custo\')" style="font-size:0.88rem">📦 Custo dos Produtos</button>'+
      '<button class="fin-tab'+(_prodTab==='historico'?' active':'')+'" onclick="prodSetTab(\'historico\')" style="font-size:0.88rem">📈 Histórico de Preços</button>'+
    '</div>';

  if (_prodTab === 'custo') {
    // Garante que custoProdutos está carregado
    var custos = state.financeiro.custoProdutos || {};
    if (Object.keys(custos).length === 0 && !_estoqueCustoCarregando) {
      _estoqueCustoCarregando = true;
      fetch(FIREBASE_URL + '/financeiro/meta.json')
        .then(function(r){ return r.json(); })
        .then(function(meta){
          _estoqueCustoCarregando = false;
          if (meta && meta.custoProdutos) {
            state.financeiro.custoProdutos = meta.custoProdutos;
            if (meta.tarifasSku) state.financeiro.tarifasSku = meta.tarifasSku;
            if (meta.aliquota !== undefined) state.financeiro.aliquota = meta.aliquota;
            var c = document.getElementById('page-content');
            if (c && state.currentPage === 'produtos') c.innerHTML = renderProdutos();
          }
        })
        .catch(function(){ _estoqueCustoCarregando = false; });
    }
    return tabBar + renderEstoqueCusto();
  }

  if (_prodTab === 'historico') {
    return tabBar + renderEstoqueHistorico();
  }

  return tabBar;
}

function prodSetTab(t) {
  _prodTab = t;
  var c = document.getElementById('page-content');
  if (c) c.innerHTML = renderProdutos();
}

function finSetTab(t) {
  _finTab = t;

  document.querySelectorAll('.fin-tab').forEach(function(el){
    el.classList.toggle('active', el.dataset.tab === t);

    if (el) el.style.display = 'none';
  });

function finFmt(v) {
  var n = parseFloat(v) || 0;
  return 'R$ ' + Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function finParseBRL(v) {
  if (!v) return 0;
  return parseFloat(String(v).replace(/BRL\s*/g,'').replace(/\./g,'').replace(',','.').trim()) || 0;
}

var ML_INVALID = ['Cancelada pelo comprador','Venda cancelada. Não envie.','Cancelada. Não despache',
  'O seu comprador quer cancelar','Devolução em preparação','Devolução a caminho'];

var SKU_NAMES = {
  'oleo3':'Óleo de Coco 3L','oleo1':'Óleo de Coco 1L','oleo500':'Óleo de Coco 500mL',
  'aveia500':'Aveia Flocos 500g','aveia1':'Aveia Flocos 1Kg','chips50':'Chips Vegetais 50g',
  'chips500':'Chips Vegetais 500g','chia100':'Semente de Chia 100g','chia1':'Semente de Chia 1Kg',
  'chia':'Semente de Chia','caju100':'Castanha de Caju 100g','caju1':'Castanha de Caju 1Kg',
  'uva100':'Uva Passa Preta 100g','uva1':'Uva Passa Preta 1Kg','uva':'Uva Passa Preta',
  'sal100':'Flor de Sal 100g','sal1':'Flor de Sal 1Kg','flordesal':'Flor de Sal',
  'frutas50':'Frutas Tropicais 50g','frutas500':'Frutas Tropicais 500g',
  'psy100':'Psyllium 100g','psy1':'Psyllium 1Kg','psyllium':'Psyllium',
  'nozes100':'Nozes Quartz 100g','nozes1':'Nozes Quartz 1Kg',
  'linhaca100':'Linhaça Dourada 100g','linhaca1':'Linhaça Dourada 1Kg','linhaca':'Linhaça Dourada',
  'beterraba100':'Beterraba 100g','beterraba1':'Beterraba 1Kg',
  'abobora100':'Sem. Abóbora 100g','abobora1':'Sem. Abóbora 1Kg',
  'arroz200':'Flocos Arroz Natural 200g','arroz400':'Flocos Arroz Natural 400g',
  'cacau200':'Flocos Arroz Cacau 200g','cacau500':'Flocos Arroz Cacau 500g','cacau400':'Flocos Arroz Cacau 400g',
  'coco400':'Chips de Coco 400g','coco100':'Chips de Coco 100g',
};

function finCalcMes() {
  var meses = state.financeiro.meses || {};
  if (!_finMesSel) {
    var keys = Object.keys(meses).sort().reverse();
    _finMesSel = keys[0] || '';
  }
  var mes = _finMesSel ? meses[_finMesSel] : null;
  var res = { fat_ml:0, fat_sp:0, fat_tt:0, fat:0, taxas_ml:0, taxas_sp:0, taxas_tt:0, taxas:0,
              despesas:0, imposto:0, lucro:0, skus:[] };
  if (!mes) return res;

  var skuMl={}, skuSp={}, skuTt={};
  var fatSkuMl={}, fatSkuSp={}, fatSkuTt={}; // faturamento por SKU por plataforma
  var tarifas = state.financeiro.tarifasSku || {};
  var usaTarifasCustom = Object.keys(tarifas).length > 0;

  // ML
  if (mes.ml && mes.ml.length) {
    mes.ml.forEach(function(r) {
      var estado = String(r['Estado']||'');
      if (ML_INVALID.some(function(x){ return estado.indexOf(x)!==-1; })) return;
      if (estado.indexOf('Pacote de')!==-1) return;
      var sku = String(r['SKU']||'').trim().toLowerCase();
      if (!sku || sku==='nan') return;
      if (!SKU_NAMES[sku]) return;
      var preco = parseFloat(String(r['Preço unitário de venda do anúncio (BRL)']||'').replace(',','.'))||0;
      var uni   = parseFloat(String(r['Unidades']||'').replace(',','.'))||0;
      var fatLinha = preco * uni;
      res.fat_ml += fatLinha;
      skuMl[sku] = (skuMl[sku]||0) + uni;
      fatSkuMl[sku] = (fatSkuMl[sku]||0) + fatLinha;

      // Tarifa: custom ou da planilha
      if (usaTarifasCustom && tarifas[sku] && tarifas[sku].ml) {
        var t = tarifas[sku].ml;
        res.taxas_ml += fatLinha * ((t.pctVenda||0)/100) + (t.envio||0) * uni;
      } else {
        var tar = parseFloat(String(r['Tarifa de venda e impostos (BRL)']||'').replace(',','.'))||0;
        var env = parseFloat(String(r['Tarifas de envio (BRL)']||'').replace(',','.'))||0;
        res.taxas_ml += Math.abs(tar) + Math.abs(env);
      }
    });
  }

  // Shopee
  if (mes.sp && mes.sp.length) {
    mes.sp.forEach(function(r) {
      var status = String(r['Status do pedido']||'');
      if (status==='Cancelado') return;
      var sku = String(r['Número de referência SKU']||'').trim().toLowerCase();
      if (!sku) return;
      if (!SKU_NAMES[sku]) return;
      var vt  = parseFloat(r['Valor Total'])||0;
      var com = parseFloat(r['Taxa de comissão bruta'])||0;
      var srv = parseFloat(r['Taxa de serviço bruta'])||0;
      var qty = parseInt(r['Quantidade'])||0;
      res.fat_sp += vt;
      skuSp[sku] = (skuSp[sku]||0) + qty;
      fatSkuSp[sku] = (fatSkuSp[sku]||0) + vt;

      if (usaTarifasCustom && tarifas[sku] && tarifas[sku].sp) {
        var ts = tarifas[sku].sp;
        res.taxas_sp += vt * ((ts.pctVenda||0)/100) + (ts.envio||0) * qty;
      } else {
        res.taxas_sp += (com+srv);
      }
    });
  }

  // TikTok
  if (mes.tt && mes.tt.length) {
    var ttSeen = {};
    mes.tt.forEach(function(r) {
      var st = String(r['Order Status']||'');
      if (st==='Cancelado'||st==='Não pago') return;
      var sku = String(r['Seller SKU']||'').trim();
      var oid = String(r['Order ID']||'');
      var qty = parseInt(r['Quantity'])||0;
      // Ignora SKUs que não estão no catálogo da plataforma
      if (!sku || !SKU_NAMES[sku.toLowerCase()]) return;
      // Valor de venda = SKU Subtotal Before Discount - SKU Platform Discount - SKU Seller Discount
      var before   = finParseBRL(r['SKU Subtotal Before Discount']);
      var platDisc = finParseBRL(r['SKU Platform Discount']);
      var sellDisc = finParseBRL(r['SKU Seller Discount']);
      var valVenda = before - platDisc - sellDisc;
      // Fallback para SKU Subtotal After Discount se os campos não existirem
      if (!before && !platDisc && !sellDisc) {
        valVenda = finParseBRL(r['SKU Subtotal After Discount']);
      }
      // Tarifa TikTok: custom ou padrão 12% + R$4
      var tarifa;
      var skuLow = sku.toLowerCase();
      if (usaTarifasCustom && tarifas[skuLow] && tarifas[skuLow].tt) {
        var tt2 = tarifas[skuLow].tt;
        tarifa = valVenda * ((tt2.pctVenda||0)/100) + (tt2.envio||0) * qty;
      } else {
        tarifa = valVenda * 0.12 + 4 * qty;
      }
      var key = oid+'|'+sku;
      if (!ttSeen[key]) {
        ttSeen[key]=true;
        res.fat_tt   += valVenda;
        res.taxas_tt  = (res.taxas_tt||0) + tarifa;
        skuTt[skuLow]=(skuTt[skuLow]||0)+qty;
        fatSkuTt[skuLow]=(fatSkuTt[skuLow]||0)+valVenda;
      }
    });
  }

  res.fat   = res.fat_ml + res.fat_sp + res.fat_tt;
  res.taxas = res.taxas_ml + res.taxas_sp + (res.taxas_tt||0);

  var despObj = state.financeiro.despesas || {};
  var desp = Array.isArray(despObj) ? despObj : (despObj[_finMesSel] || []);
  res.despesas = desp.reduce(function(s,d){ return s+(d.valor||0);},0);

  var aliq = parseFloat(state.financeiro.aliquota)||0;
  res.imposto = res.fat * (aliq/100);

  // Custo dos produtos — merge correto sem duplicar SKUs entre plataformas
  var custos = state.financeiro.custoProdutos || {};
  res.custoProd = 0;
  res.custoProdDetalhe = []; // para a página de detalhe
  var skuAllKeys = {};
  Object.keys(skuMl).forEach(function(s){ skuAllKeys[s.toLowerCase().trim()] = true; });
  Object.keys(skuSp).forEach(function(s){ skuAllKeys[s.toLowerCase().trim()] = true; });
  Object.keys(skuTt).forEach(function(s){ skuAllKeys[s.toLowerCase().trim()] = true; });
  Object.keys(skuAllKeys).forEach(function(k){
    var c = custos[k];
    var qtdMl  = skuMl[k]  || 0;
    var qtdSp  = skuSp[k]  || 0;
    var qtdTt  = skuTt[k]  || 0;
    var qtd = qtdMl + qtdSp + qtdTt;
    if (!qtd) return;
    if (!c || c.custoFinal === undefined) {
      res.custoProdDetalhe.push({ sku:k, nome:SKU_NAMES[k]||k, qtd:qtd, custo:null, total:null });
      return;
    }
    var total = qtd * c.custoFinal;
    res.custoProd += total;
    res.custoProdDetalhe.push({ sku:k, nome:SKU_NAMES[k]||k, qtd:qtd, custo:c.custoFinal, total:total });
  });
  res.custoProd = Math.round(res.custoProd * 100) / 100;
  res.custoProdDetalhe.sort(function(a,b){ return (b.total||0)-(a.total||0); });

  // Detalhe ML para página de drill-down
  res.mlDetalhe = { linhas:0, filtradas:0, semSku:0 };
  if (mes.ml) {
    mes.ml.forEach(function(r){
      res.mlDetalhe.linhas++;
      var estado = String(r['Estado']||'');
      if (ML_INVALID.some(function(x){ return estado.indexOf(x)!==-1; })) { res.mlDetalhe.filtradas++; return; }
      if (estado.indexOf('Pacote de')!==-1) { res.mlDetalhe.filtradas++; return; }
      var sku = String(r['SKU']||'').trim();
      if (!sku || sku==='nan') { res.mlDetalhe.semSku++; }
    });
  }
  // Detalhe Shopee
  res.spDetalhe = { linhas:0, cancelados:0 };
  if (mes.sp) {
    mes.sp.forEach(function(r){
      res.spDetalhe.linhas++;
      if (String(r['Status do pedido']||'')==='Cancelado') res.spDetalhe.cancelados++;
    });
  }

  res.lucro = res.fat - res.taxas - res.despesas - res.imposto - res.custoProd;

  // SKU merge
  var all = {};
  function addSku(map, plat) {
    Object.keys(map).forEach(function(sku){
      var k = sku.toLowerCase().trim();
      if (!all[k]) all[k]={ name:SKU_NAMES[k]||sku, ml:0, shopee:0, tiktok:0, total:0 };
      all[k][plat] += map[sku];
      all[k].total += map[sku];
    });
  }
  addSku(skuMl,'ml'); addSku(skuSp,'shopee'); addSku(skuTt,'tiktok');
  res.skus = Object.values(all).sort(function(a,b){ return b.total-a.total; });

  // Preço médio por SKU em cada plataforma (faturamento / quantidade) -- usado em Margem em Tempo Real
  res.precoMedioSku = {};
  Object.keys(skuAllKeys).forEach(function(k){
    res.precoMedioSku[k] = {
      ml:     skuMl[k] ? (fatSkuMl[k]||0) / skuMl[k] : null,
      shopee: skuSp[k] ? (fatSkuSp[k]||0) / skuSp[k] : null,
      tiktok: skuTt[k] ? (fatSkuTt[k]||0) / skuTt[k] : null,
    };
  });

  return res;
}

            'Coluna "Valor Total" (valor pago pelo comprador)'+
          '</div>'+
        '</div>'+

        // TikTok
        '<div class="card" style="padding:1.25rem">'+
          '<div style="font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#1a1a1a;margin-bottom:1rem">⚫ TikTok Shop</div>'+
          '<div style="font-size:1.5rem;font-weight:800;color:var(--text)">'+finFmt(calc.fat_tt)+'</div>'+
          '<div style="margin-top:1rem;display:flex;flex-direction:column;gap:6px">'+
            '<div style="display:flex;justify-content:space-between;font-size:0.82rem;padding:5px 0;border-bottom:0.5px solid var(--border)"><span style="color:var(--text2)">Total de itens (dedup.)</span><span style="font-weight:600">'+ttRows.length+'</span></div>'+
            '<div style="display:flex;justify-content:space-between;font-size:0.82rem;padding:5px 0;border-bottom:0.5px solid var(--border)"><span style="color:var(--red)">Cancelados/Não pagos</span><span style="font-weight:600;color:var(--red)">− '+ttCancelados+'</span></div>'+
            '<div style="display:flex;justify-content:space-between;font-size:0.82rem;padding:7px 0"><span style="color:var(--green);font-weight:600">✓ Válidos somados</span><span style="font-weight:700;color:var(--green)">'+(ttRows.length-ttCancelados)+'</span></div>'+
          '</div>'+
          '<div style="margin-top:0.75rem;padding:8px 10px;background:rgba(26,26,26,0.05);border-radius:8px;font-size:0.75rem;color:var(--text3)">'+
            'Before Discount − Platform Discount − Seller Discount. Deduplicado por Order ID + SKU.'+
          '</div>'+
        '</div>'+

      '</div>'+
      '<div class="card" style="padding:1rem;font-size:0.83rem;color:var(--text2)">'+
        '<strong>ℹ️ Por que difere do painel das plataformas?</strong><br>'+
        'ML reporta "Vendas brutas" (inclui cancelamentos em aberto). Shopee no painel inclui descontos de Ads separadamente. TikTok pode diferir por conta do cálculo de descontos. A plataforma sempre usa o valor final da planilha exportada.'+
      '</div>';
  }

  // ── TAXAS ───────────────────────────────────────────────────
  if (card === 'taxas') {
    return voltar +
      '<div style="font-size:1.1rem;font-weight:700;margin-bottom:1.5rem">🏦 Detalhe das Taxas de Venda</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.25rem">'+

        // ML
        '<div class="card" style="padding:1.25rem">'+
          '<div style="font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#EAB308;margin-bottom:1rem">🟡 Taxas Mercado Livre</div>'+
          '<div style="font-size:1.6rem;font-weight:800;color:var(--amber)">'+finFmt(calc.taxas_ml)+'</div>'+
          '<div style="margin-top:0.75rem;padding:10px;background:rgba(234,179,8,0.06);border-radius:8px;font-size:0.78rem;color:var(--text2)">'+
            '<div style="margin-bottom:4px">📋 <strong>Tarifa de venda e impostos (BRL)</strong></div>'+
            '<div>📋 <strong>Tarifas de envio (BRL)</strong></div>'+
            '<div style="margin-top:6px;color:var(--text3)">Ambas negativas na planilha → convertidas para positivo</div>'+
          '</div>'+
          (calc.fat_ml>0?'<div style="margin-top:10px;font-size:0.85rem;color:var(--text2)">% sobre faturamento ML: <strong>'+((calc.taxas_ml/calc.fat_ml)*100).toFixed(1)+'%</strong></div>':'')+
        '</div>'+

        // Shopee
        '<div class="card" style="padding:1.25rem">'+
          '<div style="font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#F97316;margin-bottom:1rem">🟠 Taxas Shopee</div>'+
          '<div style="font-size:1.6rem;font-weight:800;color:var(--amber)">'+finFmt(calc.taxas_sp)+'</div>'+
          '<div style="margin-top:0.75rem;padding:10px;background:rgba(249,115,22,0.06);border-radius:8px;font-size:0.78rem;color:var(--text2)">'+
            '<div style="margin-bottom:4px">📋 <strong>Taxa de comissão bruta</strong></div>'+
            '<div>📋 <strong>Taxa de serviço bruta</strong></div>'+
            '<div style="margin-top:6px;color:var(--text3)">Soma das duas colunas por pedido válido</div>'+
          '</div>'+
          (calc.fat_sp>0?'<div style="margin-top:10px;font-size:0.85rem;color:var(--text2)">% sobre faturamento Shopee: <strong>'+((calc.taxas_sp/calc.fat_sp)*100).toFixed(1)+'%</strong></div>':'')+
        '</div>'+

        // TikTok
        '<div class="card" style="padding:1.25rem">'+
          '<div style="font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#1a1a1a;margin-bottom:1rem">⚫ Taxas TikTok Shop</div>'+
          '<div style="font-size:1.6rem;font-weight:800;color:var(--amber)">'+finFmt(calc.taxas_tt||0)+'</div>'+
          '<div style="margin-top:0.75rem;padding:10px;background:rgba(26,26,26,0.05);border-radius:8px;font-size:0.78rem;color:var(--text2)">'+
            '<div style="margin-bottom:6px">Calculado por item vendido:</div>'+
            '<div style="font-family:monospace;background:var(--bg3);padding:6px 10px;border-radius:6px;font-size:0.77rem">Valor × 12% + R$ 4,00 por unidade</div>'+
            '<div style="margin-top:6px;color:var(--text3)">Valor = Before − Platform Discount − Seller Discount</div>'+
          '</div>'+
          (calc.fat_tt>0?'<div style="margin-top:10px;font-size:0.85rem;color:var(--text2)">% sobre faturamento TikTok: <strong>'+((calc.taxas_tt||0)/calc.fat_tt*100).toFixed(1)+'%</strong></div>':
            '<div style="margin-top:10px;font-size:0.82rem;color:var(--text3)">Sem vendas TikTok neste mês</div>')+
        '</div>'+

      '</div>'+
      '<div class="card" style="padding:1rem;margin-top:1rem;font-size:0.88rem">'+
        '<div style="display:flex;justify-content:space-between;align-items:center">'+
          '<div>'+
            '<div style="color:var(--text2);font-weight:600">Total de taxas</div>'+
            '<div style="font-size:0.75rem;color:var(--text3);margin-top:2px">'+
              'ML '+finFmt(calc.taxas_ml)+' · Shopee '+finFmt(calc.taxas_sp)+' · TikTok '+finFmt(calc.taxas_tt||0)+
            '</div>'+
          '</div>'+
          '<span style="font-size:1.2rem;font-weight:800;color:var(--amber)">'+finFmt(calc.taxas)+'</span>'+
        '</div>'+
        (calc.fat>0?'<div style="font-size:0.8rem;color:var(--text3);margin-top:4px">'+((calc.taxas/calc.fat)*100).toFixed(1)+'% do faturamento total</div>':'')+
      '</div>';
  }

  if (card === 'custo') {
    var custos2 = state.financeiro.custoProdutos || {};
    var skuVendas = {};
    var mesData = _finMesSel ? (state.financeiro.meses||{})[_finMesSel] : null;
    if (mesData) {
      var ML_INV2 = ['Cancelada pelo comprador','Venda cancelada. Não envie.','Cancelada. Não despache','O seu comprador quer cancelar','Devolução em preparação','Devolução a caminho'];
      if (mesData.ml) mesData.ml.forEach(function(r){
        var estado = String(r['Estado']||'');
        if (ML_INV2.some(function(x){ return estado.indexOf(x)!==-1; })) return;
        if (estado.indexOf('Pacote de')!==-1) return;
        var sku = String(r['SKU']||'').trim().toLowerCase(); if (!sku||sku==='nan') return;
        if (!skuVendas[sku]) skuVendas[sku]={ml:0,sp:0,tt:0};
        skuVendas[sku].ml += parseFloat(r['Unidades'])||0;
      });
      if (mesData.sp) mesData.sp.forEach(function(r){
        if (String(r['Status do pedido']||'')==='Cancelado') return;
        var sku = String(r['Número de referência SKU']||'').trim().toLowerCase(); if (!sku) return;
        if (!skuVendas[sku]) skuVendas[sku]={ml:0,sp:0,tt:0};
        skuVendas[sku].sp += parseInt(r['Quantidade'])||0;
      });
      if (mesData.tt) { var ttSeen2={};
        mesData.tt.forEach(function(r){
          var st=String(r['Order Status']||''); if(st==='Cancelado'||st==='Não pago') return;
          var sku=String(r['Seller SKU']||'').trim().toLowerCase(); var oid=String(r['Order ID']||'');
          var key=oid+'|'+sku; if(ttSeen2[key]) return; ttSeen2[key]=true;
          if (!skuVendas[sku]) skuVendas[sku]={ml:0,sp:0,tt:0};
          skuVendas[sku].tt += parseInt(r['Quantity'])||0;
        });
      }
    }
    var linhas = PRODUTOS_CUSTO.map(function(p){
      var v = skuVendas[p.sku] || {ml:0,sp:0,tt:0};
      var qtd = v.ml + v.sp + v.tt;
      var c = custos2[p.sku];
      var custo = (c && c.custoFinal !== undefined) ? c.custoFinal : null;
      var total = (custo !== null) ? qtd * custo : null;
      return { sku:p.sku, nome:p.nome, qtd:qtd, ml:v.ml, sp:v.sp, tt:v.tt, custo:custo, total:total };
    });
    var ord = _finCustoOrdem || 'vendas';
    if (ord==='vendas') linhas.sort(function(a,b){ return b.qtd-a.qtd; });
    else if (ord==='total') linhas.sort(function(a,b){ return (b.total||0)-(a.total||0); });
    else linhas.sort(function(a,b){ return a.sku.localeCompare(b.sku); });
    var totalGeral = linhas.reduce(function(s,r){ return s+(r.total||0); },0);
    var semCusto2 = linhas.filter(function(r){ return r.custo===null; });
    function btnOrd(id, label) {
      var ativo = ord===id;
      return '<button onclick="_finCustoOrdem=\''+id+'\';var c=document.getElementById(\'page-content\');if(c)c.innerHTML=renderFinanceiro();" style="padding:5px 12px;border:0.5px solid '+(ativo?'var(--green)':'var(--border2)')+';border-radius:7px;background:'+(ativo?'rgba(26,138,74,0.1)':'var(--card)')+';color:'+(ativo?'var(--green)':'var(--text2)')+';cursor:pointer;font-size:0.78rem;font-weight:'+(ativo?'700':'400')+'">'+label+'</button>';
    }
    return voltar +
      '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:1rem">'+
        '<div>'+
          '<div style="font-size:1.1rem;font-weight:700">📦 Custo de Produtos</div>'+
          '<div style="font-size:0.8rem;color:var(--text3);margin-top:2px">Mês: '+(_finMesSel||'—')+' · todos os SKUs do catálogo</div>'+
        '</div>'+
        '<div style="display:flex;gap:6px">'+btnOrd('vendas','↓ Mais vendidos')+btnOrd('total','↓ Maior custo')+btnOrd('sku','A→Z')+'</div>'+
      '</div>'+
      '<div class="card" style="padding:1rem;margin-bottom:1rem">'+
        '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;text-align:center">'+
          '<div><div style="font-size:0.68rem;color:var(--text3);text-transform:uppercase">Total custo mês</div><div style="font-size:1.2rem;font-weight:800;color:#8b5cf6">'+finFmt(totalGeral)+'</div></div>'+
          '<div><div style="font-size:0.68rem;color:var(--text3);text-transform:uppercase">SKUs vendidos</div><div style="font-size:1.2rem;font-weight:800;color:var(--green)">'+linhas.filter(function(r){return r.qtd>0;}).length+'</div></div>'+
          '<div><div style="font-size:0.68rem;color:var(--text3);text-transform:uppercase">SKUs zerados</div><div style="font-size:1.2rem;font-weight:800;color:var(--text3)">'+linhas.filter(function(r){return r.qtd===0;}).length+'</div></div>'+
          '<div><div style="font-size:0.68rem;color:var(--text3);text-transform:uppercase">Sem custo</div><div style="font-size:1.2rem;font-weight:800;color:var(--amber)">'+semCusto2.length+'</div></div>'+
        '</div>'+
      '</div>'+
      '<div class="card" style="padding:0;overflow:hidden">'+
        '<table style="width:100%;border-collapse:collapse;font-size:0.82rem">'+
          '<thead><tr style="background:var(--bg3);border-bottom:2px solid var(--border)">'+
            '<th style="padding:8px 12px;text-align:left;font-size:0.7rem;color:var(--text3);text-transform:uppercase">Produto</th>'+
            '<th style="padding:8px 12px;text-align:center;font-size:0.7rem;color:var(--text3);text-transform:uppercase">SKU</th>'+
            '<th style="padding:8px 12px;text-align:right;font-size:0.7rem;color:#f97316;text-transform:uppercase">ML</th>'+
            '<th style="padding:8px 12px;text-align:right;font-size:0.7rem;color:#EE4D2D;text-transform:uppercase">SP</th>'+
            '<th style="padding:8px 12px;text-align:right;font-size:0.7rem;color:#6366f1;text-transform:uppercase">TT</th>'+
            '<th style="padding:8px 12px;text-align:right;font-size:0.7rem;color:var(--text3);text-transform:uppercase">Total un.</th>'+
            '<th style="padding:8px 12px;text-align:right;font-size:0.7rem;color:var(--text3);text-transform:uppercase">Custo unit.</th>'+
            '<th style="padding:8px 12px;text-align:right;font-size:0.7rem;color:#8b5cf6;text-transform:uppercase">Total</th>'+
          '</tr></thead><tbody>'+
          linhas.map(function(r,i){
            var zerado = r.qtd===0;
            return '<tr style="border-bottom:0.5px solid var(--border);opacity:'+(zerado?'0.55':'1')+';'+(i%2===1?'background:var(--bg3)':'')+'">' +
              '<td style="padding:7px 12px;font-weight:'+(r.qtd>0?'600':'400')+'">'+esc(r.nome)+'</td>'+
              '<td style="padding:7px 12px;text-align:center;font-family:monospace;font-size:0.75rem;color:var(--text3)">'+r.sku+'</td>'+
              '<td style="padding:7px 12px;text-align:right;color:'+(r.ml>0?'#EAB308':'var(--text3)')+'">'+r.ml+'</td>'+
              '<td style="padding:7px 12px;text-align:right;color:'+(r.sp>0?'#EE4D2D':'var(--text3)')+'">'+r.sp+'</td>'+
              '<td style="padding:7px 12px;text-align:right;color:'+(r.tt>0?'#6366f1':'var(--text3)')+'">'+r.tt+'</td>'+
              '<td style="padding:7px 12px;text-align:right;font-weight:700">'+r.qtd+'</td>'+
              '<td style="padding:7px 12px;text-align:right;color:var(--text2)">'+(r.custo!==null?finFmt(r.custo):'<span style="color:var(--amber);font-size:0.75rem">⚠ sem custo</span>')+'</td>'+
              '<td style="padding:7px 12px;text-align:right;font-weight:700;color:'+(r.custo===null?'var(--amber)':'#8b5cf6')+'">'+(r.total!==null?finFmt(r.total):'—')+'</td>'+
            '</tr>';
          }).join('')+
          '<tr style="background:var(--bg3);border-top:2px solid var(--border)">'+
            '<td colspan="7" style="padding:9px 12px;font-weight:700">Total geral</td>'+
            '<td style="padding:9px 12px;text-align:right;font-weight:800;font-size:1rem;color:#8b5cf6">'+finFmt(totalGeral)+'</td>'+
          '</tr>'+
        '</tbody></table>'+
      '</div>'+
      (semCusto2.length?'<div class="card" style="padding:0.875rem 1rem;margin-top:0.75rem;background:rgba(186,117,23,0.06);border-color:rgba(186,117,23,0.2);font-size:0.82rem;color:var(--text2)">'+
        '⚠️ '+semCusto2.length+' SKU(s) sem custo cadastrado. '+
        '<button onclick="prodSetTab(\'custo\');navigate(\'produtos\')" style="background:none;border:none;color:var(--green);cursor:pointer;font-size:0.82rem;text-decoration:underline">Cadastrar agora →</button>'+
      '</div>':'');
  }

  // ── DESPESAS ────────────────────────────────────────────────
  if (card === 'despesas') {
    var p = (_finMesSel||'').split('-');
    var MONTHS3 = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    var mesLbl = _finMesSel ? ((MONTHS3[parseInt(p[1])-1]||p[1])+'/'+p[0]) : 'todos';
    return voltar +
      '<div style="font-size:1.1rem;font-weight:700;margin-bottom:0.25rem">💸 Despesas — '+mesLbl+'</div>'+
      '<div style="font-size:0.82rem;color:var(--text3);margin-bottom:1.5rem">Apenas do mês selecionado. Troque o mês pela seleção acima.</div>'+
      (desp.length===0?
        '<div class="card" style="padding:2rem;text-align:center;color:var(--text3)">Nenhuma despesa cadastrada para este mês.</div>'
      :
        '<div class="card" style="padding:0;overflow:hidden">'+
          '<table style="width:100%;border-collapse:collapse;font-size:0.85rem">'+
            '<thead><tr style="background:var(--bg3);border-bottom:2px solid var(--border)">'+
              '<th style="padding:10px 16px;text-align:left">Descrição</th>'+
              '<th style="padding:10px 16px;text-align:center">Data</th>'+
              '<th style="padding:10px 16px;text-align:right;color:var(--red)">Valor</th>'+
            '</tr></thead><tbody>'+
            desp.map(function(d,i){
              return '<tr style="border-bottom:0.5px solid var(--border)'+(i%2===1?';background:var(--bg3)':'')+'">' +
                '<td style="padding:9px 16px">'+esc(d.desc)+'</td>'+
                '<td style="padding:9px 16px;text-align:center;color:var(--text3)">'+esc(d.data||'—')+'</td>'+
                '<td style="padding:9px 16px;text-align:right;font-weight:700;color:var(--red)">'+finFmt(d.valor)+'</td>'+
              '</tr>';
            }).join('')+
            '<tr style="background:var(--bg3);border-top:2px solid var(--border)">'+
              '<td colspan="2" style="padding:10px 16px;font-weight:700">Total</td>'+
              '<td style="padding:10px 16px;text-align:right;font-weight:800;font-size:1rem;color:var(--red)">'+finFmt(calc.despesas)+'</td>'+
            '</tr>'+
          '</tbody></table>'+
        '</div>'
      );
  }

  // ── LUCRO ───────────────────────────────────────────────────
  if (card === 'lucro') {
    var lucroColor = calc.lucro>=0?'var(--green)':'var(--red)';
    var itens = [
      { label:'💰 Faturamento Total',    val: calc.fat,       cor:'var(--green)', sinal:'+' },
      { label:'🏦 Taxas de Venda',       val: calc.taxas,     cor:'var(--amber)', sinal:'−' },
      { label:'📦 Custo de Produtos',    val: calc.custoProd, cor:'#8b5cf6',      sinal:'−' },
      { label:'💸 Despesas',             val: calc.despesas,  cor:'var(--red)',   sinal:'−' },
      { label:'🧾 Imposto ('+aliq+'%)', val: calc.imposto,   cor:'#0ea5e9',      sinal:'−' },
    ];
    return voltar +
      '<div style="font-size:1.1rem;font-weight:700;margin-bottom:1.5rem">📈 Composição do Lucro Líquido</div>'+
      '<div class="card" style="padding:1.5rem;max-width:560px">'+
        itens.map(function(item, i){
          var pct = calc.fat>0 ? (item.val/calc.fat*100).toFixed(1) : '0';
          return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--border)">'+
            '<div>'+
              '<div style="font-size:0.9rem;font-weight:500">'+item.label+'</div>'+
              '<div style="font-size:0.75rem;color:var(--text3)">'+pct+'% do faturamento</div>'+
            '</div>'+
            '<div style="font-size:1rem;font-weight:700;color:'+item.cor+'">'+item.sinal+' '+finFmt(item.val)+'</div>'+
          '</div>';
        }).join('')+
        '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0 0">'+
          '<div style="font-size:1rem;font-weight:700">= Lucro Líquido</div>'+
          '<div style="font-size:1.4rem;font-weight:800;color:'+lucroColor+'">'+(calc.lucro<0?'− ':'')+finFmt(Math.abs(calc.lucro))+'</div>'+
        '</div>'+
        (calc.fat>0?'<div style="font-size:0.78rem;color:var(--text3);margin-top:6px">Margem líquida: <strong style="color:'+lucroColor+'">'+(calc.lucro/calc.fat*100).toFixed(1)+'%</strong></div>':'')+
      '</div>';
  }

  return voltar + '<div class="empty-state">'+iconEmpty()+'<p>Detalhe não disponível</p></div>';
}

var _mktsTab = 'ml'; // 'ml' | 'sp' | 'tt'
var _mktsVerTodos = false;
var _mktsMesSel  = ''; // mês independente

// [RADAR -- carregado de pages/radar.js]
</script>
<script src="pages/ponto.js?v=2"></script>
<script src="pages/estoque.js?v=2"></script>
<script src="pages/shopee.js?v=2"></script>
<script src="pages/tabnutri.js?v=2"></script>
<script src="pages/produtos.js?v=2"></script>
<script src="pages/radar.js?v=2"></script>
<script>
// Remove Service Worker completamente
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    regs.forEach(function(r) { r.unregister(); });
  });
  caches.keys().then(function(names) {
    names.forEach(function(n) { caches.delete(n); });
  });
}
</script>
