<style>
/* ── GLASS THEME — CLARO ─────────────────────────────────── */
:root {
  --bg: #dfe8f0;
  --bg2: rgba(255,255,255,0.55);
  --bg3: rgba(255,255,255,0.35);
  --bg-gradient: linear-gradient(135deg, #dfe8f0 0%, #e8edf5 50%, #dce4ee 100%);

  --sidebar-bg:     rgba(255,255,255,0.45);
  --sidebar-border: rgba(255,255,255,0.75);
  --sidebar-hover:  rgba(255,255,255,0.6);
  --sidebar-active: rgba(255,255,255,0.75);

  --text:  #1e2d3d;
  --text2: #5a7080;
  --text3: #8fa3b5;

  --border:    rgba(255,255,255,0.75);
  --border2:   rgba(0,0,0,0.08);

  --green:  #1a8a4a;
  --green2: #146e3a;
  --red:    #c0392b;
  --red2:   #a93226;
  --blue:   #1a8a4a;
  --amber:  #BA7517;

  --card:     rgba(255,255,255,0.55);
  --card2:    rgba(255,255,255,0.50);
  --input-bg: rgba(255,255,255,0.6);

  --shadow: 0 2px 12px rgba(140,165,195,0.15);
  --glass-blur: blur(20px);
  --nav-active-text: #146e3a;
  --nav-active-icon: #1a8a4a;
}

/* ── GLASS THEME — ESCURO ────────────────────────────────── */
[data-theme="dark"] {
  --bg: #1a1c1e;
  --bg2: rgba(255,255,255,0.05);
  --bg3: rgba(255,255,255,0.03);
  --bg-gradient: linear-gradient(135deg, #1a1c1e 0%, #1f2123 50%, #1c1e20 100%);

  --sidebar-bg:     rgba(255,255,255,0.04);
  --sidebar-border: rgba(255,255,255,0.07);
  --sidebar-hover:  rgba(255,255,255,0.06);
  --sidebar-active: rgba(255,255,255,0.08);

  --text:  rgba(255,255,255,0.88);
  --text2: rgba(255,255,255,0.45);
  --text3: rgba(255,255,255,0.25);

  --border:  rgba(255,255,255,0.09);
  --border2: rgba(255,255,255,0.06);

  --green:  #22c55e;
  --green2: #16a34a;
  --red:    #ef4444;
  --red2:   #dc2626;
  --blue:   #22c55e;
  --amber:  #FAC775;

  --card:     rgba(255,255,255,0.05);
  --card2:    rgba(255,255,255,0.04);
  --input-bg: rgba(255,255,255,0.06);

  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --glass-blur: blur(20px);
  --nav-active-text: #22c55e;
  --nav-active-icon: #22c55e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); background-image: var(--bg-gradient); background-attachment: fixed; color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.2s; }

/* LOGIN */
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-card { background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 0.5px solid var(--border); border-radius: 20px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; box-shadow: var(--shadow); }
.login-logo { text-align: center; margin-bottom: 2rem; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
.login-logo span { color: var(--blue); }
.login-card input { width: 100%; padding: 0.75rem 1rem; border: 0.5px solid var(--border2); border-radius: 8px; background: var(--input-bg); backdrop-filter: blur(20px); color: var(--text); font-size: 0.95rem; margin-bottom: 1rem; outline: none; transition: border 0.2s; }
.login-card input:focus { border-color: var(--blue); }
.pass-wrap { position: relative; margin-bottom: 1rem; }
.pass-wrap input { margin-bottom: 0; padding-right: 2.75rem; }
.pass-eye { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text3); padding: 4px; display: flex; align-items: center; transition: color 0.15s; }
.pass-eye:hover { color: var(--blue); }
.login-card button.btn-primary { width: 100%; padding: 0.75rem; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.login-card button.btn-primary:hover { background: #185FA5; }
.login-remember { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; font-size: 0.875rem; color: var(--text2); cursor: pointer; }
.login-remember input { width: auto; margin: 0; }
.login-error { color: var(--red); font-size: 0.85rem; text-align: center; margin-top: 0.75rem; min-height: 1.2em; }

/* LAYOUT */
#app { display: none; min-height: 100vh; }
.layout { display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar { width: 220px; background: var(--sidebar-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); min-height: 100vh; display: flex; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; transition: width 0.25s cubic-bezier(.4,0,.2,1), background 0.3s; overflow: hidden; border-right: 0.5px solid var(--sidebar-border); }
.sidebar.collapsed { width: 54px; }
.sidebar-logo { height: 54px; padding: 0 14px; font-size: 1.05rem; font-weight: 700; color: var(--text); border-bottom: 0.5px solid var(--border2); letter-spacing: -0.3px; white-space: nowrap; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.sidebar-logo span { color: var(--blue); }
.sidebar-logo-text { flex: 1; overflow: hidden; transition: opacity 0.2s, max-width 0.25s; max-width: 200px; }
.sidebar.collapsed .sidebar-logo-text { opacity: 0; max-width: 0; }
.sidebar-toggle { background: none; border: none; color: var(--text3); cursor: pointer; padding: 5px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 28px; height: 28px; transition: color 0.15s, background 0.15s; }
.sidebar-toggle:hover { color: var(--text); background: var(--sidebar-hover); }
.sidebar-nav { flex: 1; padding: 6px 0; overflow-y: auto; overflow-x: hidden; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 0 0 0 16px; height: 42px; cursor: pointer; color: var(--text2); font-size: 0.875rem; transition: all 0.15s; border-left: 3px solid transparent; user-select: none; white-space: nowrap; margin: 1px 8px; border-radius: 8px; padding-left: 12px; }
.nav-item:hover { background: var(--sidebar-hover); color: var(--text); }
.nav-item.active { background: var(--sidebar-active); color: var(--nav-active-text); border: 0.5px solid rgba(55,138,221,0.25); border-left: 3px solid var(--nav-active-icon); }
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item-label { overflow: hidden; transition: opacity 0.2s, max-width 0.25s; max-width: 200px; }
.sidebar.collapsed .nav-item-label { opacity: 0; max-width: 0; }
.sidebar.collapsed .nav-item { padding: 0; justify-content: center; border-left: 3px solid transparent; border-radius: 0; margin: 1px 0; }
.sidebar.collapsed .nav-item.active { border-left-color: var(--nav-active-icon); background: var(--sidebar-active); color: var(--nav-active-text); }
.sidebar.collapsed .nav-item:hover { border-left-color: transparent; }
.sidebar-bottom { padding: 10px 14px; border-top: 0.5px solid var(--border2); flex-shrink: 0; overflow: hidden; }
.sidebar.collapsed .sidebar-bottom { padding: 10px 0; display: flex; flex-direction: column; align-items: center; }
.sidebar-user { color: var(--text3); font-size: 0.78rem; margin-bottom: 8px; white-space: nowrap; overflow: hidden; transition: opacity 0.2s, max-height 0.25s; max-height: 40px; }
.sidebar-user strong { color: var(--text2); display: block; font-size: 0.82rem; }
.sidebar.collapsed .sidebar-user { opacity: 0; max-height: 0; margin: 0; }
.btn-logout { width: 100%; padding: 6px 10px; background: rgba(0,0,0,0.05); color: var(--text2); border: 0.5px solid var(--border2); border-radius: 7px; cursor: pointer; font-size: 0.8rem; transition: all 0.15s; white-space: nowrap; text-align: center; }
[data-theme="dark"] .btn-logout { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); border-color: rgba(255,255,255,0.1); }
.btn-logout:hover { background: rgba(0,0,0,0.1); color: var(--text); }
[data-theme="dark"] .btn-logout:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.9); }
.sidebar.collapsed .btn-logout { width: 34px; height: 34px; padding: 0; border-radius: 50%; font-size: 1rem; display: flex; align-items: center; justify-content: center; }

/* MAIN */
.main { margin-left: 220px; flex: 1; min-height: 100vh; background: transparent; transition: margin-left 0.22s ease; }
.main.sidebar-collapsed { margin-left: 52px; }
.topbar { background: var(--bg2); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--border); padding: 0.875rem 1.75rem; display: flex; align-items: center; justify-content: between; gap: 1rem; position: sticky; top: 0; z-index: 50; }
.topbar h1 { font-size: 1.1rem; font-weight: 600; flex: 1; }
.theme-toggle { background: var(--bg3); backdrop-filter: blur(20px); border: 0.5px solid var(--border2); border-radius: 8px; padding: 0.4rem 0.75rem; cursor: pointer; color: var(--text2); font-size: 0.85rem; display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
.theme-toggle:hover { border-color: var(--blue); color: var(--blue); }
.page-content { padding: 1.75rem; }

/* CARDS */
.card { background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.25rem; box-shadow: var(--shadow); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
.card-title { font-size: 1rem; font-weight: 600; }

/* BUTTONS */
.btn { padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn-green { background: var(--green); color: #fff; border-color: var(--green); }
.btn-green:hover { background: var(--green2); border-color: var(--green2); color: #fff; }
.btn-red { background: var(--red); color: #fff; border-color: var(--red); }
.btn-red:hover { background: var(--red2); border-color: var(--red2); color: #fff; }
.btn-sm { padding: 0.3rem 0.65rem; font-size: 0.8rem; }

/* TASKS */
.task-list { display: flex; flex-direction: column; gap: 8px; }
.task-item { display: flex; align-items: center; gap: 12px; padding: 0.875rem 1rem; background: var(--bg3); border-radius: 10px; border: 1px solid var(--border); transition: all 0.15s; }
.task-item.done { opacity: 0.6; }
.task-item.done .task-text { text-decoration: line-through; color: var(--text3); }
.task-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; background: var(--bg2); }
.task-check.checked { background: var(--green); border-color: var(--green); }
.task-check.checked::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 700; }
.task-text { flex: 1; font-size: 0.9rem; }
.task-meta { font-size: 0.78rem; color: var(--text3); white-space: nowrap; }
.task-badge { font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: #fef2f2; color: var(--red); border: 1px solid #fecaca; white-space: nowrap; }
.task-delete { background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px; border-radius: 6px; transition: all 0.15s; font-size: 1rem; }
.task-delete:hover { color: var(--red); background: #fef2f2; }

/* ADD TASK FORM */
.add-task-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.25rem; }
.add-task-form input, .add-task-form select { padding: 0.6rem 0.875rem; border: 0.5px solid var(--border2); border-radius: 8px; background: var(--input-bg); backdrop-filter: blur(10px); color: var(--text); font-size: 0.875rem; outline: none; transition: border 0.2s; }
.add-task-form input:focus, .add-task-form select:focus { border-color: var(--blue); }
.add-task-form input[type="text"] { flex: 1; min-width: 160px; }

/* COMPRAS */
.compras-item { display: flex; align-items: center; gap: 10px; padding: 0.75rem 1rem; background: var(--bg2); backdrop-filter: blur(10px); border-radius: 10px; border: 0.5px solid var(--border); margin-bottom: 8px; }
.compras-check { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--border2); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; background: var(--bg3); }
.compras-check.checked { background: var(--green); border-color: var(--green); }
.compras-check.checked::after { content: '✓'; color: #fff; font-size: 10px; font-weight: 700; }
.compras-text { flex: 1; font-size: 0.9rem; }
.compras-text.done { text-decoration: line-through; color: var(--text3); }

/* MURAL */
.mural-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
.mural-note { background: rgba(255,251,220,0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 0.5px solid rgba(255,235,100,0.5); border-radius: 12px; padding: 1.1rem; min-height: 120px; position: relative; }
[data-theme="dark"] .mural-note { background: rgba(60,50,30,0.5); border-color: rgba(100,80,30,0.4); }
.mural-note-author { font-size: 0.75rem; color: var(--text3); margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.mural-note-text { font-size: 0.9rem; color: var(--text); line-height: 1.5; }
.mural-note-del { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 1rem; padding: 2px 4px; border-radius: 4px; transition: all 0.15s; }
.mural-note-del:hover { color: var(--red); background: rgba(224,82,82,0.1); }

/* AGENDA */
.calendar { border: 0.5px solid var(--border); border-radius: 14px; overflow: hidden; }
.calendar-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; background: var(--bg2); backdrop-filter: blur(16px); border-bottom: 0.5px solid var(--border); }
.calendar-nav { background: var(--bg3); border: 0.5px solid var(--border2); border-radius: 8px; padding: 4px 10px; cursor: pointer; color: var(--text); font-size: 1rem; transition: all 0.15s; }
.calendar-nav:hover { border-color: var(--blue); color: var(--blue); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-day-header { text-align: center; padding: 0.65rem; font-size: 0.75rem; font-weight: 600; color: var(--text3); background: var(--bg3); border-bottom: 0.5px solid var(--border); text-transform: uppercase; }
.cal-day { min-height: 80px; padding: 6px; background: var(--bg2); border-right: 0.5px solid var(--border); border-bottom: 0.5px solid var(--border); cursor: pointer; transition: background 0.15s; position: relative; }
.cal-day:hover { background: var(--sidebar-hover); }
.cal-day.other-month { background: var(--bg3); }
.cal-day.other-month .cal-day-num { color: var(--text3); }
.cal-day.today { background: rgba(55,138,221,0.08); }
[data-theme="dark"] .cal-day.today { background: rgba(55,138,221,0.1); }
.cal-day-num { font-size: 0.8rem; font-weight: 500; color: var(--text2); margin-bottom: 4px; }
.cal-day.today .cal-day-num { color: var(--blue); font-weight: 700; }
.cal-event { font-size: 0.7rem; background: var(--blue); color: #fff; border-radius: 3px; padding: 1px 5px; margin-bottom: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }

/* ETIQUETAS */
.label-form { display: grid; gap: 1rem; }
.label-form label { font-size: 0.85rem; font-weight: 500; color: var(--text2); display: block; margin-bottom: 4px; }
.label-form input, .label-form select, .label-form textarea { width: 100%; padding: 0.65rem 0.875rem; border: 0.5px solid var(--border2); border-radius: 8px; background: var(--input-bg); backdrop-filter: blur(10px); color: var(--text); font-size: 0.875rem; outline: none; font-family: inherit; transition: border 0.2s; }
.label-form input:focus, .label-form select:focus, .label-form textarea:focus { border-color: var(--blue); }
.label-form textarea { min-height: 140px; resize: vertical; font-family: monospace; font-size: 0.8rem; }
.dim-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

/* LOGS */
.log-item { display: flex; align-items: flex-start; gap: 12px; padding: 0.75rem 0; border-bottom: 0.5px solid var(--border); font-size: 0.875rem; }
.log-item:last-child { border-bottom: none; }
.log-time { color: var(--text3); font-size: 0.78rem; white-space: nowrap; min-width: 130px; }
.log-user { font-weight: 600; color: var(--blue); min-width: 70px; }
.log-desc { color: var(--text2); }

/* INICIO */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.stat-card { background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 0.5px solid var(--border); border-radius: 14px; padding: 1.25rem; box-shadow: var(--shadow); }
.stat-label { font-size: 0.8rem; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; }
.stat-value { font-size: 1.75rem; font-weight: 700; color: var(--text); }
.stat-icon { font-size: 1.5rem; margin-bottom: 0.5rem; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.modal { background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-radius: 18px; padding: 1.75rem; width: 100%; max-width: 480px; border: 0.5px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
.modal h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 1.25rem; }
.modal input, .modal select, .modal textarea { width: 100%; padding: 0.65rem 0.875rem; border: 0.5px solid var(--border2); border-radius: 8px; background: var(--input-bg); backdrop-filter: blur(10px); color: var(--text); font-size: 0.875rem; outline: none; margin-bottom: 0.875rem; font-family: inherit; transition: border 0.2s; }
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--blue); }
.modal textarea { resize: vertical; min-height: 80px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 0.5rem; }

/* EMPTY */
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--text3); }
.empty-state svg { width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.4; }
.empty-state p { font-size: 0.9rem; }

/* TABNUTRI */
.tn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
.tn-saved-list { display: flex; flex-direction: column; gap: 8px; }
.tn-saved-item { display: flex; align-items: center; gap: 10px; padding: 0.75rem 1rem; background: var(--bg2); backdrop-filter: blur(10px); border-radius: 10px; border: 0.5px solid var(--border); }
.tn-saved-item:hover { border-color: var(--blue); }
.tn-saved-name { flex: 1; font-size: 0.9rem; font-weight: 500; }
.tn-saved-sub { font-size: 0.78rem; color: var(--text3); }
.tn-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tn-form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.tn-label { font-size: 0.8rem; font-weight: 500; color: var(--text2); display: block; margin-bottom: 3px; }
.tn-input { width: 100%; padding: 0.55rem 0.75rem; border: 0.5px solid var(--border2); border-radius: 7px; background: var(--input-bg); backdrop-filter: blur(10px); color: var(--text); font-size: 0.85rem; outline: none; transition: border 0.2s; font-family: inherit; }
.tn-input:focus { border-color: var(--blue); }
.tn-section { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text3); margin: 1rem 0 0.5rem; padding-bottom: 4px; border-bottom: 0.5px solid var(--border); }
/* Etiqueta preview */
.tn-preview-wrap { background: #fff; color: #000; border-radius: 8px; border: 1px solid var(--border); padding: 10px; font-family: Arial, sans-serif; font-size: 11px; width: 283px; min-height: 425px; flex-shrink: 0; margin: 0 auto; }
.tn-preview-product { font-size: 13px; font-weight: 700; text-align: center; margin-bottom: 2px; }

<script>
// --- DATA STORE ---------------------------------------------------------------
const USERS = [
  { login: 'Edson', senha: '@Edanco_10', role: 'admin' },
  { login: 'Julia', senha: 'juliaRS2', role: 'admin' },
  { login: 'expedicao', senha: 'expedicao', role: 'expedicao' },
  { login: 'producao', senha: 'producao', role: 'producao' },
];

let state = {
  tasks: { expedicao: [], producao: [] },
  compras: [],
  mural: [],
  agenda: [],
  logs: [],
  tabnutri: [],
  financeiro: { meses: {}, despesas: {}, aliquota: 0, custoProdutos: {}, tarifasSku: {} },
  estoque: { produtos: [], movimentacoes: [], historicoManual: [] },
  ponto: { colaboradores: [], registros: [] },
  devolucoes: [],
  mlToken: null,
  shopeeToken: null,
  currentUser: null,
  currentPage: 'inicio',
  calMonth: new Date().getMonth(),
  calYear: new Date().getFullYear(),
};

// --- FIREBASE REALTIME DATABASE CONFIG --------------------------------------
const FIREBASE_URL = 'https://plataforma-costa-default-rtdb.firebaseio.com';

let _saveTimer = null;
let _isSaving = false;
let _pendingSave = false;
let _sseSource = null;
let _firebaseReady = false;
let _loginTime = 0; // momento do login -- primeiros 10s bloqueiam pushToCloud

function showSyncStatus(msg, color) {
  const el = document.getElementById('sync-status');
  if (el) { el.textContent = msg; el.style.color = color || 'var(--text3)'; }
}

function dataSize(d) {
  if (!d) return 0;
  var t = d.tasks || {};
  var est = d.estoque || {};
  var pt = d.ponto || {};
  return (Array.isArray(t.expedicao)         ? t.expedicao.length         : 0) +
         (Array.isArray(t.producao)           ? t.producao.length          : 0) +
         (Array.isArray(d.compras)            ? d.compras.length           : 0) +
         (Array.isArray(d.mural)              ? d.mural.length             : 0) +
         (Array.isArray(d.agenda)             ? d.agenda.length            : 0) +
         (Array.isArray(d.tabnutri)           ? d.tabnutri.length          : 0) +
         (Array.isArray(est.produtos)         ? est.produtos.length        : 0) +
         (Array.isArray(d.devolucoes)         ? d.devolucoes.length        : 0) +
         (Array.isArray(pt.colaboradores)     ? pt.colaboradores.length    : 0) +
         (Array.isArray(pt.registros)         ? pt.registros.length        : 0);
}

function applyParsed(parsed, forceMerge) {
  if (!parsed) return;
  // Safety check: never overwrite existing local data with empty remote data
  // unless explicitly forced (e.g. after a confirmed save)
  if (!forceMerge) {
    var currentSize = dataSize({
      tasks: state.tasks, compras: state.compras, mural: state.mural,
      agenda: state.agenda, tabnutri: state.tabnutri
    });
    var incomingSize = dataSize(parsed);
    // If we have data locally and remote is empty, keep local data
    if (currentSize > 0 && incomingSize === 0) {
      console.warn('applyParsed: ignoring empty remote data (local has', currentSize, 'items)');
      return;
    }
  }
  var t = parsed.tasks || {};
  state.tasks = {
    expedicao: Array.isArray(t.expedicao) ? t.expedicao : [],
    producao:  Array.isArray(t.producao)  ? t.producao  : [],
  };
  state.compras  = Array.isArray(parsed.compras)  ? parsed.compras  : [];
  state.mural    = Array.isArray(parsed.mural)    ? parsed.mural    : [];
  state.agenda   = Array.isArray(parsed.agenda)   ? parsed.agenda   : [];
  state.logs     = Array.isArray(parsed.logs)     ? parsed.logs     : [];
  state.tabnutri = Array.isArray(parsed.tabnutri) ? parsed.tabnutri : [];

  var est = parsed.estoque || {};
  state.estoque = {
    produtos:       Array.isArray(est.produtos)        ? est.produtos        : [],
    movimentacoes:  Array.isArray(est.movimentacoes)   ? est.movimentacoes   : [],
    historicoManual: Array.isArray(est.historicoManual) ? est.historicoManual : [],
  };
  var pt = parsed.ponto || {};
  // Formato correto: { colaboradores: [...], registros: [...] }
  state.ponto = {
    colaboradores: Array.isArray(pt.colaboradores) && pt.colaboradores.length > 0
      ? pt.colaboradores
      : (state.ponto && Array.isArray(state.ponto.colaboradores) && state.ponto.colaboradores.length > 0
          ? state.ponto.colaboradores : []),
    registros: Array.isArray(pt.registros) ? pt.registros : [],
  };
  state.devolucoes = Array.isArray(parsed.devolucoes) && parsed.devolucoes.length > 0
    ? parsed.devolucoes
    : (Array.isArray(state.devolucoes) && state.devolucoes.length > 0 ? state.devolucoes : []);
  if (parsed.mlToken) {
    state.mlToken = parsed.mlToken;
    localStorage.setItem('ml_token', JSON.stringify(parsed.mlToken));
  }
  if (parsed.shopeeToken) {
    state.shopeeToken = parsed.shopeeToken;
    localStorage.setItem('shopee_token', JSON.stringify(parsed.shopeeToken));
  }
}

// -- Carrega dados do Firebase uma vez (no login) --------------------------
async function loadState() {
  // 1. Cache local instantâneo para não piscar
  try {
    const s = localStorage.getItem('costa_state');
    if (s) applyParsed(JSON.parse(s));
  } catch(e) {}

  // 2. Busca dados atualizados do Firebase
  try {
    showSyncStatus('<> Sincronizando...', 'var(--text3)');
    const resp = await fetch(FIREBASE_URL + '/data.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const parsed = await resp.json();
    const localStr = localStorage.getItem('costa_state');
    const localData = localStr ? JSON.parse(localStr) : null;
    if (parsed && dataSize(parsed) > 0) {
      // Firebase tem dados -- usa como fonte de verdade
      applyParsed(parsed, true);
      localStorage.setItem('costa_state', JSON.stringify(parsed));
      _firebaseReady = true;
    } else if (localData && dataSize(localData) > 0) {
      // Firebase vazio mas temos dados locais -- envia para Firebase
      console.log('Firebase vazio, enviando dados locais para a nuvem...');
      applyParsed(localData, true);
      _firebaseReady = true;
      pushToCloud(localData);
    } else {
      // Ambos vazios -- Firebase pronto para receber dados novos
      _firebaseReady = true;
    }
    showSyncStatus('v Pronto', 'var(--green)');
    setTimeout(() => showSyncStatus('', ''), 1500);
  } catch(e) {
    showSyncStatus('⚠ Sem conexão', 'var(--amber)');
  }
}

// -- Listener em tempo real via SSE do Firebase ----------------------------
// O Firebase Realtime Database suporta Server-Sent Events nativamente.
// Quando qualquer usuário salva, todos os outros recebem o dado novo em ~1s
// sem precisar recarregar a página.
function startRealtimeSync() {
  if (_sseSource) { _sseSource.close(); _sseSource = null; }

  try {
    _sseSource = new EventSource(FIREBASE_URL + '/data.json');

    _sseSource.addEventListener('put', function(e) {
      try {
        const msg = JSON.parse(e.data);
        // msg.path === '/' significa dados completos; msg.data é o payload
        if (!msg || !msg.data) return;
        const incoming = msg.data;

        // Não aplicar sem usuário logado ou se EU fui quem salvou (evita flicker)
        if (!state.currentUser || _isSaving) return;

        // Preserva historicoManual local se o Firebase ainda não tem (push pendente)
        var localManual = state.estoque && state.estoque.historicoManual;
        if (localManual && localManual.length > 0) {
          var remoteManual = incoming.estoque && incoming.estoque.historicoManual;
          if (!remoteManual || remoteManual.length < localManual.length) {
            if (!incoming.estoque) incoming.estoque = {};
            incoming.estoque.historicoManual = localManual;
          }
        }

        // SSE data is authoritative -- use forceMerge=true
        _firebaseReady = true;
        applyParsed(incoming, true);
        localStorage.setItem('costa_state', JSON.stringify(incoming));

        // Re-renderiza a página atual com os novos dados
        if (state.currentUser) {
          safeRenderPage();
          showSyncStatus('🔄 Atualizado', 'var(--green)');
          setTimeout(() => showSyncStatus('', ''), 1500);
        }
      } catch(err) {}
    });

    _sseSource.addEventListener('cancel', function() {
      showSyncStatus('⚠ Sync pausado', 'var(--amber)');
    });

    _sseSource.onerror = function() {
      // Reconecta automaticamente após 5s se a conexão cair
      showSyncStatus('⚠ Reconectando...', 'var(--amber)');
      if (_sseSource) { _sseSource.close(); _sseSource = null; }
      setTimeout(() => { if (state.currentUser) startRealtimeSync(); }, 5000);
    };

  } catch(e) {
    // SSE não disponível -- fallback para polling a cada 8 segundos
    startPolling();
  }
}

// -- Fallback: polling a cada 8s se SSE não funcionar ---------------------
let _pollTimer = null;
function startPolling() {
  if (_pollTimer) return;
  _pollTimer = setInterval(async () => {
    if (!state.currentUser || _isSaving) return;
    try {
      const resp = await fetch(FIREBASE_URL + '/data.json');
      if (!resp.ok) return;
      const parsed = await resp.json();
      if (!parsed) return;
      const local = localStorage.getItem('costa_state');
      const remoteStr = JSON.stringify(parsed);
      if (local !== remoteStr) {
        applyParsed(parsed);
        localStorage.setItem('costa_state', remoteStr);
        if (state.currentUser) {
          safeRenderPage();
          showSyncStatus('🔄 Atualizado', 'var(--green)');
          setTimeout(() => showSyncStatus('', ''), 1500);
        }
      }
    } catch(e) {}
  }, 8000);
}

function stopSync() {
  if (_sseSource) { _sseSource.close(); _sseSource = null; }
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
}

// -- Salvar dados no Firebase ----------------------------------------------

// Conta itens críticos nos dados para proteção anti-sobrescrita
function dataItemCount(data) {
  var n = 0;
  try {
    n += ((data.estoque && data.estoque.produtos) ? data.estoque.produtos.length : 0);
    n += ((data.ponto && data.ponto.colaboradores) ? data.ponto.colaboradores.length : 0);
    n += ((data.ponto && data.ponto.registros) ? data.ponto.registros.length : 0);
    n += (Array.isArray(data.compras)   ? data.compras.length   : 0);
    n += (Array.isArray(data.tabnutri)  ? data.tabnutri.length  : 0);
    n += (Array.isArray(data.devolucoes)? data.devolucoes.length: 0);
    var t = data.tasks || {};
    n += (Array.isArray(t.expedicao) ? t.expedicao.length : 0);
    n += (Array.isArray(t.producao)  ? t.producao.length  : 0);
  } catch(e) {}
  return n;
}

// Último estado salvo com sucesso no Firebase (para comparação)
var _lastSavedCount = null;

async function salvarBackupFirebase(data) {
  try {
    var hoje = new Date();
    var key = hoje.getFullYear() + '-' +
              String(hoje.getMonth()+1).padStart(2,'0') + '-' +
              String(hoje.getDate()).padStart(2,'0');
    await fetch(FIREBASE_URL + '/backups/' + key + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ts: hoje.toISOString(), data: data }),
    });
  } catch(e) {
    console.warn('[Backup] Falha ao salvar backup:', e.message);
  }
}

function saveState() {
  const data = {
    tasks:       state.tasks,
    compras:     state.compras,
    mural:       state.mural,
    agenda:      state.agenda,
    logs:        state.logs,
    tabnutri:    state.tabnutri,
    estoque:     state.estoque,
    ponto:       state.ponto,
    devolucoes:  state.devolucoes,
    mlToken:     state.mlToken     || null,
    shopeeToken: state.shopeeToken || null,
  };

  // Proteção anti-sobrescrita: bloqueia se novos dados têm muito menos itens
  if (_lastSavedCount !== null) {
    var newCount = dataItemCount(data);
    if (newCount < _lastSavedCount * 0.5 && _lastSavedCount > 5) {
      console.error('[PROTEÇÃO] saveState bloqueado! Tentativa de salvar ' + newCount +
        ' itens quando havia ' + _lastSavedCount + '. Possível perda de dados evitada.');
      showSyncStatus('⚠ Proteção ativada', 'var(--red)');
      return;
    }
  }

  localStorage.setItem('costa_state', JSON.stringify(data));
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => pushToCloud(data), 600);
}

async function pushToCloud(data) {
  var secondsSinceLogin = (Date.now() - _loginTime) / 1000;
  if (secondsSinceLogin < 10) {
    console.log('pushToCloud aguardando sync inicial (' + secondsSinceLogin.toFixed(1) + 's < 10s)');
    if (_saveTimer) clearTimeout(_saveTimer);
    var remaining = Math.ceil(10000 - (Date.now() - _loginTime));
    _saveTimer = setTimeout(() => pushToCloud(data), remaining + 200);
    return;
  }
  if (!_firebaseReady) {
    console.warn('pushToCloud bloqueado: Firebase ainda não confirmado');
    return;
  }
  if (_isSaving) { _pendingSave = true; return; }
  _isSaving = true;
  showSyncStatus('^ Salvando...', 'var(--text3)');
  try {
    const resp = await fetch(FIREBASE_URL + '/data.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    localStorage.setItem('costa_state', JSON.stringify(data));

    // Atualiza contador e salva backup diário
    var count = dataItemCount(data);
    if (_lastSavedCount === null || count >= _lastSavedCount) {
      _lastSavedCount = count;
      // Backup uma vez por dia (verifica se já fez hoje)
      var hoje = new Date().toISOString().slice(0,10);
      var ultimoBackup = localStorage.getItem('costa_last_backup');
      if (ultimoBackup !== hoje) {
        salvarBackupFirebase(data);
        localStorage.setItem('costa_last_backup', hoje);
      }
    }

    showSyncStatus('v Salvo', 'var(--green)');
    setTimeout(() => showSyncStatus('', ''), 1500);
  } catch(e) {
    showSyncStatus('⚠ Erro ao salvar', 'var(--red)');
  } finally {
    _isSaving = false;
    if (_pendingSave) { _pendingSave = false; pushToCloud(data); }
  }
}

// Export manual de todos os dados como JSON
function exportarDados() {
  var data = {
    exportadoEm: new Date().toISOString(),
    tasks:       state.tasks,
    compras:     state.compras,
    mural:       state.mural,
    agenda:      state.agenda,
    tabnutri:    state.tabnutri,
    estoque:     state.estoque,
    ponto:       state.ponto,
    devolucoes:  state.devolucoes,
  };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href   = url;
  a.download = 'costa_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function addLog(action) {
  if (!state.currentUser) return;
  const now = new Date();
  state.logs.unshift({
    time: now.toLocaleString('pt-BR'),
    user: state.currentUser.login,
    action,
  });
  if (state.logs.length > 500) state.logs = state.logs.slice(0, 500);
  // Não chama saveState aqui -- evita sobrescrever Firebase antes de sincronizar.
  // Os logs são salvos junto com a próxima ação real do usuário.
  localStorage.setItem('costa_state', JSON.stringify({
    tasks: state.tasks, compras: state.compras, mural: state.mural,
    agenda: state.agenda, logs: state.logs, tabnutri: state.tabnutri,
  }));
}

// --- AUTH ----------------------------------------------------------------------
function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const user = USERS.find(x => x.login === u && x.senha === p);
  if (!user) { document.getElementById('login-error').textContent = 'Usuário ou senha incorretos.'; return; }
  document.getElementById('login-error').textContent = '';
  if (document.getElementById('login-remember').checked) {
    localStorage.setItem('costa_saved_login', JSON.stringify({ login: u, senha: p }));
  } else {
    localStorage.removeItem('costa_saved_login');
  }
  state.currentUser = user;
  _loginTime = Date.now();
  _firebaseReady = false;
  console.log('Login OK:', user.login, 'role:', user.role);
  addLog('Fez login na plataforma');
  startApp();
  // Check if there's a pending ML code from before login
  const pendingCode = localStorage.getItem('ml_pending_code');
  if (pendingCode) {
    localStorage.removeItem('ml_pending_code');
    setTimeout(async function() {
      try {
        await mlExchangeCode(pendingCode);
        navigate('vendas');
      } catch(e) {
        navigate('vendas');
      }
    }, 500);
  }
}

function doLogout() {
  addLog('Saiu da plataforma');
  stopSync();
  _firebaseReady = false; // reset -- próximo login não pode salvar antes de sincronizar
  state.currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
}

document.getElementById('login-user').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('login-pass').focus(); });
document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

  const t = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('costa_theme', t);
  const label = t === 'dark' ? '☀️ Claro' : '🌙 Escuro';
  ['login-theme-btn','app-theme-btn'].forEach(id => {

    if(el) el.textContent = label;

// Try saved login
(function checkSavedLogin() {
  try {
    const s = localStorage.getItem('costa_state');
    if (s) applyParsed(JSON.parse(s));
  } catch(e) {}

  const urlParams  = new URLSearchParams(window.location.search);
  const mlCode     = urlParams.get('code');
  const shopeeCode = urlParams.get('code');
  const shopeeShopId = urlParams.get('shop_id'); // Shopee retorna shop_id no redirect

  const saved = localStorage.getItem('costa_saved_login');
  if (saved) {
    try {
      const { login, senha } = JSON.parse(saved);
      const user = USERS.find(x => x.login === login && x.senha === senha);
      if (user) {
        document.getElementById('login-user').value = login;
        document.getElementById('login-pass').value = senha;
        document.getElementById('login-remember').checked = true;

        if (mlCode || (shopeeCode && shopeeShopId)) {
          state.currentUser = user;
          _loginTime = Date.now();
          _firebaseReady = false;
          window.history.replaceState({}, document.title, window.location.pathname);
          startApp();
          setTimeout(async function() {
            try {
              if (shopeeShopId && shopeeCode) {
                // É um redirect da Shopee (tem shop_id)
                await shopeeExchangeCode(shopeeCode, shopeeShopId);
                _vendaTab = 'shopee';
              } else if (mlCode) {
                await mlExchangeCode(mlCode);
              }
              navigate('vendas');
            } catch(e) { navigate('vendas'); }
          }, 500);
          return;
        }
      }
    } catch(e) {}
  }

  if (mlCode && !urlParams.get('shop_id')) {
    localStorage.setItem('ml_pending_code', mlCode);
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  if (shopeeCode && shopeeShopId) {
    localStorage.setItem('shopee_pending_code', shopeeCode);
    localStorage.setItem('shopee_pending_shop_id', shopeeShopId);
    window.history.replaceState({}, document.title, window.location.pathname);
  }
})();

function buildSidebar() {
  if (!state.currentUser) return;
  const nav = document.getElementById('sidebar-nav');
  if (!nav) return;
  nav.innerHTML = '';
  const pages = state.currentUser.role === 'admin' ? getPagesAdmin() : getPagesLimited();
  pages.forEach(p => {
    if (p.id === '__sep__') {
      const sep = document.createElement('div');
      sep.style.cssText = 'margin:6px 12px;border-top:0.5px solid var(--border2);position:relative;';
      sep.innerHTML = '<span style="position:absolute;top:-9px;left:8px;background:var(--sidebar-bg);padding:0 6px;font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3)">Admin</span>';
      nav.appendChild(sep);
      return;
    }
    const el = document.createElement('div');
    el.className = 'nav-item' + (state.currentPage === p.id ? ' active' : '');
    el.innerHTML = p.icon + `<span class="nav-item-label">${p.label}</span>`;
    el.title = p.label;
    el.onclick = () => navigate(p.id);
    nav.appendChild(el);
  });
  const unEl = document.getElementById('sidebar-username');
  const roEl = document.getElementById('sidebar-role');
  if (unEl) unEl.textContent = state.currentUser.login;
  if (roEl) roEl.textContent = state.currentUser.role === 'admin' ? '(Admin)' : '';
  // Update logout button icon when collapsed
  const collapsed = document.querySelector('.sidebar').classList.contains('collapsed');
  const logoutBtn = document.getElementById('btn-logout-el');
  if (logoutBtn) logoutBtn.textContent = collapsed ? '<-' : 'Sair';
}

function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  const main = document.querySelector('.main');
  const btn = document.getElementById('btn-logout-el');
  const isCollapsed = sidebar.classList.toggle('collapsed');
  main.classList.toggle('sidebar-collapsed', isCollapsed);
  if (btn) btn.textContent = isCollapsed ? '<-' : 'Sair';
  localStorage.setItem('costa_sidebar_collapsed', isCollapsed ? '1' : '0');
}



function cleanOldTasks() {
  const todayStr = new Date().toISOString().slice(0,10);
  let changed = false;
  ['expedicao','producao'].forEach(area => {
    if (!state.tasks) state.tasks = {};
    if (!Array.isArray(state.tasks[area])) state.tasks[area] = [];
    const before = state.tasks[area].length;
    state.tasks[area] = state.tasks[area].filter(t => !(t.done && t.date < todayStr));
    if (state.tasks[area].length !== before) changed = true;
  });
  // Não salva aqui -- evita sobrescrever Firebase com dados locais ainda não sincronizados
  // Os dados serão salvos na próxima ação real do usuário
}

function startApp() {
  if (!state.currentUser) { console.error('startApp called without currentUser!'); return; }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  if (localStorage.getItem('costa_sidebar_collapsed') === '1') {
    document.querySelector('.sidebar').classList.add('collapsed');
    document.querySelector('.main').classList.add('sidebar-collapsed');
  }
  cleanOldTasks();
  buildSidebar();
  renderPage();
  startRealtimeSync();
  // Carrega histórico de preços do nó separado do Firebase
  setTimeout(estoqueHistLoadFirebase, 2000);
  // Renova tokens automaticamente a cada 30 minutos
  iniciarRenovacaoAutomatica();
}

function iniciarRenovacaoAutomatica() {
  // Renova imediatamente se necessário
  renovarTokens();
  // Depois renova a cada 30 minutos
  setInterval(renovarTokens, 30 * 60 * 1000);
}

async function renovarTokens() {
  // ML — renova se expira em menos de 1 hora
  try {
    var mlT = mlLoadToken();
    if (mlT && mlT.refresh_token && mlT.expires_at && (mlT.expires_at - Date.now()) < 60 * 60 * 1000) {
      await mlRefreshToken();
      console.log('Token ML renovado automaticamente');
    }
  } catch(e) { console.log('Falha ao renovar token ML:', e.message); }

  // Shopee — renova se expira em menos de 2 horas
  try {
    var shT = shopeeLoadToken();
    if (shT && shT.refresh_token && shT.expires_at && (shT.expires_at - Date.now()) < 2 * 60 * 60 * 1000) {
      await shopeeRefreshToken();
      console.log('Token Shopee renovado automaticamente');
    }
  } catch(e) { console.log('Falha ao renovar token Shopee:', e.message); }
}

  var titleEl = document.getElementById('page-title');
  if (titleEl) titleEl.textContent = titles[state.currentPage] || '';

  if (pg === 'expedicao') { c.innerHTML = renderTasks('expedicao'); return; }
  if (pg === 'producao')  { c.innerHTML = renderTasks('producao'); return; }
  if (pg === 'compras')   { c.innerHTML = renderCompras(); setupCompras(); return; }
  if (pg === 'mural')     { c.innerHTML = renderMural(); setupMural(); return; }
  if (pg === 'etiquetas') { c.innerHTML = renderEtiquetas(); return; }
  if (pg === 'agenda')    { c.innerHTML = renderAgenda(); return; }
  if (pg === 'tabnutri')  { c.innerHTML = renderTabNutri(); setupTabNutri(); return; }
  if (pg === 'estoque')   { c.innerHTML = renderEstoque(); setupEstoque(); return; }
  if (pg === 'produtos')      { c.innerHTML = renderProdutos(); return; }
  if (pg === 'marketplaces')  { c.innerHTML = renderMarketplaces(); return; }
  if (pg === 'devolucao') { c.innerHTML = renderDevolucao(); setupDevolucao(); return; }
  if (pg === 'ponto')     { c.innerHTML = renderPonto(); return; }
  if (pg === 'vendas')    { c.innerHTML = renderVendas(); bindVendas(); return; }
  if (pg === 'logs')      { c.innerHTML = renderLogs(); return; }
  if (pg === 'financeiro') { c.innerHTML = renderFinanceiro(); bindFinanceiro(); return; }
}

function navigate(page) {
  if (!state.currentUser) return;
  state.currentPage = page;
  buildSidebar();
  renderPage();
}

// safeRenderPage: called by SSE sync -- only updates data, never changes page
function safeRenderPage() {
  if (!state.currentUser) return;
  var active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) return;
  // If on inicio, just refresh vendas slots without full re-render
  if (state.currentPage === 'inicio') {
    var chartEl = document.getElementById('inicio-chart-content');
    if (chartEl) {
      // DOM is ready, just reload vendas data
      setTimeout(function() { mlLoadInicio(); }, 100);
      return;
    }
  }
  renderPage();
}

    return state.tasks[area].filter(t => !t.done && t.date <= todayStr).length;

  // Agenda hoje
  const todayEvents = state.agenda.filter(e => e.date === todayStr).sort((a,b) => (a.time||'').localeCompare(b.time||''));

// --- TASKS ---------------------------------------------------------------------
function renderTasks(area) {
  if (!state.currentUser) return '';
  const isAdmin = state.currentUser.role === 'admin';
  const today = new Date();
  today.setHours(0,0,0,0);

  // Limpeza feita fora do render -- apenas lê o state, não modifica

  let html = `<div class="card">`;
  if (isAdmin) {
    html += `<div class="add-task-form mb-2">
      <input type="text" id="task-text" placeholder="Descrição da tarefa...">
      <input type="date" id="task-date" value="${new Date().toISOString().slice(0,10)}">
      <div style="display:flex;align-items:center;gap:6px">
        <input type="time" id="task-time" value="08:00" style="flex:1">
        <label style="display:flex;align-items:center;gap:4px;font-size:0.78rem;color:var(--text2);white-space:nowrap;cursor:pointer">
          <input type="checkbox" id="task-no-time" onchange="toggleTaskTime()" style="width:auto;margin:0"> Sem horário
        </label>
      </div>
      <button class="btn btn-green" onclick="addTask('${area}')">+ Adicionar</button>
    </div>`;
  }

  // Sort: undone+late first (oldest date first), then today, then done -- by date+time
  const tasks = [...state.tasks[area]].map((t, i) => ({...t, _origIdx: i}))
    .sort((a, b) => {
      // Done tasks always go to bottom
      if (a.done !== b.done) return a.done ? 1 : -1;
      // Sort by date string (ISO), then by time string
      const dateA = a.date + (a.time || '');
      const dateB = b.date + (b.time || '');
      return dateA.localeCompare(dateB);
    });

  if (!tasks.length) {
    html += `<div class="empty-state">${iconEmpty()}<p>Nenhuma tarefa cadastrada</p></div>`;
  } else {
    html += `<div class="task-list">`;
    const todayStr = today.toISOString().slice(0,10);
    const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
    const tomorrowStr = tomorrow.toISOString().slice(0,10);

    tasks.forEach((t) => {
      const i = t._origIdx;
      const isLate     = !t.done && t.date < todayStr;
      const isToday    = !t.done && t.date === todayStr;
      const isTomorrow = !t.done && t.date === tomorrowStr;
      const dateStr = new Date(t.date + 'T12:00:00').toLocaleDateString('pt-BR') + (t.time ? ' ' + t.time : ' . Sem horário');

      let badge = '';
      if (isLate)     badge = '<span class="task-badge">⚠ Atraso</span>';
      else if (isToday)    badge = '<span class="task-badge" style="background:var(--green);color:#fff;border:none">Hoje</span>';
      else if (isTomorrow) badge = '<span class="task-badge" style="background:#1a8a4a;color:#fff;border:none">Amanhã</span>';

      html += `<div class="task-item ${t.done?'done':''}">
        <div class="task-check ${t.done?'checked':''}" onclick="toggleTask('${area}',${i})"></div>
        <div class="task-text">${esc(t.text)}</div>
        <span class="task-meta">${dateStr}</span>
        ${badge}
        ${isAdmin ? `<button class="task-delete" onclick="deleteTask('${area}',${i})" title="Excluir">x</button>` : ''}
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function toggleTaskTime() {

}

function addTask(area) {

  const date = document.getElementById('task-date').value;
  const noTime = document.getElementById('task-no-time').checked;
  const time = noTime ? '' : document.getElementById('task-time').value;
  if (!text || !date) return;
  state.tasks[area].push({ text, date, time, done: false, id: Date.now() });
  saveState();
  addLog(`Adicionou tarefa em ${area}: "${text}"`);
  bindTasks(area);
}

function toggleTask(area, i) {
  state.tasks[area][i].done = !state.tasks[area][i].done;
  const t = state.tasks[area][i];
  addLog(`Marcou tarefa como ${t.done?'concluída':'pendente'} em ${area}: "${t.text}"`);
  saveState();
  bindTasks(area);
}

function deleteTask(area, i) {
  const t = state.tasks[area][i];
  state.tasks[area].splice(i, 1);
  addLog(`Excluiu tarefa em ${area}: "${t.text}"`);
  saveState();
  bindTasks(area);
}

async function etqGerarPDF() {
  var data = etqGetData();
  if (!data.nome || !data.endereco) {
    document.getElementById('etq-status').textContent = '⚠ Preencha Nome e Endereço.';
    return;
  }
  var status = document.getElementById('etq-status');
  var total = data.volumes;
  status.textContent = 'Gerando ' + total + ' etiquetas...';

  // Build all labels as HTML, convert to PDF using jsPDF
  var doc = new jspdf.jsPDF({ unit: 'mm', format: [100, 150], orientation: 'portrait' });
  doc.setProperties({ title: 'Etiquetas Transportadora - Costa Nature Life' });

  for (var i = 1; i <= total; i++) {
    if (i > 1) doc.addPage();
    status.textContent = 'Gerando etiqueta ' + i + '/' + total + '...';

    // Render label to canvas via HTML
    var container = document.createElement('div');
    container.style.cssText = 'position:fixed;left:-9999px;top:0;background:#fff';
    container.innerHTML = etqBuildLabel(i, total, data);
    document.body.appendChild(container);

    // Wait a frame for render
    await new Promise(r => setTimeout(r, 30));

    try {
      var canvas = await html2canvas(container.firstChild, {
        scale: 3,
        backgroundColor: '#fff',
        logging: false,
        width: 377,
        height: 566,
      });
      var imgData = canvas.toDataURL('image/jpeg', 0.97);
      doc.addImage(imgData, 'JPEG', 0, 0, 100, 150);
    } catch(e) {
      // Fallback: draw text directly
      doc.setFontSize(10);
      doc.text('Volume ' + i + '/' + total, 10, 20);
      doc.text(data.nome, 10, 30);
      doc.text(data.endereco, 10, 40);
    }
    document.body.removeChild(container);
  }

  doc.save('etiquetas-transportadora.pdf');
  status.textContent = 'v ' + total + ' etiquetas geradas com sucesso!';
  setTimeout(function(){ status.textContent = ''; }, 4000);
}

function getLabelaryDpi(sel) {
  return sel || '8dpmm';
}

function sleep(ms) { return new Promise(function(r){ setTimeout(r, ms); }); }

async function fetchLabelaryPage(zplPage, dpm, wMm, hMm, attempt) {
  if (!attempt) attempt = 0;
  var wIn = (wMm / 25.4).toFixed(2);
  var hIn = (hMm / 25.4).toFixed(2);
  var url = 'https://api.labelary.com/v1/printers/' + dpm + '/labels/' + wIn + 'x' + hIn + '/0/';
  if (attempt > 0) await sleep(attempt * 1500);
  var resp;
  try {
    resp = await fetch(url, {
      method: 'POST',
      headers: { 'Accept': 'image/png', 'Content-Type': 'application/x-www-form-urlencoded' },
      body: zplPage,
    });
  } catch(e) { throw new Error('Sem conexao com Labelary. Verifique sua internet.'); }
  if (resp.status === 429) {
    if (attempt < 5) return fetchLabelaryPage(zplPage, dpm, wMm, hMm, attempt + 1);
    throw new Error('Limite de requisicoes atingido. Aguarde 30 seg e tente novamente.');
  }
  if (!resp.ok) throw new Error('Labelary erro ' + resp.status + '. Verifique o ZPL.');
  var blob = await resp.blob();
  return new Promise(function(res, rej) {
    var r = new FileReader();
    r.onload = function() { res(r.result); };
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

function splitZplLabels(zpl) {
  var parts = zpl.split(/\^XZ/i).map(function(s){ return s.trim(); }).filter(Boolean);
  return parts.map(function(p) {
    var label = (p.startsWith('^XA') || p.startsWith('^xa')) ? p : ('^XA\n' + p);
    return label + '\n^XZ';
  });
}

async function previewEtiqueta() {
  var zpl = document.getElementById('zpl-input').value.trim();

  var previewDiv = document.getElementById('lbl-preview');
  var pagesDiv = document.getElementById('lbl-pages');

  if (!zpl) { status.textContent = 'Por favor, insira o codigo ZPL.'; return; }
  status.textContent = 'Carregando previa...';
  previewDiv.innerHTML = '<span style="color:var(--text3);font-size:0.85rem">Gerando...</span>';
  pagesDiv.innerHTML = '';

  try {
    var labels = splitZplLabels(zpl);
    var firstImg = await fetchLabelaryPage(labels[0], dpm, w, h, 0);
    previewDiv.innerHTML = '<img src="' + firstImg + '" style="max-width:100%;max-height:340px;border-radius:4px;border:1px solid var(--border)">';
    if (labels.length > 1) {
      status.textContent = labels.length + ' etiquetas detectadas. Clique em Baixar PDF para gerar todas.';
      var thumbCount = Math.min(labels.length, 4);
      for (var i = 1; i < thumbCount; i++) {
        await sleep(700);
        var thumb = await fetchLabelaryPage(labels[i], dpm, w, h, 0);
        var el = document.createElement('img');
        el.src = thumb;
        el.style.cssText = 'height:60px;border-radius:4px;border:1px solid var(--border);cursor:pointer';
        el.title = 'Etiqueta ' + (i+1);
        (function(t, pd){ el.onclick = function(){ pd.innerHTML = '<img src="' + t + '" style="max-width:100%;max-height:340px;border-radius:4px;border:1px solid var(--border)">'; }; })(thumb, previewDiv);
        pagesDiv.appendChild(el);
      }
      if (labels.length > thumbCount) {
        var more = document.createElement('span');
        more.textContent = '+' + (labels.length - thumbCount) + ' mais';
        more.style.cssText = 'font-size:0.78rem;color:var(--text3);align-self:center';
        pagesDiv.appendChild(more);
      }
    } else {
      status.textContent = 'Previa gerada com sucesso!';
      setTimeout(function(){ status.textContent = ''; }, 3000);
    }
  } catch(e) {
    status.textContent = 'Erro: ' + e.message;
    previewDiv.innerHTML = '<span style="color:var(--red);font-size:0.85rem">Falha na previa</span>';
  }
}

  var h = parseFloat(document.getElementById('lbl-h').value) || 150;
  var dpm = document.getElementById('lbl-dpi').value;
  var status = document.getElementById('lbl-status');

  if (!zpl) { status.textContent = 'Por favor, insira o codigo ZPL.'; return; }

  var labels = splitZplLabels(zpl);
  status.textContent = 'Iniciando: ' + labels.length + ' etiqueta(s)...';

  try {
    var jsPDFLib = window.jspdf;
    var orientation = w >= h ? 'landscape' : 'portrait';
    var doc = new jsPDFLib.jsPDF({ orientation: orientation, unit: 'mm', format: [w, h] });

    for (var i = 0; i < labels.length; i++) {
      status.textContent = 'Gerando etiqueta ' + (i+1) + ' de ' + labels.length + '...';
      if (i > 0) await sleep(450);
      var imgData = await fetchLabelaryPage(labels[i], dpm, w, h, 0);
      if (i > 0) doc.addPage([w, h], orientation);
      doc.addImage(imgData, 'PNG', 0, 0, w, h);
    }

    doc.save('etiquetas-costa.pdf');
    addLog('Gerou ' + labels.length + ' etiqueta(s) ZPL em PDF (' + w + 'x' + h + 'mm)');
    status.textContent = 'PDF com ' + labels.length + ' etiqueta(s) baixado com sucesso!';
    setTimeout(function(){ status.textContent = ''; }, 5000);
  } catch(e) {
    status.textContent = 'Erro ao gerar PDF: ' + e.message;
  }
}

// --- AGENDA ------------------------------------------------------------------
function renderAgenda() {
  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const days = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y, m, 1).getDay();
  const total = new Date(y, m+1, 0).getDate();
  const today = new Date();

  let html = `<div style="margin-bottom:1rem;display:flex;gap:8px">
    <button class="btn btn-green" onclick="openModalEvento()">+ Novo Compromisso</button>
  </div>
  <div class="card" style="padding:0">
    <div class="calendar">
      <div class="calendar-header">
        <button class="calendar-nav" onclick="calNav(-1)">‹</button>
        <strong>${months[m]} ${y}</strong>
        <button class="calendar-nav" onclick="calNav(1)">›</button>
      </div>
      <div class="calendar-grid">`;

  days.forEach(d => { html += `<div class="cal-day-header">${d}</div>`; });

  // Pad start
  for (let i = 0; i < first; i++) {
    const d = new Date(y, m, -first+i+1);
    html += `<div class="cal-day other-month"><div class="cal-day-num">${d.getDate()}</div></div>`;
  }

  for (let d = 1; d <= total; d++) {
    const isToday = d === today.getDate() && m === today.getMonth() && y === today.getFullYear();
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const events = state.agenda.filter(e => e.date === dateStr);
    let evHtml = events.map(e => `<div class="cal-event" title="${esc(e.title)}" onclick="viewEvento('${e.id}')">${esc(e.title)}</div>`).join('');
    html += `<div class="cal-day${isToday?' today':''}">
      <div class="cal-day-num">${d}</div>
      ${evHtml}
    </div>`;
  }

  // Pad end
  const remaining = 7 - ((first + total) % 7);
  if (remaining < 7) {
    for (let i = 1; i <= remaining; i++) {
      html += `<div class="cal-day other-month"><div class="cal-day-num">${i}</div></div>`;
    }
  }

  html += `</div></div></div>`;

  // Upcoming events
  const upcoming = state.agenda.sort((a,b)=>a.date.localeCompare(b.date));
  if (upcoming.length) {
    html += `<div class="card" style="margin-top:1rem"><div class="card-header"><span class="card-title">Próximos Compromissos</span></div>`;
    upcoming.slice(0,10).forEach(e => {
      const d = new Date(e.date+'T'+e.time).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
      html += `<div class="flex items-center gap-2 mb-1" style="padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="width:14px;height:14px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0"></span>
        <span class="text-sm" style="flex:1"><strong>${esc(e.title)}</strong></span>
        <span class="text-sm text-muted">${d}</span>
        <button class="task-delete" onclick="deleteEvento('${e.id}')">x</button>
      </div>`;
    });
    html += `</div>`;
  }

  return html;
}

function bindAgenda() {}

function calNav(dir) {
  state.calMonth += dir;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  document.getElementById('page-content').innerHTML = renderAgenda();
  bindAgenda();
}

function openModalEvento() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('modal-content').innerHTML = `
    <h3>Novo Compromisso</h3>
    <input type="text" id="ev-title" placeholder="Título do compromisso">
    <input type="date" id="ev-date" value="${today}">
    <input type="time" id="ev-time" value="09:00">
    <textarea id="ev-desc" placeholder="Descrição (opcional)" style="min-height:60px"></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-green" onclick="saveEvento()">Salvar</button>
    </div>`;
  document.getElementById('modal').style.display = 'flex';
}

function saveEvento() {
  const title = document.getElementById('ev-title').value.trim();
  const date = document.getElementById('ev-date').value;
  const time = document.getElementById('ev-time').value;
  if (!title || !date) return;
  const ev = { id: 'ev_'+Date.now(), title, date, time, desc: document.getElementById('ev-desc').value };
  state.agenda.push(ev);
  addLog(`Adicionou compromisso na agenda: "${title}" em ${date}`);
  saveState();
  closeModal();
  document.getElementById('page-content').innerHTML = renderAgenda();
}

function viewEvento(id) {
  const e = state.agenda.find(x => x.id === id);
  if (!e) return;
  const d = new Date(e.date+'T'+e.time).toLocaleString('pt-BR',{dateStyle:'long',timeStyle:'short'});
  document.getElementById('modal-content').innerHTML = `
    <h3>${esc(e.title)}</h3>
    <p style="color:var(--text2);margin-bottom:1rem">${d}</p>
    ${e.desc ? `<p style="font-size:0.9rem;margin-bottom:1rem">${esc(e.desc)}</p>` : ''}
    <div class="modal-actions">
      <button class="btn btn-red" onclick="deleteEvento('${e.id}');closeModal()">Excluir</button>
      <button class="btn btn-green" onclick="closeModal()">Fechar</button>
    </div>`;
  document.getElementById('modal').style.display = 'flex';
}

function deleteEvento(id) {
  const e = state.agenda.find(x => x.id === id);
  if (e) addLog(`Removeu compromisso da agenda: "${e.title}"`);
  state.agenda = state.agenda.filter(x => x.id !== id);
  saveState();
  document.getElementById('page-content').innerHTML = renderAgenda();
}

function tnSearchFilter(val) {
  _tnSearch = val || '';

function tnSetTab(tab) {
  _tnTab = tab;
  if (tab !== 'criar') _tnEdit = null;
  if (tab === 'biblioteca') _tnSearch = '';
  navigate('tabnutri');
}

function bindTabNutri() {
  setupTabNutri();
}

function setupTabNutri() {
  if (_tnTab === 'biblioteca') return;
  if (_tnEdit !== null) {
    var d = state.tabnutri[_tnEdit];
    if (d) {
      Object.keys(d).forEach(function(k) {
        var el = document.getElementById('tn-' + k);
        if (el) el.value = d[k];
      });
      var titleEl = document.getElementById('tn-form-title');
      if (titleEl) titleEl.textContent = 'Editando: ' + d.nome;

function tnGetFormData() {
  var fields = ['nome','descricao','porcao','porcoes','peso',
    'kcal100','energia','vce_energia',
    'carb100','carboidratos','carboidratos_vd',
    'acucar100','acucares','acucar_vd',
    'acucar_ad100','acucares_ad','acucar_ad_vd',
    'prot100','proteinas','proteinas_vd',
    'gord100','gorduras_totais','gorduras_totais_vd',
    'gordsat100','gorduras_sat','gorduras_sat_vd',
    'gordtrans100','gorduras_trans',
    'fibra100','fibras','fibras_vd',
    'sodio100','sodio','sodio_vd',
    'ingredientes','alergicos','validade','lote','cnpj','sac','ean','url'];
  var data = {};
  fields.forEach(function(f) {
    var el = document.getElementById('tn-' + f);
    data[f] = el ? el.value.trim() : '';
  });
  return data;
}

function tnSave() {
  var d = tnGetFormData();
  if (!d.nome) { document.getElementById('tn-status').textContent = 'Informe o nome do produto.'; return; }
  if (_tnEdit !== null) {
    state.tabnutri[_tnEdit] = d;
    addLog('Atualizou tabela nutricional: "' + d.nome + '"');
  } else {
    state.tabnutri.push(d);
    addLog('Salvou tabela nutricional: "' + d.nome + '"');
  }
  saveState();
  _tnEdit = null;
  _tnTab = 'biblioteca';
  document.getElementById('tn-status').textContent = 'v Tabela salva com sucesso!';
  setTimeout(function(){ navigate('tabnutri'); }, 800);
}

function tnLoad(i) {
  _tnEdit = i;
  _tnTab = 'criar';
  navigate('tabnutri');
}

function tnDelete(i) {
  if (!confirm('Excluir esta tabela nutricional?')) return;
  addLog('Excluiu tabela nutricional: "' + state.tabnutri[i].nome + '"');
  state.tabnutri.splice(i, 1);
  saveState();
  navigate('tabnutri');
}

function tnReset() {
  _tnEdit = null;
  _tnTab = 'criar';
  navigate('tabnutri');
}

function tnPrint(i) {
  _tnEdit = i;
  _tnTab = 'criar';
  navigate('tabnutri');
  setTimeout(function(){ tnAskQtdPDF(); }, 400);
}

  modalContent.innerHTML =
    '<div style="padding:1.5rem;max-width:340px">' +

function tnConfirmarQtdPDF() {
  var inp = document.getElementById('tn-qtd-input');

  if (qtd < 1) qtd = 1;
  if (qtd > 999) qtd = 999;
  closeModal();
  tnGeneratePDF(qtd);
}

    return '<div style="width:'+W_PX+'px;height:'+H_PX+'px;background:#fff;font-family:helvetica,arial,sans-serif;display:flex;flex-direction:column;border:3px solid #000;box-sizing:border-box;overflow:hidden">'+

      // TOPO: marca

      // CORPO: duas colunas

        // ── COLUNA ESQUERDA ──

            (d.descricao ? '<div style="font-size:11px;color:#444;margin-top:2px">'+esc(d.descricao)+'</div>' : '')+
          '</div>'+
          '<div style="border-top:1px solid #000;margin-bottom:4px"></div>'+

          // Tabela nutricional
          '<div style="border:2px solid #000;flex:1">'+
            // Header
            '<div style="border-bottom:2px solid #000;padding:4px 6px;font-size:14px;font-weight:700">INFORMAÇÃO NUTRICIONAL</div>'+
            '<div style="padding:3px 6px;font-size:10px;border-bottom:1px solid #aaa">Porções por embalagem: '+nv(d.porcoes)+'</div>'+
            '<div style="padding:3px 6px;font-size:10px;border-bottom:1.5px solid #000">Porção: '+nv(d.porcao)+'</div>'+
            '<table style="width:100%;border-collapse:collapse">'+
              '<thead>'+
                '<tr style="border-bottom:1.5px solid #000">'+
                  '<th style="text-align:left;padding:2px 6px;font-size:10px;font-weight:400"></th>'+
                  '<th style="text-align:center;padding:2px 4px;font-size:10px;font-weight:700;width:60px;border-left:1px solid #aaa">100g</th>'+
                  '<th style="text-align:center;padding:2px 4px;font-size:10px;font-weight:700;width:90px;border-left:1px solid #aaa">'+porção+'</th>'+

                row('Proteínas (g)',             d.prot100, d.proteinas, nv(d.proteinas_vd)+'%', true, false)+

                row('Gorduras Trans (g)',         d.gordtrans100, d.gorduras_trans, '--', false, true)+
                row('Fibras Alimentares (g)',     d.fibra100, d.fibras, nv(d.fibras_vd)+'%', true, false)+
                row('Sódio (mg)',                 d.sodio100, d.sodio, nv(d.sodio_vd)+'%', true, false)+
              '</tbody>'+
            '</table>'+
          '</div>'+

          // Nota %VD
          '<div style="font-size:8px;color:#555;margin-top:4px">*% Valores Diários com base em dieta de 2000kcal.</div>'+

          '<div style="text-align:center;margin-top:6px">'+
            '<img id="tn-bc-img" style="height:50px;max-width:220px;display:block;margin:0 auto">'+
            (d.ean ? '<div style="font-size:9px;margin-top:2px">'+esc(d.ean)+'</div>' : '')+
          '</div>'+

        '</div>'+

        // ── COLUNA DIREITA ──
        '<div style="flex:1;display:flex;flex-direction:column;padding:10px 12px 8px 12px;box-sizing:border-box">'+

            '</div>'+

          '<div style="border-top:1px solid #aaa;margin-bottom:8px"></div>'+

          // QR + "Saiba mais"
          '<div style="display:flex;align-items:center;gap:10px;flex:1">'+

        '<span>'+(d.sac ? 'SAC: '+esc(d.sac) : '')+'</span>'+
      '</div>'+

    '</div>';
  }

  (async function() {
    try {
      status.textContent = 'Preparando etiqueta...';

      var jsPDFLib = window.jspdf || window.jsPDF;
      if (!jsPDFLib) throw new Error('jsPDF não carregado. Recarregue a página.');
      if (!jsPDFLib.jsPDF) jsPDFLib = { jsPDF: jsPDFLib };

      // Gerar QR Code
      var qrDataURL = null;
      try {
        var qrDiv = document.createElement('div');
        qrDiv.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.appendChild(qrDiv);
        var qrLink = (d.url && d.url.trim()) ? d.url.trim() : 'https://costanaturelife.com.br/';
        new QRCode(qrDiv, { text: qrLink, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
        await new Promise(r => setTimeout(r, 300));
        var qrImg = qrDiv.querySelector('img');
        if (qrImg && qrImg.src) {
          var loader = new Image();
          await new Promise(function(res) {
            loader.onload = res; loader.onerror = res;
            loader.src = qrImg.src;
          });
          var qc = document.createElement('canvas'); qc.width = 200; qc.height = 200;
          var ctx = qc.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,200,200); ctx.drawImage(loader,0,0,200,200);
          qrDataURL = qc.toDataURL('image/png');
        }
        document.body.removeChild(qrDiv);
      } catch(e) {}

      // Gerar Barcode
      var bcDataURL = null;
      if (d.ean && d.ean.length >= 8) {
        try {
          var svgEl = document.createElementNS('http://www.w3.org/2000/svg','svg');
          document.body.appendChild(svgEl);
          JsBarcode(svgEl, d.ean, { format: d.ean.length===8?'EAN8':'EAN13', width:2, height:60, displayValue:false, margin:2, background:'#ffffff' });
          var svgURL = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svgEl)], {type:'image/svg+xml;charset=utf-8'}));
          var bcImg = new Image();
          await new Promise(function(res) { bcImg.onload = res; bcImg.onerror = res; bcImg.src = svgURL; });
          var bc = document.createElement('canvas');
          bc.width = svgEl.viewBox.baseVal.width||300; bc.height = svgEl.viewBox.baseVal.height||70;
          var bctx = bc.getContext('2d'); bctx.fillStyle='#fff'; bctx.fillRect(0,0,bc.width,bc.height); bctx.drawImage(bcImg,0,0);
          bcDataURL = bc.toDataURL('image/png');
          document.body.removeChild(svgEl); URL.revokeObjectURL(svgURL);
        } catch(e) {}
      }

      var doc = new jsPDFLib.jsPDF({ orientation: 'landscape', unit: 'mm', format: [150, 100] });

      for (var n = 1; n <= qtdEtiquetas; n++) {
        status.textContent = 'Gerando '+n+'/'+qtdEtiquetas+'...';
        if (n > 1) doc.addPage([150, 100], 'landscape');

        // Montar HTML da etiqueta
        var container = document.createElement('div');
        container.style.cssText = 'position:fixed;left:-9999px;top:0;background:#fff;width:'+W_PX+'px';
        container.innerHTML = buildEtiquetaHTML();
        document.body.appendChild(container);

        // Injetar QR e barcode nas imagens do HTML
        if (qrDataURL) { var qrEl = container.querySelector('#tn-qr-img'); if(qrEl) qrEl.src = qrDataURL; }
        if (bcDataURL) { var bcEl = container.querySelector('#tn-bc-img'); if(bcEl) bcEl.src = bcDataURL; }

        await new Promise(r => setTimeout(r, 80));

        try {
          var canvas = await html2canvas(container.firstChild, {
            scale: 1,
            backgroundColor: '#fff',
            logging: false,
            width:  W_PX,
            height: H_PX,
            windowWidth: W_PX,
          });
          var imgData = canvas.toDataURL('image/jpeg', 0.95);
          doc.addImage(imgData, 'JPEG', 0, 0, 150, 100);
        } catch(e) {
          console.error('html2canvas erro:', e);
          status.textContent = 'Erro: '+e.message;
          document.body.removeChild(container);
          return;
        }
        document.body.removeChild(container);
      }

      doc.save('etiqueta-'+(d.nome||'produto').replace(/\s+/g,'-').toLowerCase()+'.pdf');
      addLog('PDF tabela nutricional: "'+d.nome+'" ('+qtdEtiquetas+'x)');
      status.textContent = '\u2713 '+qtdEtiquetas+' etiqueta(s) gerada(s)!';
      setTimeout(function(){ status.textContent=''; }, 4000);

    } catch(err) {
      console.error('Erro PDF:', err);
      status.textContent = 'Erro: '+err.message;
    }
  })();
}

const DRIVE_SCOPE         = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_REDIRECT      = 'https://edsonandradecf.github.io/plataforma-costa/oauth-drive.html';

// -- Drive OAuth via popup + postMessage ---------------------------------------
async function driveAutenticar() {
  // Tenta token salvo
  try {
    var saved = JSON.parse(localStorage.getItem('drive_token') || 'null');
    if (saved && saved.token && saved.exp > Date.now()) { _driveToken = saved.token; return _driveToken; }
  } catch(e) {}

  return new Promise(function(resolve, reject) {
    var url = 'https://accounts.google.com/o/oauth2/v2/auth' +
      '?client_id=' + DRIVE_CLIENT_ID +
      '&redirect_uri=' + encodeURIComponent(DRIVE_REDIRECT) +
      '&response_type=token' +
      '&scope=' + encodeURIComponent(DRIVE_SCOPE) +
      '&prompt=consent';

    var w = window.open(url, 'drive_auth', 'width=500,height=620,left=200,top=100');
    if (!w) { reject(new Error('Popup bloqueado. Permita popups para este site.')); return; }

    function onMsg(e) {
      if (e.origin !== 'https://edsonandradecf.github.io') return;
      if (!e.data || e.data.type !== 'drive_token') return;
      window.removeEventListener('message', onMsg);
      clearTimeout(timeout);
      if (e.data.error) { reject(new Error(e.data.error)); return; }
      _driveToken = e.data.access_token;
      localStorage.setItem('drive_token', JSON.stringify({ token: _driveToken, exp: Date.now() + 50*60*1000 }));
      resolve(_driveToken);
    }
    window.addEventListener('message', onMsg);
    var timeout = setTimeout(function() {
      window.removeEventListener('message', onMsg);
      if (w && !w.closed) w.close();
      reject(new Error('Tempo esgotado para autenticação Google'));
    }, 120000);
  });
}

async function driveCreateFolder(nome, parentId) {
  if (!_driveToken) await driveAutenticar();
  var meta = JSON.stringify({
    name: nome,
    mimeType: 'application/vnd.google-apps.folder',
    parents: [parentId || DRIVE_FOLDER_ID],
  });
  var resp = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + _driveToken, 'Content-Type': 'application/json' },
    body: meta,
  });
  if (!resp.ok) { var err = await resp.text(); throw new Error('Erro ao criar pasta (' + resp.status + '): ' + err.slice(0,100)); }
  var data = await resp.json();
  // Torna a pasta pública para leitura
  await fetch('https://www.googleapis.com/drive/v3/files/' + data.id + '/permissions', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + _driveToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ role: 'reader', type: 'anyone' }),
  });
  return data.id;
}

async function driveUpload(blob, nome, mimeType, folderId) {
  if (!_driveToken) await driveAutenticar();
  var meta = JSON.stringify({ name: nome, parents: [folderId || DRIVE_FOLDER_ID] });
  var form = new FormData();
  form.append('metadata', new Blob([meta], { type: 'application/json' }));
  form.append('file', blob, nome);
  var resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + _driveToken },
    body: form,
  });
  if (resp.status === 401) {
    localStorage.removeItem('drive_token'); _driveToken = null;
    await driveAutenticar();
    return driveUpload(blob, nome, mimeType, folderId);
  }
  if (!resp.ok) { var err = await resp.text(); throw new Error('Drive upload falhou (' + resp.status + '): ' + err.slice(0,100)); }
  var data = await resp.json();
  await fetch('https://www.googleapis.com/drive/v3/files/' + data.id + '/permissions', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + _driveToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ role: 'reader', type: 'anyone' }),
  });
  return data.id;
}

    '</div>' +
