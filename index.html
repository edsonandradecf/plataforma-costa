<style>
/* ── GLASS THEME — CLARO ─────────────────────────────────── */
:root {
  --bg: #dfe8f0;
  --bg2: rgba(255,255,255,0.55);
  --bg3: rgba(255,255,255,0.35);
  --bg-gradient: linear-gradient(135deg, #dfe8f0 0%, #e8edf5 50%, #dce4ee 100%);

  --sidebar-bg:     rgba(255,255,255,0.45);
  --sidebar-border: rgba(255,255,255,0.75);
  --sidebar-hover:  rgba(255,255,255,0.6);
  --sidebar-active: rgba(255,255,255,0.75);

  --text:  #1e2d3d;
  --text2: #5a7080;
  --text3: #8fa3b5;

  --border:    rgba(255,255,255,0.75);
  --border2:   rgba(0,0,0,0.08);

  --green:  #1a8a4a;
  --green2: #146e3a;
  --red:    #c0392b;
  --red2:   #a93226;
  --blue:   #1a8a4a;
  --amber:  #BA7517;

  --card:     rgba(255,255,255,0.55);
  --card2:    rgba(255,255,255,0.50);
  --input-bg: rgba(255,255,255,0.6);

  --shadow: 0 2px 12px rgba(140,165,195,0.15);
  --glass-blur: blur(20px);
  --nav-active-text: #146e3a;
  --nav-active-icon: #1a8a4a;
}

/* ── GLASS THEME — ESCURO ────────────────────────────────── */
[data-theme="dark"] {
  --bg: #1a1c1e;
  --bg2: rgba(255,255,255,0.05);
  --bg3: rgba(255,255,255,0.03);
  --bg-gradient: linear-gradient(135deg, #1a1c1e 0%, #1f2123 50%, #1c1e20 100%);

  --sidebar-bg:     rgba(255,255,255,0.04);
  --sidebar-border: rgba(255,255,255,0.07);
  --sidebar-hover:  rgba(255,255,255,0.06);
  --sidebar-active: rgba(255,255,255,0.08);

  --text:  rgba(255,255,255,0.88);
  --text2: rgba(255,255,255,0.45);
  --text3: rgba(255,255,255,0.25);

  --border:  rgba(255,255,255,0.09);
  --border2: rgba(255,255,255,0.06);

  --green:  #22c55e;
  --green2: #16a34a;
  --red:    #ef4444;
  --red2:   #dc2626;
  --blue:   #22c55e;
  --amber:  #FAC775;

  --card:     rgba(255,255,255,0.05);
  --card2:    rgba(255,255,255,0.04);
  --input-bg: rgba(255,255,255,0.06);

  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --glass-blur: blur(20px);
  --nav-active-text: #22c55e;
  --nav-active-icon: #22c55e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); background-image: var(--bg-gradient); background-attachment: fixed; color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.2s; }

/* LOGIN */
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-card { background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 0.5px solid var(--border); border-radius: 20px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; box-shadow: var(--shadow); }
.login-logo { text-align: center; margin-bottom: 2rem; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
.login-logo span { color: var(--blue); }
.login-card input { width: 100%; padding: 0.75rem 1rem; border: 0.5px solid var(--border2); border-radius: 8px; background: var(--input-bg); backdrop-filter: blur(20px); color: var(--text); font-size: 0.95rem; margin-bottom: 1rem; outline: none; transition: border 0.2s; }
.login-card input:focus { border-color: var(--blue); }
.pass-wrap { position: relative; margin-bottom: 1rem; }
.pass-wrap input { margin-bottom: 0; padding-right: 2.75rem; }
.pass-eye { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text3); padding: 4px; display: flex; align-items: center; transition: color 0.15s; }
.pass-eye:hover { color: var(--blue); }
.login-card button.btn-primary { width: 100%; padding: 0.75rem; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.login-card button.btn-primary:hover { background: #185FA5; }
.login-remember { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; font-size: 0.875rem; color: var(--text2); cursor: pointer; }
.login-remember input { width: auto; margin: 0; }
.login-error { color: var(--red); font-size: 0.85rem; text-align: center; margin-top: 0.75rem; min-height: 1.2em; }

/* LAYOUT */
#app { display: none; min-height: 100vh; }
.layout { display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar { width: 220px; background: var(--sidebar-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); min-height: 100vh; display: flex; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; transition: width 0.25s cubic-bezier(.4,0,.2,1), background 0.3s; overflow: hidden; border-right: 0.5px solid var(--sidebar-border); }
.sidebar.collapsed { width: 54px; }
.sidebar-logo { height: 54px; padding: 0 14px; font-size: 1.05rem; font-weight: 700; color: var(--text); border-bottom: 0.5px solid var(--border2); letter-spacing: -0.3px; white-space: nowrap; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.sidebar-logo span { color: var(--blue); }
.sidebar-logo-text { flex: 1; overflow: hidden; transition: opacity 0.2s, max-width 0.25s; max-width: 200px; }
.sidebar.collapsed .sidebar-logo-text { opacity: 0; max-width: 0; }
.sidebar-toggle { background: none; border: none; color: var(--text3); cursor: pointer; padding: 5px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 28px; height: 28px; transition: color 0.15s, background 0.15s; }
.sidebar-toggle:hover { color: var(--text); background: var(--sidebar-hover); }
.sidebar-nav { flex: 1; padding: 6px 0; overflow-y: auto; overflow-x: hidden; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 0 0 0 16px; height: 42px; cursor: pointer; color: var(--text2); font-size: 0.875rem; transition: all 0.15s; border-left: 3px solid transparent; user-select: none; white-space: nowrap; margin: 1px 8px; border-radius: 8px; padding-left: 12px; }
.nav-item:hover { background: var(--sidebar-hover); color: var(--text); }
.nav-item.active { background: var(--sidebar-active); color: var(--nav-active-text); border: 0.5px solid rgba(55,138,221,0.25); border-left: 3px solid var(--nav-active-icon); }
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item-label { overflow: hidden; transition: opacity 0.2s, max-width 0.25s; max-width: 200px; }
.sidebar.collapsed .nav-item-label { opacity: 0; max-width: 0; }
.sidebar.collapsed .nav-item { padding: 0; justify-content: center; border-left: 3px solid transparent; border-radius: 0; margin: 1px 0; }
.sidebar.collapsed .nav-item.active { border-left-color: var(--nav-active-icon); background: var(--sidebar-active); color: var(--nav-active-text); }
.sidebar.collapsed .nav-item:hover { border-left-color: transparent; }
.sidebar-bottom { padding: 10px 14px; border-top: 0.5px solid var(--border2); flex-shrink: 0; overflow: hidden; }
.sidebar.collapsed .sidebar-bottom { padding: 10px 0; display: flex; flex-direction: column; align-items: center; }
.sidebar-user { color: var(--text3); font-size: 0.78rem; margin-bottom: 8px; white-space: nowrap; overflow: hidden; transition: opacity 0.2s, max-height 0.25s; max-height: 40px; }
.sidebar-user strong { color: var(--text2); display: block; font-size: 0.82rem; }
.sidebar.collapsed .sidebar-user { opacity: 0; max-height: 0; margin: 0; }
.btn-logout { width: 100%; padding: 6px 10px; background: rgba(0,0,0,0.05); color: var(--text2); border: 0.5px solid var(--border2); border-radius: 7px; cursor: pointer; font-size: 0.8rem; transition: all 0.15s; white-space: nowrap; text-align: center; }
[data-theme="dark"] .btn-logout { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); border-color: rgba(255,255,255,0.1); }
.btn-logout:hover { background: rgba(0,0,0,0.1); color: var(--text); }
[data-theme="dark"] .btn-logout:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.9); }
.sidebar.collapsed .btn-logout { width: 34px; height: 34px; padding: 0; border-radius: 50%; font-size: 1rem; display: flex; align-items: center; justify-content: center; }

/* MAIN */
.main { margin-left: 220px; flex: 1; min-height: 100vh; background: transparent; transition: margin-left 0.22s ease; }
.main.sidebar-collapsed { margin-left: 52px; }
.topbar { background: var(--bg2); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--border); padding: 0.875rem 1.75rem; display: flex; align-items: center; justify-content: between; gap: 1rem; position: sticky; top: 0; z-index: 50; }
.topbar h1 { font-size: 1.1rem; font-weight: 600; flex: 1; }
.theme-toggle { background: var(--bg3); backdrop-filter: blur(20px); border: 0.5px solid var(--border2); border-radius: 8px; padding: 0.4rem 0.75rem; cursor: pointer; color: var(--text2); font-size: 0.85rem; display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
.theme-toggle:hover { border-color: var(--blue); color: var(--blue); }
.page-content { padding: 1.75rem; }

/* CARDS */
.card { background: var(--card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.25rem; box-shadow: var(--shadow); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
.card-title { font-size: 1rem; font-weight: 600; }

/* BUTTONS */
.btn { padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn-green { background: var(--green); color: #fff; border-color: var(--green); }
.btn-green:hover { background: var(--green2); border-color: var(--green2); color: #fff; }
.btn-red { background: var(--red); color: #fff; border-color: var(--red); }
.btn-red:hover { background: var(--red2); border-color: var(--red2); color: #fff; }
.btn-sm { padding: 0.3rem 0.65rem; font-size: 0.8rem; }

/* TASKS */
.task-list { display: flex; flex-direction: column; gap: 8px; }
.task-item { display: flex; align-items: center; gap: 12px; padding: 0.875rem 1rem; background: var(--bg3); border-radius: 10px; border: 1px solid var(--border); transition: all 0.15s; }
.task-item.done { opacity: 0.6; }
.task-item.done .task-text { text-decoration: line-through; color: var(--text3); }
.task-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; background: var(--bg2); }
.task-check.checked { background: var(--green); border-color: var(--green); }
.task-check.checked::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 700; }
.task-text { flex: 1; font-size: 0.9rem; }
.task-meta { font-size: 0.78rem; color: var(--text3); white-space: nowrap; }
.task-badge { font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: #fef2f2; color: var(--red); border: 1px solid #fecaca; white-space: nowrap; }
.task-delete { background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px; border-radius: 6px; transition: all 0.15s; font-size: 1rem; }
.task-delete:hover { color: var(--red); background: #fef2f2; }

/* ADD TASK FORM */
.add-task-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.25rem; }
.add-task-form input, .add-task-form select { padding: 0.6rem 0.875rem; border: 0.5px solid var(--border2); border-radius: 8px; background: var(--input-bg); backdrop-filter: blur(10px); color: var(--text); font-size: 0.875rem; outline: none; transition: border 0.2s; }
.add-task-form input:focus, .add-task-form select:focus { border-color: var(--blue); }
.add-task-form input[type="text"] { flex: 1; min-width: 160px; }

/* COMPRAS */
.compras-item { display: flex; align-items: center; gap: 10px; padding: 0.75rem 1rem; background: var(--bg2); backdrop-filter: blur(10px); border-radius: 10px; border: 0.5px solid var(--border); margin-bottom: 8px; }
.compras-check { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--border2); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; background: var(--bg3); }
.compras-check.checked { background: var(--green); border-color: var(--green); }
.compras-check.checked::after { content: '✓'; color: #fff; font-size: 10px; font-weight: 700; }
.compras-text { flex: 1; font-size: 0.9rem; }
.compras-text.done { text-decoration: line-through; color: var(--text3); }

/* MURAL */
.mural-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
.mural-note { background: rgba(255,251,220,0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 0.5px solid rgba(255,235,100,0.5); border-radius: 12px; padding: 1.1rem; min-height: 120px; position: relative; }
[data-theme="dark"] .mural-note { background: rgba(60,50,30,0.5); border-color: rgba(100,80,30,0.4); }
.mural-note-author { font-size: 0.75rem; color: var(--text3); margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.mural-note-text { font-size: 0.9rem; color: var(--text); line-height: 1.5; }
.mural-note-del { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 1rem; padding: 2px 4px; border-radius: 4px; transition: all 0.15s; }
.mural-note-del:hover { color: var(--red); background: rgba(224,82,82,0.1); }

/* AGENDA */
.calendar { border: 0.5px solid var(--border); border-radius: 14px; overflow: hidden; }
.calendar-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; background: var(--bg2); backdrop-filter: blur(16px); border-bottom: 0.5px solid var(--border); }
.calendar-nav { background: var(--bg3); border: 0.5px solid var(--border2); border-radius: 8px; padding: 4px 10px; cursor: pointer; color: var(--text); font-size: 1rem; transition: all 0.15s; }
.calendar-nav:hover { border-color: var(--blue); color: var(--blue); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-day-header { text-align: center; padding: 0.65rem; font-size: 0.75rem; font-weight: 600; color: var(--text3); background: var(--bg3); border-bottom: 0.5px solid var(--border); text-transform: uppercase; }
.cal-day { min-height: 80px; padding: 6px; background: var(--bg2); border-right: 0.5px solid var(--border); border-bottom: 0.5px solid var(--border); cursor: pointer; transition: background 0.15s; position: relative; }
.cal-day:hover { background: var(--sidebar-hover); }
.cal-day.other-month { background: var(--bg3); }
.cal-day.other-month .cal-day-num { color: var(--text3); }
.cal-day.today { background: rgba(55,138,221,0.08); }
[data-theme="dark"] .cal-day.today { background: rgba(55,138,221,0.1); }
.cal-day-num { font-size: 0.8rem; font-weight: 500; color: var(--text2); margin-bottom: 4px; }
.cal-day.today .cal-day-num { color: var(--blue); font-weight: 700; }
.cal-event { font-size: 0.7rem; background: var(--blue); color: #fff; border-radius: 3px; padding: 1px 5px; margin-bottom: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }

/* ETIQUETAS */
.label-form { display: grid; gap: 1rem; }
.label-form label { font-size: 0.85rem; font-weight: 500; color: var(--text2); display: block; margin-bottom: 4px; }
.label-form input, .label-form select, .label-form textarea { width: 100%; padding: 0.65rem 0.875rem; border: 0.5px solid var(--border2); border-radius: 8px; background: var(--input-bg); backdrop-filter: blur(10px); color: var(--text); font-size: 0.875rem; outline: none; font-family: inherit; transition: border 0.2s; }
.label-form input:focus, .label-form select:focus, .label-form textarea:focus { border-color: var(--blue); }
.label-form textarea { min-height: 140px; resize: vertical; font-family: monospace; font-size: 0.8rem; }
.dim-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

/* LOGS */
.log-item { display: flex; align-items: flex-start; gap: 12px; padding: 0.75rem 0; border-bottom: 0.5px solid var(--border); font-size: 0.875rem; }
.log-item:last-child { border-bottom: none; }
.log-time { color: var(--text3); font-size: 0.78rem; white-space: nowrap; min-width: 130px; }
.log-user { font-weight: 600; color: var(--blue); min-width: 70px; }
.log-desc { color: var(--text2); }

/* INICIO */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.stat-card { background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 0.5px solid var(--border); border-radius: 14px; padding: 1.25rem; box-shadow: var(--shadow); }
.stat-label { font-size: 0.8rem; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; }
.stat-value { font-size: 1.75rem; font-weight: 700; color: var(--text); }
.stat-icon { font-size: 1.5rem; margin-bottom: 0.5rem; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.modal { background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-radius: 18px; padding: 1.75rem; width: 100%; max-width: 480px; border: 0.5px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
.modal h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 1.25rem; }
.modal input, .modal select, .modal textarea { width: 100%; padding: 0.65rem 0.875rem; border: 0.5px solid var(--border2); border-radius: 8px; background: var(--input-bg); backdrop-filter: blur(10px); color: var(--text); font-size: 0.875rem; outline: none; margin-bottom: 0.875rem; font-family: inherit; transition: border 0.2s; }
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--blue); }
.modal textarea { resize: vertical; min-height: 80px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 0.5rem; }

/* EMPTY */
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--text3); }
.empty-state svg { width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.4; }
.empty-state p { font-size: 0.9rem; }

/* TABNUTRI */
.tn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
.tn-saved-list { display: flex; flex-direction: column; gap: 8px; }
.tn-saved-item { display: flex; align-items: center; gap: 10px; padding: 0.75rem 1rem; background: var(--bg2); backdrop-filter: blur(10px); border-radius: 10px; border: 0.5px solid var(--border); }
.tn-saved-item:hover { border-color: var(--blue); }
.tn-saved-name { flex: 1; font-size: 0.9rem; font-weight: 500; }
.tn-saved-sub { font-size: 0.78rem; color: var(--text3); }
.tn-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tn-form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.tn-label { font-size: 0.8rem; font-weight: 500; color: var(--text2); display: block; margin-bottom: 3px; }
.tn-input { width: 100%; padding: 0.55rem 0.75rem; border: 0.5px solid var(--border2); border-radius: 7px; background: var(--input-bg); backdrop-filter: blur(10px); color: var(--text); font-size: 0.85rem; outline: none; transition: border 0.2s; font-family: inherit; }
.tn-input:focus { border-color: var(--blue); }
.tn-section { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text3); margin: 1rem 0 0.5rem; padding-bottom: 4px; border-bottom: 0.5px solid var(--border); }
/* Etiqueta preview */

<script>
// --- DATA STORE ---------------------------------------------------------------
const USERS = [
  { login: 'Edson', senha: '@Edanco_10', role: 'admin' },
  { login: 'Julia', senha: 'juliaRS2', role: 'admin' },
  { login: 'expedicao', senha: 'expedicao', role: 'expedicao' },
  { login: 'producao', senha: 'producao', role: 'producao' },
];

let state = {
  tasks: { expedicao: [], producao: [] },
  compras: [],
  mural: [],
  agenda: [],
  logs: [],
  tabnutri: [],
  financeiro: { meses: {}, despesas: {}, aliquota: 0, custoProdutos: {}, tarifasSku: {} },
  estoque: { produtos: [], movimentacoes: [], historicoManual: [] },
  ponto: { colaboradores: [], registros: [] },
  devolucoes: [],
  tv: { periodos: {} },   // painel da TV: vendas importadas por periodo
  produtos: [],        // catálogo de produtos finais (salvo separado no Firebase)
  mlToken: null,
  shopeeToken: null,
  currentUser: null,
  currentPage: 'inicio',
  calMonth: new Date().getMonth(),
  calYear: new Date().getFullYear(),
};

// --- FIREBASE REALTIME DATABASE CONFIG --------------------------------------
const FIREBASE_URL = 'https://plataforma-costa-default-rtdb.firebaseio.com';

let _saveTimer = null;
let _isSaving = false;
let _pendingSave = false;
let _sseSource = null;
let _firebaseReady = false;
let _loginTime = 0; // momento do login -- primeiros 10s bloqueiam pushToCloud

function showSyncStatus(msg, color) {
  const el = document.getElementById('sync-status');
  if (el) { el.textContent = msg; el.style.color = color || 'var(--text3)'; }
}

function dataSize(d) {
  if (!d) return 0;
  var t = d.tasks || {};
  var est = d.estoque || {};
  var pt = d.ponto || {};
  return (Array.isArray(t.expedicao)         ? t.expedicao.length         : 0) +
         (Array.isArray(t.producao)           ? t.producao.length          : 0) +
         (Array.isArray(d.compras)            ? d.compras.length           : 0) +
         (Array.isArray(d.mural)              ? d.mural.length             : 0) +
         (Array.isArray(d.agenda)             ? d.agenda.length            : 0) +
         (Array.isArray(d.tabnutri)           ? d.tabnutri.length          : 0) +
         (Array.isArray(est.produtos)         ? est.produtos.length        : 0) +
         (Array.isArray(d.devolucoes)         ? d.devolucoes.length        : 0) +
         (Array.isArray(pt.colaboradores)     ? pt.colaboradores.length    : 0) +
         (Array.isArray(pt.registros)         ? pt.registros.length        : 0);
}

function applyParsed(parsed, forceMerge) {
  if (!parsed) return;
  // Safety check: never overwrite existing local data with empty remote data
  // unless explicitly forced (e.g. after a confirmed save)
  if (!forceMerge) {
    var currentSize = dataSize({
      tasks: state.tasks, compras: state.compras, mural: state.mural,
      agenda: state.agenda, tabnutri: state.tabnutri,
      estoque: state.estoque, ponto: state.ponto, devolucoes: state.devolucoes
    });
    var incomingSize = dataSize(parsed);
    // If we have data locally and remote is empty, keep local data
    if (currentSize > 0 && incomingSize === 0) {
      console.warn('applyParsed: ignoring empty remote data (local has', currentSize, 'items)');
      return;
    }
  }
  var t = parsed.tasks || {};
  var tAtual = state.tasks || {};
  function manterLista(nova, atual) {
    if (Array.isArray(nova) && nova.length > 0) return nova;
    if (Array.isArray(atual) && atual.length > 0) return atual;
    return Array.isArray(nova) ? nova : [];
  }
  state.tasks = {
    expedicao: manterLista(t.expedicao, tAtual.expedicao),
    producao:  manterLista(t.producao,  tAtual.producao),
  };
  state.compras  = manterLista(parsed.compras,  state.compras);
  state.mural    = manterLista(parsed.mural,    state.mural);
  state.agenda   = manterLista(parsed.agenda,   state.agenda);
  state.logs     = Array.isArray(parsed.logs)     ? parsed.logs     : [];
  state.tabnutri = manterLista(parsed.tabnutri, state.tabnutri);

  var est  = parsed.estoque || {};
  var estA = state.estoque  || {};
  state.estoque = {
    produtos:        manterLista(est.produtos,        estA.produtos),
    movimentacoes:   manterLista(est.movimentacoes,   estA.movimentacoes),
    historicoManual: manterLista(est.historicoManual, estA.historicoManual),
  };
  var pt = parsed.ponto || {};
  // Formato correto: { colaboradores: [...], registros: [...] }
  state.ponto = {
    colaboradores: Array.isArray(pt.colaboradores) && pt.colaboradores.length > 0
      ? pt.colaboradores
      : (state.ponto && Array.isArray(state.ponto.colaboradores) && state.ponto.colaboradores.length > 0
          ? state.ponto.colaboradores : []),
    registros: Array.isArray(pt.registros) && pt.registros.length > 0
      ? pt.registros
      : (state.ponto && Array.isArray(state.ponto.registros) && state.ponto.registros.length > 0
          ? state.ponto.registros : []),
  };
  state.devolucoes = Array.isArray(parsed.devolucoes) && parsed.devolucoes.length > 0
    ? parsed.devolucoes
    : (Array.isArray(state.devolucoes) && state.devolucoes.length > 0 ? state.devolucoes : []);

  // TV: dados de vendas importados (semana + meses)
  var tvIn  = parsed.tv || {};
  var tvOld = state.tv  || {};
  var mesesIn  = tvIn.meses  || {};
  var mesesOld = tvOld.meses || {};
  state.tv = {
    semana: tvIn.semana || tvOld.semana || null,
    meses:  Object.keys(mesesIn).length > 0 ? mesesIn : mesesOld,
  };
  if (tvIn.periodos && !state.tv.semana) {   // formato antigo
    var ksTv = Object.keys(tvIn.periodos).sort();
    if (ksTv.length) state.tv.semana = tvIn.periodos[ksTv[ksTv.length - 1]];
  }
  if (parsed.mlToken) {
    state.mlToken = parsed.mlToken;
    localStorage.setItem('ml_token', JSON.stringify(parsed.mlToken));
  }
  if (parsed.shopeeToken) {
    state.shopeeToken = parsed.shopeeToken;
    localStorage.setItem('shopee_token', JSON.stringify(parsed.shopeeToken));
  }
}

// -- Carrega dados do Firebase uma vez (no login) --------------------------
async function loadState() {
  // 1. Cache local instantâneo para não piscar
  try {
    const s = localStorage.getItem('costa_state');
    if (s) applyParsed(JSON.parse(s));
  } catch(e) {}

  // 2. Busca dados atualizados do Firebase
  try {
    showSyncStatus('<> Sincronizando...', 'var(--text3)');
    const resp = await fetch(FIREBASE_URL + '/data.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const parsed = await resp.json();
    const localStr = localStorage.getItem('costa_state');
    const localData = localStr ? JSON.parse(localStr) : null;
    if (parsed && dataSize(parsed) > 0) {
      // Firebase tem dados -- usa como fonte de verdade
      applyParsed(parsed, true);
      localStorage.setItem('costa_state', JSON.stringify(parsed));
      _firebaseReady = true;
    } else if (localData && dataSize(localData) > 0) {
      // Firebase vazio mas temos dados locais -- envia para Firebase
      console.log('Firebase vazio, enviando dados locais para a nuvem...');
      applyParsed(localData, true);
      _firebaseReady = true;
      pushToCloud(localData);
    } else {
      // Ambos vazios -- Firebase pronto para receber dados novos
      _firebaseReady = true;
    }
    showSyncStatus('v Pronto', 'var(--green)');
    setTimeout(() => showSyncStatus('', ''), 1500);
  } catch(e) {
    showSyncStatus('⚠ Sem conexão', 'var(--amber)');
  }
}

// -- Listener em tempo real via SSE do Firebase ----------------------------
// O Firebase Realtime Database suporta Server-Sent Events nativamente.
// Quando qualquer usuário salva, todos os outros recebem o dado novo em ~1s
// sem precisar recarregar a página.
function startRealtimeSync() {
  if (_sseSource) { _sseSource.close(); _sseSource = null; }

  try {
    _sseSource = new EventSource(FIREBASE_URL + '/data.json');

    _sseSource.addEventListener('put', function(e) {
      try {
        const msg = JSON.parse(e.data);
        // msg.path === '/' significa dados completos; msg.data é o payload
        if (!msg || !msg.data) return;
        const incoming = msg.data;

        // Não aplicar sem usuário logado ou se EU fui quem salvou (evita flicker)
        if (!state.currentUser || _isSaving) return;

        // Preserva historicoManual local se o Firebase ainda não tem (push pendente)
        var localManual = state.estoque && state.estoque.historicoManual;
        if (localManual && localManual.length > 0) {
          var remoteManual = incoming.estoque && incoming.estoque.historicoManual;
          if (!remoteManual || remoteManual.length < localManual.length) {
            if (!incoming.estoque) incoming.estoque = {};
            incoming.estoque.historicoManual = localManual;
          }
        }

        // SSE data is authoritative -- use forceMerge=true
        _firebaseReady = true;
        applyParsed(incoming, true);
        localStorage.setItem('costa_state', JSON.stringify(incoming));

        // Re-renderiza a página atual com os novos dados
        if (state.currentUser) {
          safeRenderPage();
          showSyncStatus('🔄 Atualizado', 'var(--green)');
          setTimeout(() => showSyncStatus('', ''), 1500);
        }
      } catch(err) {}
    });

    _sseSource.addEventListener('cancel', function() {
      showSyncStatus('⚠ Sync pausado', 'var(--amber)');
    });

    _sseSource.onerror = function() {
      // Reconecta automaticamente após 5s se a conexão cair
      showSyncStatus('⚠ Reconectando...', 'var(--amber)');
      if (_sseSource) { _sseSource.close(); _sseSource = null; }
      setTimeout(() => { if (state.currentUser) startRealtimeSync(); }, 5000);
    };

  } catch(e) {
    // SSE não disponível -- fallback para polling a cada 8 segundos
    startPolling();
  }
}

// -- Fallback: polling a cada 8s se SSE não funcionar ---------------------
let _pollTimer = null;
function startPolling() {
  if (_pollTimer) return;
  _pollTimer = setInterval(async () => {
    if (!state.currentUser || _isSaving) return;
    try {
      const resp = await fetch(FIREBASE_URL + '/data.json');
      if (!resp.ok) return;
      const parsed = await resp.json();
      if (!parsed) return;
      const local = localStorage.getItem('costa_state');
      const remoteStr = JSON.stringify(parsed);
      if (local !== remoteStr) {
        applyParsed(parsed);
        localStorage.setItem('costa_state', remoteStr);
        if (state.currentUser) {
          safeRenderPage();
          showSyncStatus('🔄 Atualizado', 'var(--green)');
          setTimeout(() => showSyncStatus('', ''), 1500);
        }
      }
    } catch(e) {}
  }, 8000);
}

function stopSync() {
  if (_sseSource) { _sseSource.close(); _sseSource = null; }
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
}

// -- Salvar dados no Firebase ----------------------------------------------

// Conta itens críticos nos dados para proteção anti-sobrescrita
function dataItemCount(data) {
  var n = 0;
  try {
    n += ((data.estoque && data.estoque.produtos) ? data.estoque.produtos.length : 0);
    n += ((data.ponto && data.ponto.colaboradores) ? data.ponto.colaboradores.length : 0);
    n += ((data.ponto && data.ponto.registros) ? data.ponto.registros.length : 0);
    n += (Array.isArray(data.compras)   ? data.compras.length   : 0);
    n += (Array.isArray(data.tabnutri)  ? data.tabnutri.length  : 0);
    n += (Array.isArray(data.devolucoes)? data.devolucoes.length: 0);
    var t = data.tasks || {};
    n += (Array.isArray(t.expedicao) ? t.expedicao.length : 0);
    n += (Array.isArray(t.producao)  ? t.producao.length  : 0);
  } catch(e) {}
  return n;
}

// Último estado salvo com sucesso no Firebase (para comparação)
var _lastSavedCount = null;

async function salvarBackupFirebase(data) {
  try {
    var hoje = new Date();
    var key = hoje.getFullYear() + '-' +
              String(hoje.getMonth()+1).padStart(2,'0') + '-' +
              String(hoje.getDate()).padStart(2,'0');
    await fetch(FIREBASE_URL + '/backups/' + key + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ts: hoje.toISOString(), data: data }),
    });
  } catch(e) {
    console.warn('[Backup] Falha ao salvar backup:', e.message);
  }
}

function saveState() {
  const data = {
    tasks:       state.tasks,
    compras:     state.compras,
    mural:       state.mural,
    agenda:      state.agenda,
    logs:        state.logs,
    tabnutri:    state.tabnutri,
    estoque:     state.estoque,
    ponto:       state.ponto,
    devolucoes:  state.devolucoes,
    tv:          state.tv,
    mlToken:     state.mlToken     || null,
    shopeeToken: state.shopeeToken || null,
  };

  // Proteção anti-sobrescrita: bloqueia se novos dados têm muito menos itens
  if (_lastSavedCount !== null) {
    var newCount = dataItemCount(data);
    if (newCount < _lastSavedCount * 0.5 && _lastSavedCount > 5) {
      console.error('[PROTEÇÃO] saveState bloqueado! Tentativa de salvar ' + newCount +
        ' itens quando havia ' + _lastSavedCount + '. Possível perda de dados evitada.');
      showSyncStatus('⚠ Proteção ativada', 'var(--red)');
      return;
    }
  }

  localStorage.setItem('costa_state', JSON.stringify(data));
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => pushToCloud(data), 600);
}

async function pushToCloud(data) {
  var secondsSinceLogin = (Date.now() - _loginTime) / 1000;
  if (secondsSinceLogin < 10) {
    console.log('pushToCloud aguardando sync inicial (' + secondsSinceLogin.toFixed(1) + 's < 10s)');
    if (_saveTimer) clearTimeout(_saveTimer);
    var remaining = Math.ceil(10000 - (Date.now() - _loginTime));
    _saveTimer = setTimeout(() => pushToCloud(data), remaining + 200);
    return;
  }
  if (!_firebaseReady) {
    console.warn('pushToCloud bloqueado: Firebase ainda não confirmado');
    return;
  }
  if (_isSaving) { _pendingSave = true; return; }
  _isSaving = true;
  showSyncStatus('^ Salvando...', 'var(--text3)');
  try {
    const resp = await fetch(FIREBASE_URL + '/data.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    localStorage.setItem('costa_state', JSON.stringify(data));

    // Atualiza contador e salva backup diário
    var count = dataItemCount(data);
    if (_lastSavedCount === null || count >= _lastSavedCount) {
      _lastSavedCount = count;
      // Backup uma vez por dia (verifica se já fez hoje)
      var hoje = new Date().toISOString().slice(0,10);
      var ultimoBackup = localStorage.getItem('costa_last_backup');
      if (ultimoBackup !== hoje) {
        salvarBackupFirebase(data);
        localStorage.setItem('costa_last_backup', hoje);
      }
    }

    showSyncStatus('v Salvo', 'var(--green)');
    setTimeout(() => showSyncStatus('', ''), 1500);
  } catch(e) {
    showSyncStatus('⚠ Erro ao salvar', 'var(--red)');
  } finally {
    _isSaving = false;
    if (_pendingSave) { _pendingSave = false; pushToCloud(data); }
  }
}

async function renovarTokens() {
  // ML — renova se expira em menos de 1 hora
  try {
    var mlT = mlLoadToken();
    if (mlT && mlT.refresh_token && mlT.expires_at && (mlT.expires_at - Date.now()) < 60 * 60 * 1000) {
      await mlRefreshToken();
      console.log('Token ML renovado automaticamente');
    }
  } catch(e) { console.log('Falha ao renovar token ML:', e.message); }

  // Shopee — renova se expira em menos de 2 horas
  try {
    var shT = shopeeLoadToken();
    if (shT && shT.refresh_token && shT.expires_at && (shT.expires_at - Date.now()) < 2 * 60 * 60 * 1000) {
      await shopeeRefreshToken();
      console.log('Token Shopee renovado automaticamente');
    }
  } catch(e) { console.log('Falha ao renovar token Shopee:', e.message); }
}

function renderInicio() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayStr = today.toISOString().slice(0,10);

  function countTasks(area) {
    return state.tasks[area].filter(t => !t.done && t.date <= todayStr).length;
  }
  const expPendente = countTasks('expedicao');
  const prodPendente = countTasks('producao');
  const comprasPendente = state.compras.filter(t => !t.done).length;
  const muralTotal = state.mural.length;

  // Mural -- post-its estilo original
  let muralHtml = '';
  if (!state.mural.length) {
    muralHtml = '<p style="color:var(--text3);font-size:0.875rem;padding:1rem 0;text-align:center">Nenhum recado no mural</p>';
  } else {
    muralHtml = '<div class="mural-grid" style="margin-top:0.5rem">' +
      state.mural.slice(0,6).map(m =>
        '<div class="mural-note">' +
          '<div class="mural-note-author">' + esc(m.author) + ' . ' + m.time + '</div>' +
          '<div class="mural-note-text">' + esc(m.text) + '</div>' +
        '</div>'
      ).join('') +
    '</div>';
  }

  // Helper: lista de tarefas somente-visualização (sem checkbox, sem excluir)
  function tarefasViewOnly(area) {
    const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
    const tomorrowStr = tomorrow.toISOString().slice(0,10);
    const cols = (state.ponto && state.ponto.colaboradores) || [];

    const tasks = [...(state.tasks[area]||[])]
      .filter(t => !t.done)
      .sort((a, b) => {
        const dateA = a.date + (a.time || '');
        const dateB = b.date + (b.time || '');
        return dateA.localeCompare(dateB);
      })
      .slice(0, 8);

    if (!tasks.length) {
      return '<p style="color:var(--text3);font-size:0.875rem;padding:1rem 0;text-align:center">Nenhuma tarefa pendente</p>';
    }

    return '<div class="task-list">' + tasks.map(t => {
      const isLate     = t.date < todayStr;
      const isToday    = t.date === todayStr;
      const isTomorrow = t.date === tomorrowStr;
      const dateStr = new Date(t.date + 'T12:00:00').toLocaleDateString('pt-BR') + (t.time ? ' ' + t.time : ' · Sem horário');

      let badge = '';
      if (isLate)     badge = '<span class="task-badge">⚠ Atraso</span>';
      else if (isToday)    badge = '<span class="task-badge" style="background:var(--green);color:#fff;border:none">Hoje</span>';
      else if (isTomorrow) badge = '<span class="task-badge" style="background:#1a8a4a;color:#fff;border:none">Amanhã</span>';

      // Badge de pessoa se atribuída
      let pessoaBadge = '';
      if (t.colabIdx !== undefined && t.colabIdx !== null && cols[t.colabIdx]) {
        pessoaBadge = '<span style="padding:2px 8px;border-radius:12px;font-size:0.68rem;font-weight:700;background:#7c3aed18;color:#7c3aed;white-space:nowrap">👤 ' + esc(cols[t.colabIdx].nome.split(' ')[0]) + '</span>';
      }

      return `<div class="task-item" style="cursor:default">
        <div class="task-text">${esc(t.text)}</div>
        ${pessoaBadge}
        <span class="task-meta">${dateStr}</span>
        ${badge}
      </div>`;
    }).join('') + '</div>';
  }

  return `
  <!-- Linha 1: 4 cards de métricas -->
  <div class="stats-grid" style="margin-bottom:1rem">
    <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-label">Tarefas Expedição Hoje</div><div class="stat-value">${expPendente}</div></div>
    <div class="stat-card"><div class="stat-icon">🏭</div><div class="stat-label">Tarefas Produção Hoje</div><div class="stat-value">${prodPendente}</div></div>
    <div class="stat-card"><div class="stat-icon">🛒</div><div class="stat-label">Itens para Comprar</div><div class="stat-value">${comprasPendente}</div></div>
    <div class="stat-card"><div class="stat-icon">📌</div><div class="stat-label">Recados no Mural</div><div class="stat-value">${muralTotal}</div></div>
  </div>

  <!-- Linha 2: Mural -->
  <div style="margin-bottom:1rem">
    <div class="card" style="min-height:200px">
      <div class="card-header" style="margin-bottom:0.5rem">
        <span class="card-title">📌 Mural de Recados</span>
      </div>
      ${muralHtml}
    </div>
  </div>

  <!-- Linha 3: Tarefas Produção + Tarefas Expedição (somente visualização) -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
    <div class="card" style="min-height:200px">
      <div class="card-header" style="margin-bottom:0.75rem">
        <span class="card-title">🏭 Tarefas da Produção</span>
      </div>
      ${tarefasViewOnly('producao')}
    </div>
    <div class="card" style="min-height:200px">
      <div class="card-header" style="margin-bottom:0.75rem">
        <span class="card-title">📦 Tarefas da Expedição</span>
      </div>
      ${tarefasViewOnly('expedicao')}
    </div>
  </div>`;
}


// --- TAREFAS (unificado: Expedição + Produção) ---------------------------------
var _tarefaFiltro = 'todos'; // 'todos' | 'expedicao' | 'producao' | 'p:<idx>'

var SETORES = [
  { id: 'expedicao', label: 'Expedição', icon: '📦', cor: '#2563eb' },
  { id: 'producao',  label: 'Produção',  icon: '🏭', cor: '#ea580c' },
];

// Normaliza o setor: aceita "Produção", "PRODUCAO", "producao" etc.
function normalizarSetor(v) {
  if (!v) return '';
  var s = String(v).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')  // tira acentos
    .replace(/[^a-z]/g, '');                            // tira espacos e simbolos
  if (s.indexOf('exped') === 0 || s === 'exp')  return 'expedicao';
  if (s.indexOf('produ') === 0 || s === 'prod') return 'producao';
  return '';
}

// Setor de um colaborador, ja normalizado
function setorDoColab(c) {
  if (!c) return '';
  return normalizarSetor(c.setor) || normalizarSetor(c.cargo) || '';
}

function setorLabel(id) {
  var s = SETORES.find(function(x){ return x.id === id; });
  return s ? s.label : id;
}
function setorIcon(id) {
  var s = SETORES.find(function(x){ return x.id === id; });
  return s ? s.icon : '';
}
function setorCor(id) {
  var s = SETORES.find(function(x){ return x.id === id; });
  return s ? s.cor : 'var(--text2)';
}

// Retorna todas as tarefas de todos os setores com metadados
function tarefasTodas() {
  var out = [];
  SETORES.forEach(function(s) {
    var arr = (state.tasks && state.tasks[s.id]) || [];
    arr.forEach(function(t, i) {
      out.push(Object.assign({}, t, { _setor: s.id, _idx: i }));
    });
  });
  return out;
}

function renderTarefas() {
  if (!state.currentUser) return '';
  var isAdm = state.currentUser.role === 'admin';
  var role  = state.currentUser.role;
  var cols  = (state.ponto && state.ponto.colaboradores) || [];

  // Usuário limitado só vê seu setor
  var setorFixo = null;
  if (role === 'expedicao') setorFixo = 'expedicao';
  if (role === 'producao')  setorFixo = 'producao';
  if (setorFixo) _tarefaFiltro = setorFixo;

  var today = new Date(); today.setHours(0,0,0,0);
  var todayStr = today.toISOString().slice(0,10);
  var tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
  var tomorrowStr = tomorrow.toISOString().slice(0,10);

  var html = '';

  // --- Formulário de adicionar (só admin) ---
  if (isAdm) {
    html += '<div class="card" style="margin-bottom:1rem">' +
      '<div style="font-weight:700;font-size:0.9rem;margin-bottom:0.9rem">+ Nova Tarefa</div>' +

      // Tipo de prazo: data especifica ou fixa (todo dia)
      '<div style="display:flex;gap:6px;margin-bottom:10px">' +
        '<button type="button" id="tk-prazo-data" onclick="tarefaSetPrazo(\'data\')" ' +
          'style="flex:1;padding:8px;border:2px solid var(--green);border-radius:8px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;font-size:0.83rem">📅 Data especifica</button>' +
        '<button type="button" id="tk-prazo-fixa" onclick="tarefaSetPrazo(\'fixa\')" ' +
          'style="flex:1;padding:8px;border:2px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text2);font-weight:600;cursor:pointer;font-size:0.83rem">📌 Tarefa fixa (todo dia)</button>' +
      '</div>' +

      '<input type="text" id="task-text" placeholder="Descrição da tarefa..." style="width:100%;padding:0.6rem 0.9rem;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:0.9rem;margin-bottom:10px">' +

      '<div id="tk-campo-data" style="display:grid;grid-template-columns:1fr 130px;gap:8px;margin-bottom:10px">' +
        '<input type="date" id="task-date" value="' + todayStr + '" style="padding:0.6rem 0.7rem;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:0.9rem">' +
        '<div style="display:flex;flex-direction:column;gap:3px">' +
          '<input type="time" id="task-time" value="08:00" style="padding:0.6rem 0.5rem;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:0.9rem">' +
          '<label style="display:flex;align-items:center;gap:4px;font-size:0.7rem;color:var(--text3);cursor:pointer">' +
            '<input type="checkbox" id="task-no-time" onchange="toggleTaskTime()" style="width:auto;margin:0"> Sem horário' +
          '</label>' +
        '</div>' +
      '</div>' +

      '<div id="tk-aviso-fixa" style="display:none;padding:10px 12px;background:var(--bg3);border-radius:8px;font-size:0.8rem;color:var(--text2);margin-bottom:10px">' +
        '📌 Aparece todo dia na TV e na lista, sem data de vencimento. Ideal para rotinas do dia a dia.' +
      '</div>' +

      // Atribuição: setor ou pessoa
      '<div style="margin-bottom:10px">' +
        '<label style="font-size:0.78rem;color:var(--text2);display:block;margin-bottom:5px;font-weight:600">Atribuir a</label>' +
        '<div style="display:flex;gap:6px;margin-bottom:8px">' +
          '<button type="button" id="tk-tipo-setor" onclick="tarefaSetTipo(\'setor\')" ' +
            'style="flex:1;padding:8px;border:2px solid var(--green);border-radius:8px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;font-size:0.83rem">🏢 Setor inteiro</button>' +
          '<button type="button" id="tk-tipo-pessoa" onclick="tarefaSetTipo(\'pessoa\')" ' +
            'style="flex:1;padding:8px;border:2px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text2);font-weight:600;cursor:pointer;font-size:0.83rem">👤 Colaborador</button>' +
        '</div>' +

        // Select de setor
        '<div id="tk-campo-setor">' +
          '<select id="task-setor" style="width:100%;padding:0.6rem 0.9rem;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:0.9rem">' +
            SETORES.map(function(s){ return '<option value="' + s.id + '">' + s.icon + ' ' + s.label + '</option>'; }).join('') +
          '</select>' +
        '</div>' +

        // Select de colaborador
        '<div id="tk-campo-pessoa" style="display:none">' +
          (cols.length ?
            '<select id="task-colab" style="width:100%;padding:0.6rem 0.9rem;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:0.9rem">' +
              cols.map(function(c,i){
                var st = setorDoColab(c);
                return '<option value="' + i + '">' + esc(c.nome) + (st ? ' — ' + setorLabel(st) : ' — sem setor') + '</option>';
              }).join('') +
            '</select>'
          : '<div style="padding:10px 12px;background:var(--bg3);border-radius:8px;font-size:0.8rem;color:var(--text3)">Nenhum colaborador cadastrado. Cadastre em Ponto Virtual → Colaboradores.</div>') +
        '</div>' +
      '</div>' +

      '<button class="btn btn-green" onclick="addTarefa()" style="width:100%;padding:0.7rem">+ Adicionar Tarefa</button>' +
    '</div>';
  }

  // --- Filtros ---
  if (!setorFixo) {
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem">' +
      '<button onclick="tarefaSetFiltro(\'todos\')" style="padding:5px 14px;border:1px solid ' + (_tarefaFiltro==='todos'?'var(--green)':'var(--border)') + ';border-radius:20px;background:' + (_tarefaFiltro==='todos'?'var(--green)':'transparent') + ';color:' + (_tarefaFiltro==='todos'?'#fff':'var(--text2)') + ';cursor:pointer;font-size:0.8rem;font-weight:' + (_tarefaFiltro==='todos'?'700':'400') + '">Todas</button>' +
      SETORES.map(function(s) {
        var ativo = _tarefaFiltro === s.id;
        return '<button onclick="tarefaSetFiltro(\'' + s.id + '\')" style="padding:5px 14px;border:1px solid ' + (ativo?s.cor:'var(--border)') + ';border-radius:20px;background:' + (ativo?s.cor:'transparent') + ';color:' + (ativo?'#fff':'var(--text2)') + ';cursor:pointer;font-size:0.8rem;font-weight:' + (ativo?'700':'400') + '">' + s.icon + ' ' + s.label + '</button>';
      }).join('') +
      cols.map(function(c, i) {
        var ativo = _tarefaFiltro === 'p:' + i;
        return '<button onclick="tarefaSetFiltro(\'p:' + i + '\')" style="padding:5px 14px;border:1px solid ' + (ativo?'#7c3aed':'var(--border)') + ';border-radius:20px;background:' + (ativo?'#7c3aed':'transparent') + ';color:' + (ativo?'#fff':'var(--text2)') + ';cursor:pointer;font-size:0.8rem;font-weight:' + (ativo?'700':'400') + '">👤 ' + esc(c.nome.split(' ')[0]) + '</button>';
      }).join('') +
    '</div>';
  }

  // --- Lista de tarefas ---
  var lista = tarefasTodas();

  // Aplica filtro
  if (_tarefaFiltro !== 'todos') {
    if (_tarefaFiltro.indexOf('p:') === 0) {
      var pIdx = parseInt(_tarefaFiltro.slice(2));
      lista = lista.filter(function(t){ return t.colabIdx === pIdx; });
    } else {
      lista = lista.filter(function(t){ return t._setor === _tarefaFiltro; });
    }
  }

  // Ordena: fixas no topo, depois pendentes por data, concluidas no fim
  lista.sort(function(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (!!a.fixa !== !!b.fixa) return a.fixa ? -1 : 1;
    if (a.fixa && b.fixa) return 0;
    return (a.date + (a.time||'')).localeCompare(b.date + (b.time||''));
  });

  html += '<div class="card">';

  if (!lista.length) {
    html += '<div class="empty-state">' + iconEmpty() + '<p>Nenhuma tarefa cadastrada</p></div>';
  } else {
    html += '<div class="task-list">';
    lista.forEach(function(t) {
      var badge = '', dateStr;

      if (t.fixa) {
        dateStr = 'Todo dia';
        badge = '<span class="task-badge" style="background:#d97706;color:#fff;border:none">📌 Fixa</span>';
      } else {
        var isLate     = !t.done && t.date < todayStr;
        var isToday    = !t.done && t.date === todayStr;
        var isTomorrow = !t.done && t.date === tomorrowStr;
        dateStr = new Date(t.date + 'T12:00:00').toLocaleDateString('pt-BR') + (t.time ? ' ' + t.time : ' · Sem horário');
        if (isLate)          badge = '<span class="task-badge">⚠ Atraso</span>';
        else if (isToday)    badge = '<span class="task-badge" style="background:var(--green);color:#fff;border:none">Hoje</span>';
        else if (isTomorrow) badge = '<span class="task-badge" style="background:#1a8a4a;color:#fff;border:none">Amanhã</span>';
      }

      // Badge de destino
      var destBadge;
      if (t.colabIdx !== undefined && t.colabIdx !== null && cols[t.colabIdx]) {
        destBadge = '<span style="padding:2px 9px;border-radius:12px;font-size:0.7rem;font-weight:700;background:#7c3aed18;color:#7c3aed;white-space:nowrap">👤 ' + esc(cols[t.colabIdx].nome.split(' ')[0]) + '</span>';
      } else {
        var sc = setorCor(t._setor);
        destBadge = '<span style="padding:2px 9px;border-radius:12px;font-size:0.7rem;font-weight:700;background:' + sc + '18;color:' + sc + ';white-space:nowrap">' + setorIcon(t._setor) + ' ' + setorLabel(t._setor) + '</span>';
      }

      var marcador = t.fixa
        ? '<div title="Tarefa fixa: nao pode ser concluida" style="width:20px;height:20px;border-radius:5px;background:#d9770618;color:#d97706;display:flex;align-items:center;justify-content:center;font-size:0.8rem;flex-shrink:0;cursor:default">📌</div>'
        : '<div class="task-check ' + (t.done?'checked':'') + '" onclick="toggleTarefa(\'' + t._setor + '\',' + t._idx + ')"></div>';

      html += '<div class="task-item ' + (t.done?'done':'') + '">' +
        marcador +
        '<div class="task-text">' + esc(t.text) + '</div>' +
        destBadge +
        '<span class="task-meta">' + dateStr + '</span>' +
        badge +
        (isAdm ? '<button class="task-delete" onclick="deleteTarefa(\'' + t._setor + '\',' + t._idx + ')" title="Excluir">x</button>' : '') +
      '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  return html;
}

var _tarefaTipo  = 'setor'; // 'setor' | 'pessoa'
var _tarefaPrazo = 'data';  // 'data'  | 'fixa'

function tarefaSetPrazo(p) {
  _tarefaPrazo = p;
  var cd = document.getElementById('tk-campo-data');
  var av = document.getElementById('tk-aviso-fixa');
  var bd = document.getElementById('tk-prazo-data');
  var bf = document.getElementById('tk-prazo-fixa');
  if (!cd) return;
  var ehData = p === 'data';
  cd.style.display = ehData ? 'grid' : 'none';
  if (av) av.style.display = ehData ? 'none' : 'block';
  if (bd) { bd.style.background = ehData?'var(--green)':'var(--bg2)'; bd.style.color = ehData?'#fff':'var(--text2)'; bd.style.borderColor = ehData?'var(--green)':'var(--border)'; bd.style.fontWeight = ehData?'700':'600'; }
  if (bf) { bf.style.background = !ehData?'#d97706':'var(--bg2)'; bf.style.color = !ehData?'#fff':'var(--text2)'; bf.style.borderColor = !ehData?'#d97706':'var(--border)'; bf.style.fontWeight = !ehData?'700':'600'; }
}

function tarefaSetTipo(tipo) {
  _tarefaTipo = tipo;
  var cs = document.getElementById('tk-campo-setor');
  var cp = document.getElementById('tk-campo-pessoa');
  var bs = document.getElementById('tk-tipo-setor');
  var bp = document.getElementById('tk-tipo-pessoa');
  if (!cs || !cp) return;
  var ehSetor = tipo === 'setor';
  cs.style.display = ehSetor ? 'block' : 'none';
  cp.style.display = ehSetor ? 'none'  : 'block';
  if (bs) { bs.style.background = ehSetor?'var(--green)':'var(--bg2)'; bs.style.color = ehSetor?'#fff':'var(--text2)'; bs.style.borderColor = ehSetor?'var(--green)':'var(--border)'; bs.style.fontWeight = ehSetor?'700':'600'; }
  if (bp) { bp.style.background = !ehSetor?'#7c3aed':'var(--bg2)'; bp.style.color = !ehSetor?'#fff':'var(--text2)'; bp.style.borderColor = !ehSetor?'#7c3aed':'var(--border)'; bp.style.fontWeight = !ehSetor?'700':'600'; }
}

function tarefaSetFiltro(f) {
  _tarefaFiltro = f;
  var el = document.getElementById('page-content');
  if (el) el.innerHTML = renderTarefas();
  setTimeout(tarefaRestaurarBotoes, 30);
}

function tarefaRestaurarBotoes() {
  tarefaSetTipo(_tarefaTipo);
  tarefaSetPrazo(_tarefaPrazo);
}

function toggleTaskTime() {
  var noTime = document.getElementById('task-no-time').checked;
  var tEl = document.getElementById('task-time');
  tEl.disabled = noTime;
  tEl.style.opacity = noTime ? '0.4' : '1';
}

function addTarefa() {
  var text = ((document.getElementById('task-text')||{}).value || '').trim();
  if (!text) { alert('Preencha a descrição da tarefa.'); return; }

  var fixa = _tarefaPrazo === 'fixa';
  var date = '', time = '';
  if (!fixa) {
    date = (document.getElementById('task-date')||{}).value || '';
    var noTime = (document.getElementById('task-no-time')||{}).checked;
    time = noTime ? '' : ((document.getElementById('task-time')||{}).value || '');
    if (!date) { alert('Informe a data da tarefa.'); return; }
  }

  var cols = (state.ponto && state.ponto.colaboradores) || [];
  var setor, colabIdx = null;

  if (_tarefaTipo === 'pessoa') {
    var selC = document.getElementById('task-colab');
    if (!selC) { alert('Cadastre um colaborador primeiro em Ponto Virtual.'); return; }
    colabIdx = parseInt(selC.value);
    var colab = cols[colabIdx];
    setor = setorDoColab(colab) || 'expedicao';
  } else {
    setor = (document.getElementById('task-setor')||{}).value || 'expedicao';
  }

  if (!state.tasks) state.tasks = {};
  if (!Array.isArray(state.tasks[setor])) state.tasks[setor] = [];

  state.tasks[setor].push({
    text: text, date: date, time: time, done: false, id: Date.now(),
    fixa: fixa,
    colabIdx: colabIdx,
    colabNome: colabIdx !== null && cols[colabIdx] ? cols[colabIdx].nome : null,
  });

  saveState();
  addLog('Adicionou tarefa' + (fixa?' fixa':'') + ' (' + (colabIdx !== null ? cols[colabIdx].nome : setorLabel(setor)) + '): "' + text + '"');

  var tx = document.getElementById('task-text');
  if (tx) tx.value = '';

  var el = document.getElementById('page-content');
  if (el) el.innerHTML = renderTarefas();
  setTimeout(function(){ tarefaRestaurarBotoes(); var t2 = document.getElementById('task-text'); if(t2) t2.focus(); }, 30);
}

function toggleTarefa(setor, i) {
  if (!state.tasks[setor] || !state.tasks[setor][i]) return;
  if (state.tasks[setor][i].fixa) return; // tarefa fixa nao se conclui
  state.tasks[setor][i].done = !state.tasks[setor][i].done;
  var t = state.tasks[setor][i];
  addLog('Marcou tarefa como ' + (t.done?'concluída':'pendente') + ': "' + t.text + '"');
  saveState();
  var el = document.getElementById('page-content');
  if (el) el.innerHTML = renderTarefas();
  setTimeout(tarefaRestaurarBotoes, 30);
}

function deleteTarefa(setor, i) {
  if (!state.tasks[setor] || !state.tasks[setor][i]) return;
  var t = state.tasks[setor][i];
  state.tasks[setor].splice(i, 1);
  addLog('Excluiu tarefa: "' + t.text + '"');
  saveState();
  var el = document.getElementById('page-content');
  if (el) el.innerHTML = renderTarefas();
  setTimeout(tarefaRestaurarBotoes, 30);
}

// --- TV: painel da operacao ----------------------------------------------------
var _tvAba      = 'painel';   // 'painel' | 'dados'
var _tvRelogio  = null;
var _tvCarTimer = null;
var _tvCarIdx   = 0;
var _tvMuralIdx = 0;
var _tvMuralTimer = null;
var _tvChart    = null;
var TV_CAR_SEG  = 6;
var TV_MURAL_SEG = 10;

// ---------- helpers de dados ----------

var MES_NOMES = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

// Garante a estrutura e migra o formato antigo (periodos) se existir
function tvDados() {
  if (!state.tv) state.tv = {};
  if (!state.tv.meses) state.tv.meses = {};
  // Migracao: pega o periodo mais recente do formato antigo como semana
  if (!state.tv.semana && state.tv.periodos) {
    var ks = Object.keys(state.tv.periodos).sort();
    if (ks.length) state.tv.semana = state.tv.periodos[ks[ks.length - 1]];
    delete state.tv.periodos;
  }
  return state.tv;
}

function tvSemana() { return tvDados().semana || null; }

function tvFmtData(iso) {
  if (!iso) return '';
  var p = String(iso).split('-');
  return p.length >= 3 ? p[2] + '/' + p[1] : iso;
}

function tvMesLabel(chave) {
  var p = String(chave).split('-');
  return MES_NOMES[parseInt(p[1],10) - 1] + ' ' + p[0];
}

// Grafico de barras: pedidos por mes, a partir das planilhas mensais
function tvPedidosPorMes() {
  var m = tvDados().meses || {};
  var chaves = Object.keys(m).sort().slice(-8);
  return {
    labels:  chaves.map(function(k){ return MES_CURTO[parseInt(k.slice(5,7),10) - 1]; }),
    valores: chaves.map(function(k){ return m[k].pedidos || 0; }),
  };
}

// ---------- leitura da planilha ----------

function tvPeriodoDoNome(nome) {
  var m = String(nome).match(/(\d{8})-(\d{8})/);
  if (!m) return null;
  function iso(s){ return s.slice(0,4) + '-' + s.slice(4,6) + '-' + s.slice(6,8); }
  return { inicio: iso(m[1]), fim: iso(m[2]) };
}

function tvPlataforma(loja) {
  var s = String(loja || '').toLowerCase();
  if (s.indexOf('shopee')  !== -1) return 'Shopee';
  if (s.indexOf('mercado') !== -1) return 'Mercado Livre';
  if (s.indexOf('tiktok')  !== -1) return 'TikTok';
  return 'Outros';
}

// Le o arquivo e devolve o resumo agrupado por SKU
function tvLerPlanilha(arq, ok, erro) {
  if (typeof XLSX === 'undefined') { erro('Biblioteca de planilha nao carregou. Recarregue a pagina.'); return; }
  var fr = new FileReader();
  fr.onerror = function(){ erro('Falha ao ler o arquivo.'); };
  fr.onload = function(e) {
    try {
      var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      var linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      if (!linhas.length) { erro('A planilha esta vazia.'); return; }

      var col = Object.keys(linhas[0]);
      function achar(alvo){ return col.find(function(c){ return c.trim().toLowerCase() === alvo; }); }
      var cSku  = achar('sku');
      var cUni  = achar('unidades vendidas');
      var cProd = achar('produtos');
      var cPed  = achar('pedidos válidos') || achar('pedidos validos');
      var cLoja = achar('loja');
      var cVal  = achar('valor de vendas');

      if (!cSku || !cUni) {
        erro('A planilha precisa ter as colunas "SKU" e "Unidades Vendidas". Encontrei: ' + col.join(', '));
        return;
      }

      var mapa = {}, totalPed = 0, totalUni = 0, totalVal = 0, plats = {};
      linhas.forEach(function(r) {
        var sku = String(r[cSku] || '').trim();
        if (!sku) return;
        var uni = parseFloat(r[cUni]) || 0;
        var ped = cPed ? (parseFloat(r[cPed]) || 0) : 0;
        var val = cVal ? (parseFloat(r[cVal]) || 0) : 0;
        if (!mapa[sku]) mapa[sku] = { sku: sku, nome: String(cProd ? r[cProd] : sku) || sku, unidades: 0, pedidos: 0 };
        mapa[sku].unidades += uni;
        mapa[sku].pedidos  += ped;
        totalUni += uni; totalPed += ped; totalVal += val;
        if (cLoja) { var p = tvPlataforma(r[cLoja]); plats[p] = (plats[p] || 0) + ped; }
      });

      var skus = Object.keys(mapa).map(function(k){ return mapa[k]; })
        .sort(function(a,b){ return b.unidades - a.unidades; })
        .slice(0, 20)
        .map(function(s){ return { sku:s.sku, nome:s.nome, unidades:Math.round(s.unidades), pedidos:Math.round(s.pedidos) }; });

      ok({
        pedidos:  Math.round(totalPed),
        unidades: Math.round(totalUni),
        valor:    Math.round(totalVal * 100) / 100,
        plataformas: plats,
        skus: skus,
        totalSkus: Object.keys(mapa).length,
        arquivo: arq.name,
        importadoEm: Date.now(),
      });
    } catch (err) { erro('Erro ao processar: ' + err.message); }
  };
  fr.readAsArrayBuffer(arq);
}

// ---------- import: semana (sempre substitui) ----------

function tvImportarSemana(input) {
  var arq = input && input.files && input.files[0];
  if (!arq) return;
  var st = document.getElementById('tv-st-semana');
  function msg(t,c){ if(st){ st.textContent=t; st.style.color=c||'var(--text2)'; } }

  msg('Lendo planilha...');
  tvLerPlanilha(arq, function(res) {
    var per = tvPeriodoDoNome(arq.name) || { inicio:'', fim:'' };
    var d = tvDados();
    d.semana = Object.assign({}, res, { inicio: per.inicio, fim: per.fim });
    saveState();
    addLog('Atualizou vendas da semana na TV (' + res.totalSkus + ' SKUs, ' + res.pedidos + ' pedidos)');
    msg('Semana atualizada: ' + res.pedidos + ' pedidos, ' + res.unidades + ' unidades, ' + res.totalSkus + ' SKUs.', 'var(--green)');
    input.value = '';
    setTimeout(function(){ tvSetAba('dados'); }, 900);
  }, function(e){ msg(e, 'var(--red)'); });
}

function tvLimparSemana() {
  if (!confirm('Remover os dados da semana? O ranking da TV fica vazio ate voce subir outra planilha.')) return;
  var d = tvDados();
  delete d.semana;
  addLog('Removeu os dados da semana na TV');
  saveState();
  tvSetAba('dados');
}

// ---------- import: mes (escolhe o mes) ----------

function tvImportarMes(input) {
  var arq = input && input.files && input.files[0];
  if (!arq) return;
  var st  = document.getElementById('tv-st-mes');
  var sel = document.getElementById('tv-mes-sel');
  function msg(t,c){ if(st){ st.textContent=t; st.style.color=c||'var(--text2)'; } }

  var chave = sel ? sel.value : '';
  if (!chave) { msg('Selecione o mes antes de escolher o arquivo.', 'var(--red)'); input.value=''; return; }

  msg('Lendo planilha...');
  tvLerPlanilha(arq, function(res) {
    var d = tvDados();
    d.meses[chave] = Object.assign({}, res, { mes: chave });
    // Mantem no maximo 12 meses
    var ks = Object.keys(d.meses).sort();
    while (ks.length > 12) { delete d.meses[ks.shift()]; }
    saveState();
    addLog('Importou vendas de ' + tvMesLabel(chave) + ' na TV (' + res.pedidos + ' pedidos)');
    msg(tvMesLabel(chave) + ': ' + res.pedidos + ' pedidos, ' + res.unidades + ' unidades.', 'var(--green)');
    input.value = '';
    setTimeout(function(){ tvSetAba('dados'); }, 900);
  }, function(e){ msg(e, 'var(--red)'); });
}

function tvExcluirMes(chave) {
  var d = tvDados();
  if (!d.meses[chave]) return;
  if (!confirm('Excluir os dados de ' + tvMesLabel(chave) + '?')) return;
  delete d.meses[chave];
  addLog('Excluiu vendas de ' + tvMesLabel(chave) + ' na TV');
  saveState();
  tvSetAba('dados');
}

// ---------- render: aba de dados ----------

function tvRenderDados() {
  var d   = tvDados();
  var sem = d.semana;
  var meses = d.meses || {};

  // Select dos ultimos 18 meses
  var hoje = new Date(), opts = '';
  for (var i = 0; i < 18; i++) {
    var dt = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
    var k  = dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0');
    opts += '<option value="' + k + '">' + tvMesLabel(k) + (meses[k] ? '  (ja importado)' : '') + '</option>';
  }

  var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">';

  // --- Caixa da semana ---
  html += '<div class="card">' +
    '<div style="font-weight:700;font-size:0.95rem;margin-bottom:0.4rem">Vendas da semana</div>' +
    '<div style="font-size:0.82rem;color:var(--text2);line-height:1.55;margin-bottom:0.9rem">' +
      'Alimenta o ranking <strong>Mais vendidos</strong> da TV. Cada arquivo novo substitui o anterior.' +
    '</div>';

  if (sem) {
    html += '<div style="background:var(--bg3);border-radius:10px;padding:0.8rem 1rem;margin-bottom:0.9rem;border-left:4px solid var(--green)">' +
      '<div style="font-weight:700;font-size:0.9rem">' +
        (sem.inicio ? tvFmtData(sem.inicio) + ' a ' + tvFmtData(sem.fim) : 'Periodo nao identificado') +
      '</div>' +
      '<div style="font-size:0.8rem;color:var(--text2);margin-top:0.25rem">' +
        (sem.pedidos||0).toLocaleString('pt-BR') + ' pedidos &middot; ' +
        (sem.unidades||0).toLocaleString('pt-BR') + ' unidades &middot; ' +
        (sem.totalSkus || (sem.skus||[]).length) + ' SKUs' +
      '</div>' +
      ((sem.skus && sem.skus[0]) ? '<div style="font-size:0.78rem;color:var(--text3);margin-top:0.25rem">Top 1: ' +
        esc(sem.skus[0].sku) + ' com ' + sem.skus[0].unidades + ' un</div>' : '') +
    '</div>';
  } else {
    html += '<div style="background:var(--bg3);border-radius:10px;padding:0.8rem 1rem;margin-bottom:0.9rem;font-size:0.83rem;color:var(--text3)">Nenhuma planilha da semana carregada</div>';
  }

  html += '<input type="file" accept=".xlsx,.xls" onchange="tvImportarSemana(this)" ' +
      'style="font-size:0.83rem;color:var(--text2);cursor:pointer;padding:0.65rem;border:2px dashed var(--border);border-radius:10px;width:100%;background:var(--bg3)">' +
    '<div id="tv-st-semana" style="font-size:0.83rem;margin-top:0.6rem;min-height:1.2em"></div>' +
    (sem ? '<button class="btn btn-sm btn-red" style="margin-top:0.5rem" onclick="tvLimparSemana()">Remover semana</button>' : '') +
  '</div>';

  // --- Caixa do mes ---
  html += '<div class="card">' +
    '<div style="font-weight:700;font-size:0.95rem;margin-bottom:0.4rem">Vendas do mes</div>' +
    '<div style="font-size:0.82rem;color:var(--text2);line-height:1.55;margin-bottom:0.9rem">' +
      'Alimenta o grafico <strong>Pedidos por mes</strong>. Escolha o mes e depois o arquivo.' +
    '</div>' +
    '<label style="font-size:0.78rem;color:var(--text2);font-weight:600;display:block;margin-bottom:0.3rem">Mes de referencia</label>' +
    '<select id="tv-mes-sel" style="width:100%;padding:0.6rem 0.9rem;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:0.88rem;margin-bottom:0.8rem">' + opts + '</select>' +
    '<input type="file" accept=".xlsx,.xls" onchange="tvImportarMes(this)" ' +
      'style="font-size:0.83rem;color:var(--text2);cursor:pointer;padding:0.65rem;border:2px dashed var(--border);border-radius:10px;width:100%;background:var(--bg3)">' +
    '<div id="tv-st-mes" style="font-size:0.83rem;margin-top:0.6rem;min-height:1.2em"></div>' +
  '</div>';

  html += '</div>';

  // --- Tabela dos meses ---
  var chaves = Object.keys(meses).sort().reverse();
  if (!chaves.length) {
    html += '<div class="empty-state">' + iconEmpty() + '<p>Nenhum mes importado ainda</p></div>';
    return html;
  }

  html += '<div class="card">' +
    '<div style="font-weight:700;font-size:0.95rem;margin-bottom:0.9rem">Meses no grafico (' + chaves.length + ')</div>' +
    '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:0.85rem">' +
    '<thead><tr style="background:var(--bg3)">' +
      '<th style="text-align:left;padding:9px 12px">Mes</th>' +
      '<th style="text-align:center;padding:9px 12px">Pedidos</th>' +
      '<th style="text-align:center;padding:9px 12px">Unidades</th>' +
      '<th style="text-align:left;padding:9px 12px">Top 1</th>' +
      '<th style="padding:9px 12px"></th>' +
    '</tr></thead><tbody>';

  chaves.forEach(function(k) {
    var m = meses[k];
    var top = (m.skus && m.skus[0]) ? m.skus[0] : null;
    html += '<tr style="border-bottom:1px solid var(--border)">' +
      '<td style="padding:8px 12px;font-weight:600">' + tvMesLabel(k) + '</td>' +
      '<td style="padding:8px 12px;text-align:center;font-weight:700">' + (m.pedidos||0).toLocaleString('pt-BR') + '</td>' +
      '<td style="padding:8px 12px;text-align:center">' + (m.unidades||0).toLocaleString('pt-BR') + '</td>' +
      '<td style="padding:8px 12px;font-size:0.8rem;color:var(--text2)">' + (top ? esc(top.sku) + ' (' + top.unidades + ' un)' : '--') + '</td>' +
      '<td style="padding:8px 12px;text-align:right"><button class="btn btn-sm btn-red" onclick="tvExcluirMes(\'' + k + '\')">x</button></td>' +
    '</tr>';
  });

  html += '</tbody></table></div></div>';
  return html;
}

// ---------- render: painel ----------

function tvCarrosselPares() {
  var cols = (state.ponto && state.ponto.colaboradores) || [];
  var hojeStr = new Date().toISOString().slice(0,10);

  var todas = [];
  SETORES.forEach(function(s) {
    ((state.tasks && state.tasks[s.id]) || []).forEach(function(t) {
      if (t.done) return;
      todas.push(Object.assign({}, t, { _setor: s.id }));
    });
  });

  var pessoas = cols.map(function(c, i) {
    var setor = setorDoColab(c);
    var minhas = todas.filter(function(t){ return t.colabIdx === i; });
    var doSetor = todas.filter(function(t) {
      var semDono = t.colabIdx === undefined || t.colabIdx === null;
      return semDono && setor && normalizarSetor(t._setor) === setor;
    });
    var juntas = minhas.concat(doSetor)
      .filter(function(t){ return t.fixa || t.date <= hojeStr; })
      .sort(function(a,b){ return (a.fixa?0:1) - (b.fixa?0:1); });
    return { nome: c.nome, idx: i, setor: setor, tarefas: juntas };
  });

  var pares = [];
  for (var i = 0; i < pessoas.length; i += 2) pares.push(pessoas.slice(i, i + 2));
  return pares;
}

function tvCardPessoa(p) {
  var CORES = ['#ffb35c','#f5f5f5','#ff8a1e','#c8c8c8','#ffd9a8','#e0e0e0'];
  var cor = CORES[p.idx % 6];
  var ini = (p.nome || '?').split(' ').map(function(x){ return x[0]; }).slice(0,2).join('').toUpperCase();
  var setorTxt = p.setor === 'expedicao' ? 'Expedicao' : (p.setor === 'producao' ? 'Producao' : '');

  var itens = p.tarefas.length
    ? p.tarefas.slice(0, 5).map(function(t) {
        return '<div class="tv-task"><span class="tv-box' + (t.fixa ? ' fix' : '') + '"></span>' + esc(t.text) + '</div>';
      }).join('')
    : '<div class="tv-task" style="opacity:0.55;font-style:italic">Sem tarefas para hoje</div>';

  return '<div class="tv-card show">' +
    '<div class="tv-person">' +
      '<div class="tv-avatar" style="background:' + cor + '">' + ini + '</div>' +
      '<div><div class="tv-name">' + esc(p.nome) + '</div>' +
      (setorTxt ? '<div class="tv-role">' + setorTxt + '</div>' : '') + '</div>' +
    '</div>' + itens +
  '</div>';
}

function tvRenderCarrossel() {
  var slot = document.getElementById('tvCarSlot');
  var dots = document.getElementById('tvCarDots');
  if (!slot) return;
  var pares = tvCarrosselPares();
  if (!pares.length) {
    slot.innerHTML = '<div style="opacity:0.6;font-size:15px">Nenhum colaborador cadastrado</div>';
    if (dots) dots.innerHTML = '';
    return;
  }
  if (_tvCarIdx >= pares.length) _tvCarIdx = 0;
  slot.innerHTML = pares[_tvCarIdx].map(tvCardPessoa).join('');
  if (dots) {
    dots.innerHTML = pares.map(function(_, i) {
      return '<span class="' + (i === _tvCarIdx ? 'active' : '') + '"></span>';
    }).join('');
  }
}

function tvRenderRanking() {
  var box = document.getElementById('tvRank');
  if (!box) return;
  var per = tvSemana();
  var skus = (per && per.skus) || [];
  if (!skus.length) {
    box.innerHTML = '<div style="grid-column:1/-1;opacity:0.6;font-size:14px">Importe uma planilha na aba Dados para ver o ranking</div>';
    return;
  }
  var max = skus[0].unidades || 1;
  function coluna(itens) {
    return '<div>' + itens.map(function(s) {
      var pct = Math.max(6, Math.round((s.unidades / max) * 100));
      return '<div class="tv-rank-item">' +
        '<div class="tv-rank-row"><span>' + esc(s.nome || s.sku) + '</span><span>' + s.unidades + ' un</span></div>' +
        '<div class="tv-rank-track"><div class="tv-rank-fill" style="width:' + pct + '%"></div></div>' +
      '</div>';
    }).join('') + '</div>';
  }
  box.innerHTML = coluna(skus.slice(0,10)) + coluna(skus.slice(10,20));
}

function tvRenderGrafico() {
  var cv = document.getElementById('tvChart');
  if (!cv || typeof Chart === 'undefined') return;
  var d = tvPedidosPorMes();
  if (_tvChart) { _tvChart.destroy(); _tvChart = null; }
  if (!d.labels.length) return;
  _tvChart = new Chart(cv, {
    type: 'bar',
    data: { labels: d.labels, datasets: [{
      data: d.valores,
      backgroundColor: 'rgba(255,255,255,0.75)',
      borderRadius: 6, maxBarThickness: 26,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 600 },
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.15)' }, ticks: { color: 'rgba(255,255,255,0.85)' } },
        x: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,0.85)' } },
      },
    },
  });
}

function tvMuralPaginas() {
  var avisos = (state.mural || []);
  var pgs = [];
  for (var i = 0; i < avisos.length; i += 4) pgs.push(avisos.slice(i, i + 4));
  return pgs;
}

function tvRenderMural() {
  var box  = document.getElementById('tvMural');
  var dots = document.getElementById('tvMuralDots');
  if (!box) return;

  var pgs = tvMuralPaginas();
  if (!pgs.length) {
    box.innerHTML = '<div style="opacity:0.6;font-size:1.5vh">Nenhum aviso no mural</div>';
    if (dots) dots.innerHTML = '';
    return;
  }
  if (_tvMuralIdx >= pgs.length) _tvMuralIdx = 0;

  var classes = ['tv-note-amber','tv-note-pink','tv-note-teal','tv-note-purple'];
  box.innerHTML = pgs[_tvMuralIdx].map(function(a, i) {
    return '<div class="tv-note ' + classes[i % 4] + '">' +
      '<div class="tv-note-date">' + esc(a.author || 'Aviso') + (a.time ? ' &middot; ' + esc(a.time) : '') + '</div>' +
      '<div class="tv-note-text">' + esc(a.text) + '</div>' +
    '</div>';
  }).join('');

  if (dots) {
    dots.innerHTML = pgs.length > 1
      ? pgs.map(function(_, i){ return '<span class="' + (i === _tvMuralIdx ? 'active' : '') + '"></span>'; }).join('')
      : '';
  }
}

// ---------- ciclo de vida ----------

function tvIniciar() {
  tvParar();
  if (_tvAba !== 'painel') return;
  tvRenderGrafico();
  tvRenderRanking();
  _tvCarIdx = 0;
  tvRenderCarrossel();
  _tvMuralIdx = 0;
  tvRenderMural();

  _tvMuralTimer = setInterval(function() {
    var box = document.getElementById('tvMural');

      _tvMuralIdx = (_tvMuralIdx + 1) % pgs.length;
      tvRenderMural();
    }
  }, TV_MURAL_SEG * 1000);

  _tvCarTimer = setInterval(function() {
    var slot = document.getElementById('tvCarSlot');
    if (!slot) { tvParar(); return; }
    Array.prototype.forEach.call(slot.querySelectorAll('.tv-card'), function(c){ c.classList.remove('show'); });

      var pares = tvCarrosselPares();
      _tvCarIdx = pares.length ? (_tvCarIdx + 1) % pares.length : 0;
      if (_tvCarIdx === 0) tvRenderRanking();
      tvRenderCarrossel();
    }, 350);
  }, TV_CAR_SEG * 1000);

  _tvRelogio = setInterval(function() {
    var c = document.getElementById('tvClock');
    if (!c) { tvParar(); return; }
    var n = new Date();
    c.textContent = n.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' }) +
      ' — ' + String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  }, 1000);
}
