<!DOCTYPE html>
<html>
<head><title>Capturando token Shopee...</title></head>
<body style="font-family:monospace;padding:20px">
<h2 id="status">⏳ Capturando...</h2>
<div id="code-box" style="background:#f0f0f0;padding:15px;margin:10px 0;border-radius:8px;display:none">
  <b>code:</b> <span id="show-code"></span><br>
  <b>shop_id:</b> <span id="show-shop"></span>
</div>
<pre id="resultado" style="background:#f9f9f9;padding:15px;border-radius:8px"></pre>
<script>
const PROXY = 'https://shopee-proxy.costanaturelife.workers.dev';

(async function() {
  const params  = new URLSearchParams(window.location.search);
  const code    = params.get('code');
  const shop_id = params.get('shop_id');
  const el      = document.getElementById('resultado');
  const st      = document.getElementById('status');
  const codeBox = document.getElementById('code-box');

  if (!code || !shop_id) {
    st.textContent = '❌ Nenhum code na URL: ' + window.location.href;
    return;
  }

  // Mostra o code imediatamente
  codeBox.style.display = 'block';
  document.getElementById('show-code').textContent  = code;
  document.getElementById('show-shop').textContent  = shop_id;
  st.textContent = '🔄 Trocando code por access_token...';

  // Tenta até 3 vezes com delay crescente
  for (let i = 0; i < 3; i++) {
    try {
      const url = `${PROXY}/?action=get_token&code=${encodeURIComponent(code)}&shop_id=${encodeURIComponent(shop_id)}`;
      el.textContent = 'Tentativa ' + (i+1) + '...\nURL: ' + url;
      const resp = await fetch(url);
      const data = await resp.json();
      el.textContent = JSON.stringify(data, null, 2);
      if (data.access_token) {
        st.textContent = '✅ SUCESSO! Copie os tokens abaixo e me mande no chat:';
        st.style.color = 'green';
        return;
      }
      // Aguarda 500ms antes de tentar novamente
      await new Promise(r => setTimeout(r, 500));
    } catch(e) {
      el.textContent = 'Erro tentativa ' + (i+1) + ': ' + e.message;
      await new Promise(r => setTimeout(r, 500));
    }
  }
  st.textContent = '❌ Falhou após 3 tentativas. Veja o resultado abaixo.';
  st.style.color = 'red';
})();
</script>
</body>
</html>
