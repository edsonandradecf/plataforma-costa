function renderEstoqueHistorico() {
  // Entradas reais com custo + registros manuais
  var movs = (state.estoque.movimentacoes || []).filter(function(m) {
    return m.tipo === 'entrada' && m.totalKg > 0;
  });
  var manuais = state.estoque.historicoManual || [];

  // Agrupa por produto
  var porProduto = {};
  function addReg(r) {
    if (!porProduto[r.produto]) porProduto[r.produto] = [];
    porProduto[r.produto].push(r);
  }
  movs.forEach(addReg);
  manuais.forEach(addReg);

  // Todos os produtos do estoque aparecem na lista mesmo sem histórico
  (state.estoque.produtos || []).forEach(function(p) {
    if (!porProduto[p.nome]) porProduto[p.nome] = [];
  });

  var nomes = Object.keys(porProduto);
  if (_estoqueHistOrdemAlfa) {
    nomes.sort(function(a,b){ return a.localeCompare(b,'pt-BR'); });
  } else {
    nomes.sort(function(a,b){
      var ta = porProduto[a].length, tb = porProduto[b].length;
      if (ta && !tb) return -1; if (!ta && tb) return 1;
      return a.localeCompare(b,'pt-BR');
    });
  }

  // ── DETALHE de um produto ──────────────────────────────────
  if (_estoqueHistProduto !== null) {
    var nomeProd = _estoqueHistProduto;
    var regsAll  = (porProduto[nomeProd] || []).slice().sort(function(a,b){
      return (a.dataISO||'') < (b.dataISO||'') ? -1 : 1;
    });

    // ── Form de compra manual ────────────────────────────────
    var formManual =
      '<div class="card" style="padding:1.25rem;margin-bottom:1.25rem">' +
        '<div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:1rem">+ Registrar compra histórica</div>' +
        '<div style="display:grid;grid-template-columns:1fr 120px 120px 120px auto;gap:8px;align-items:end;flex-wrap:wrap">' +
          '<div><label style="font-size:0.75rem;color:var(--text2);display:block;margin-bottom:3px">Data da compra</label>' +
            '<input type="date" id="hist-data" style="width:100%;padding:8px 10px;border:0.5px solid var(--border2);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:0.88rem"></div>' +
          '<div><label style="font-size:0.75rem;color:var(--text2);display:block;margin-bottom:3px">Qtd (kg)</label>' +
            '<input type="number" id="hist-qtd" min="0" step="0.1" placeholder="0" style="width:100%;padding:8px 10px;border:0.5px solid var(--border2);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:0.88rem"></div>' +
          '<div><label style="font-size:0.75rem;color:var(--text2);display:block;margin-bottom:3px">Custo R$/kg</label>' +
            '<input type="number" id="hist-custo" min="0" step="0.01" placeholder="0,00" style="width:100%;padding:8px 10px;border:0.5px solid var(--border2);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:0.88rem"></div>' +
          '<div><label style="font-size:0.75rem;color:var(--text2);display:block;margin-bottom:3px">Frete R$/kg</label>' +
            '<input type="number" id="hist-frete" min="0" step="0.01" placeholder="0,00" style="width:100%;padding:8px 10px;border:0.5px solid var(--border2);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:0.88rem"></div>' +
          '<button onclick="estoqueHistSalvarManual()" style="padding:8px 18px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:0.88rem;font-weight:600;cursor:pointer;white-space:nowrap;height:36px">Salvar</button>' +
        '</div>' +
        '<div id="hist-status" style="font-size:0.82rem;color:var(--text3);margin-top:6px"></div>' +
      '</div>';

    // ── Gráfico SVG ─────────────────────────────────────────
    var chartHtml = '';
    if (regsAll.length > 0) {
      var vals = regsAll.map(function(r){ return r.totalKg || 0; });
      var minV = Math.min.apply(null, vals);
      var maxV = Math.max.apply(null, vals);
      var range = maxV - minV || 1;
      var W = 620, H = 190, padL = 58, padR = 20, padT = 24, padB = 38;
      var chartW = W - padL - padR, chartH = H - padT - padB;
      var n = vals.length;
      function px(i){ return padL + (n < 2 ? chartW/2 : (i/(n-1))*chartW); }
      function py(v){ return padT + chartH - ((v-minV)/range)*chartH; }

      var yLabels = '';
      for (var yi = 0; yi <= 4; yi++) {
        var yv = minV + (range/4)*yi;
        var yy = padT + chartH - (yi/4)*chartH;
        yLabels += '<text x="'+(padL-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="var(--text3)">R$'+yv.toFixed(2)+'</text>';
        yLabels += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="var(--border2)" stroke-dasharray="3,3"/>';
      }
      var pts = regsAll.map(function(r,i){ return px(i)+','+py(r.totalKg); }).join(' ');
      var area = 'M'+px(0)+','+(padT+chartH)+' L'+regsAll.map(function(r,i){ return px(i)+','+py(r.totalKg); }).join(' L')+' L'+px(n-1)+','+(padT+chartH)+' Z';
      var dots = '', xLabs = '';
      regsAll.forEach(function(r,i){
        var x=px(i), y=py(r.totalKg);
        var isManu = r.manual ? ' opacity="0.7"' : '';
        dots += '<circle cx="'+x+'" cy="'+y+'" r="5" fill="var(--green)" stroke="var(--card)" stroke-width="2"'+isManu+'/>';
        dots += '<text x="'+x+'" y="'+(y-11)+'" text-anchor="middle" font-size="10" fill="var(--text2)" font-weight="600">R$'+r.totalKg.toFixed(2)+'</text>';
        if (n<=10 || i%Math.ceil(n/10)===0 || i===n-1) {
          var lbl = (r.dataISO||'').slice(5).replace('-','/');
          xLabs += '<text x="'+x+'" y="'+(H-4)+'" text-anchor="middle" font-size="10" fill="var(--text3)">'+lbl+'</text>';
        }
      });
      chartHtml =
        '<div style="background:var(--bg3);border:0.5px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1.25rem">'+
          '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;overflow:visible">'+
            yLabels+
            '<path d="'+area+'" fill="var(--green)" opacity="0.08"/>'+
            '<polyline points="'+pts+'" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>'+
            dots+xLabs+
          '</svg>'+
        '</div>';
    }

    // ── KPIs ────────────────────────────────────────────────
    var kpis = '';
    if (regsAll.length) {
      var vals2 = regsAll.map(function(r){ return r.totalKg||0; });
      var minK = Math.min.apply(null,vals2), maxK = Math.max.apply(null,vals2);
      var avgK = vals2.reduce(function(s,v){return s+v;},0)/vals2.length;
      var ultimo = regsAll[regsAll.length-1];
      kpis =
        '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:1.25rem">'+
          '<div style="background:var(--bg3);border:0.5px solid var(--border);border-radius:10px;padding:10px 16px;min-width:100px">'+
            '<div style="font-size:0.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px">Menor</div>'+
            '<div style="font-size:1.1rem;font-weight:800;color:var(--green)">R$ '+minK.toFixed(2)+'</div>'+
          '</div>'+

function estoqueHistSalvarManual() {
  var dataEl  = document.getElementById('hist-data');
  var qtdEl   = document.getElementById('hist-qtd');
  var custoEl = document.getElementById('hist-custo');
  var freteEl = document.getElementById('hist-frete');
  var status  = document.getElementById('hist-status');

  var dataISO = dataEl  ? dataEl.value.trim()                          : '';
  var qtd     = qtdEl   ? parseFloat(qtdEl.value.replace(',','.')) ||0 : 0;
  var custo   = custoEl ? parseFloat(custoEl.value.replace(',','.'))||0 : 0;
  var frete   = freteEl ? parseFloat(freteEl.value.replace(',','.'))||0 : 0;

  if (!dataISO) { if(status) status.textContent='⚠ Informe a data.'; return; }
  if (custo<=0 && frete<=0) { if(status) status.textContent='⚠ Informe ao menos custo ou frete.'; return; }

  if (!state.estoque.historicoManual) state.estoque.historicoManual = [];
  state.estoque.historicoManual.push({
    id: 'hm_'+Date.now(),
    produto: _estoqueHistProduto,
    dataISO: dataISO,
    qtd: qtd||null,
    custoKg: custo,
    freteKg: frete,
    totalKg: custo + frete,
    manual: true,
  });

  saveState();
  // Salva também no nó separado do Firebase para persistência garantida
  estoqueHistPushFirebase();
  if(status){ status.textContent='✓ Compra salva!'; setTimeout(function(){ status.textContent=''; },2000); }
  var c = document.getElementById('page-content');
  if(c) c.innerHTML = renderEstoque();
}

function estoqueHistExcluirManual(id) {
  if (!confirm('Remover este registro?')) return;
  state.estoque.historicoManual = (state.estoque.historicoManual||[]).filter(function(r){ return r.id !== id; });
  saveState();
  estoqueHistPushFirebase();
  var c = document.getElementById('page-content');
  if(c) c.innerHTML = renderEstoque();
}

function estoqueHistExcluirProduto(nome) {
  if (!confirm('Remover TODO o histórico de "' + nome + '"?\nIsso não afeta o estoque.')) return;
  state.estoque.historicoManual = (state.estoque.historicoManual||[]).filter(function(r){ return r.produto !== nome; });
  saveState();
  estoqueHistPushFirebase();
  var c = document.getElementById('page-content');
  if(c) c.innerHTML = renderEstoque();
}

function estoqueHistPushFirebase() {
  var data = state.estoque.historicoManual || [];
  fetch(FIREBASE_URL + '/historicoManual.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).catch(function(e){ console.warn('[HistoricoPush] erro:', e); });
}

function estoqueHistLoadFirebase() {
  fetch(FIREBASE_URL + '/historicoManual.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (!Array.isArray(data) || data.length === 0) return;
      // Mescla sem duplicar
      var existentes = state.estoque.historicoManual || [];
      var ids = new Set(existentes.map(function(r){ return r.id; }));
      var novos = data.filter(function(r){ return !ids.has(r.id); });
      if (novos.length > 0) {
        state.estoque.historicoManual = existentes.concat(novos);
        console.log('[HistoricoLoad] Carregados ' + novos.length + ' registros do Firebase separado');
      }
    })
    .catch(function(e){ console.warn('[HistoricoLoad] erro:', e); });
}

    _estoqueCustoCarregando = true;
    fetch(FIREBASE_URL + '/financeiro/meta.json')
      .then(function(r){ return r.json(); })

        _estoqueCustoCarregando = false;

          state.financeiro.custoProdutos = meta.custoProdutos;
          if (meta.despesas) {
            var raw = meta.despesas;

          }

  var custoManual = custoManualStr !== '' ? parseFloat(custoManualStr.replace(',','.'))||0 : undefined;

  if (!state.financeiro.custoProdutos) state.financeiro.custoProdutos = {};

  // Calcula custo final: manual ou automático
  var prod = PRODUTOS_CUSTO.find(function(p){ return p.sku === sku; });
  var custoFinal = custoManual;
  if (custoFinal === undefined) {
    // tenta pegar do histórico
    var hist = (state.estoque.historicoManual||[]).concat(
      (state.estoque.movimentacoes||[]).filter(function(m){ return m.tipo==='entrada'&&m.totalKg>0; })
    );
    var maisRecente = null;
    hist.forEach(function(r){
      if (!r.totalKg) return;
      var nomeLow = (r.produto||'').toLowerCase();
      var match = skuMatchHist(sku, nomeLow);
      if (match && (!maisRecente||(r.dataISO||'')>(maisRecente.dataISO||''))) maisRecente = r;
    });
    if (maisRecente && prod) {
      custoFinal = maisRecente.totalKg * prod.peso / 1000 + emb + caixa;
    }
  }

  state.financeiro.custoProdutos[sku] = {
    embalagem: emb,
    caixa: caixa,
    custoManual: custoManual,
    custoFinal: custoFinal !== undefined ? round4(custoFinal) : undefined,
  };

  finSaveFirebase().then(function(){
    if(status){ status.textContent='✓ Salvo!'; status.style.color='var(--green)'; setTimeout(function(){ status.textContent=''; },2000); }
  });
}

function estoqueRegistrarMov() {
  var idxEl   = document.getElementById('est-mov-produto');
  var tipoEl  = document.getElementById('est-mov-tipo');
  var qtdEl   = document.getElementById('est-mov-qtd');
  var obsEl   = document.getElementById('est-mov-obs');
  var custoEl = document.getElementById('est-mov-custo');
  var freteEl = document.getElementById('est-mov-frete');
  var status  = document.getElementById('est-mov-status');

  var idx   = idxEl  ? parseInt(idxEl.value)  : -1;
  var tipo  = tipoEl ? tipoEl.value           : 'saida';
  var qtd   = qtdEl  ? parseInt(qtdEl.value)  : 0;
  var obs   = obsEl  ? obsEl.value.trim()     : '';
  var custo = custoEl ? parseFloat(custoEl.value.replace(',','.')) || 0 : 0;
  var frete = freteEl ? parseFloat(freteEl.value.replace(',','.')) || 0 : 0;

  if (isNaN(idx) || idx < 0 || !state.estoque.produtos[idx]) { if(status) status.textContent = '⚠ Selecione um produto.'; return; }
  if (!qtd || qtd < 1) { if(status) status.textContent = '⚠ Informe uma quantidade válida.'; return; }

  var p = state.estoque.produtos[idx];
  if (tipo === 'saida' && qtd > p.qtd) { if(status) status.textContent = '⚠ Quantidade maior que o estoque (' + p.qtd + ').'; return; }

  var anterior = p.qtd;
  p.qtd = tipo === 'entrada' ? p.qtd + qtd : p.qtd - qtd;

  var now = new Date();
  var dataStr = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  var dataISO = now.toISOString().slice(0,10); // para o gráfico

  var mov = {
    id: Date.now(),
    data: dataStr,
    dataISO: dataISO,
    produto: p.nome,
    tipo: tipo,
    qtd: qtd,
    saldoApos: p.qtd,
    usuario: state.currentUser ? state.currentUser.login : '--',
    obs: obs,
  };
  if (tipo === 'entrada' && (custo > 0 || frete > 0)) {
    mov.custoKg  = custo;
    mov.freteKg  = frete;
    mov.totalKg  = custo + frete;
  }

  state.estoque.movimentacoes.push(mov);
  addLog((tipo === 'entrada' ? 'Entrada' : 'Saída') + ' de estoque: ' + qtd + 'x ' + p.nome + ' (antes: ' + anterior + ' → agora: ' + p.qtd + ')');
  saveState();
  if (status) { status.textContent = '✓ Registrado!'; setTimeout(function(){ status.textContent=''; }, 2000); }
  navigate('estoque');
}

async function mlFetchVendas() {
  var me = await mlGet('/users/me');
  var userId = me.id;
  var now = new Date();

  function toMLDate(d) {
    return d.toISOString().slice(0,19) + '.000Z';
  }

  // Today
  var dayStart = new Date(now); dayStart.setHours(0,0,0,0);
  var dayEnd   = new Date(now); dayEnd.setHours(23,59,59,999);
  var dayFrom  = toMLDate(dayStart);
  var dayTo    = toMLDate(dayEnd);

  // This month
  var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  var monthEnd   = new Date(now.getFullYear(), now.getMonth()+1, 0, 23, 59, 59);
  var monthFrom  = toMLDate(monthStart);
  var monthTo    = toMLDate(monthEnd);

  // Fetch today orders (max 51)
  var dayData = await mlGet('/orders/search?seller=' + userId +
    '&order.date_created.from=' + encodeURIComponent(dayFrom) +
    '&order.date_created.to='   + encodeURIComponent(dayTo) +
    '&order.status=paid&sort=date_desc&limit=50');

  // Fetch ALL month orders paginated
  var allMonthOrders = [];
  var monthTotal = 0;
  var offset = 0;
  var maxPages = 150; // 150 × 50 = 7500 pedidos máximos
  for (var page = 0; page < maxPages; page++) {
    var monthData = await mlGet('/orders/search?seller=' + userId +
      '&order.date_created.from=' + encodeURIComponent(monthFrom) +
      '&order.date_created.to='   + encodeURIComponent(monthTo) +
      '&order.status=paid&sort=date_asc&limit=50&offset=' + offset);
    var results = monthData.results || [];
    if (page === 0) monthTotal = monthData.paging ? monthData.paging.total : results.length;
    allMonthOrders = allMonthOrders.concat(results);
    offset += results.length;
    // Update progress bar if visible
    var pct = monthTotal > 0 ? Math.round((allMonthOrders.length / monthTotal) * 100) : 0;
    mlUpdateProgress(pct, allMonthOrders.length, monthTotal);
    if (results.length === 0 || allMonthOrders.length >= monthTotal) break;
    await new Promise(function(r){ setTimeout(r, 150); });
  }

  return {
    orders:      dayData.results || [],
    totalDay:    dayData.paging  ? dayData.paging.total : 0,
    ordersMonth: allMonthOrders,
    totalMonth:  monthTotal,
    me: me,
  };
}

    if (data.auth_url) window.location.href = data.auth_url;
    else alert('Erro ao gerar link de autorização Shopee');
  } catch(e) {
    alert('Erro: ' + e.message);
  }
}

async function shopeeCarregarVendas(forcar) {
  var el = document.getElementById('shopee-content');
  if (!el) return;

  if (!shopeeTokenValid()) { el.innerHTML = shopeeAuthHtml(); return; }

  // Tenta Firebase se não tem cache local válido
  if (!forcar && !vendaCacheValido(_shopeeCache)) {
    var fbSh = await vendaCarregarCacheFirebase('costa_shopee_cache');
    if (fbSh) _shopeeCache = fbSh;
  }

  if (!forcar && vendaCacheValido(_shopeeCache)) {
    renderShopeeVendas(el, _shopeeCache.data);
    return;
  }

  // Limpa Firebase ao forçar
  if (forcar) {
    _shopeeCache = null;
    localStorage.removeItem('costa_shopee_cache');
    fetch(FIREBASE_URL + '/vendas_cache/costa_shopee_cache.json', { method: 'DELETE' }).catch(function(){});
  }

  el.innerHTML = '<div class="card" style="text-align:center;padding:2rem"><p>⏳ Carregando pedidos da Shopee...</p></div>';

  try {
    var data = await shopeeCarregarDados();
    renderShopeeVendas(el, data);
  } catch(e) {
    var isAuth = e.message.includes('401') || e.message.includes('token');
    if (isAuth) { _shopeeToken = null; state.shopeeToken = null; localStorage.removeItem('shopee_token'); el.innerHTML = shopeeAuthHtml(); }
    else el.innerHTML = '<div class="card" style="border-color:var(--red);text-align:center;padding:2rem"><div style="color:var(--red)">⚠ ' + esc(e.message) + '</div><button class="btn btn-sm" style="margin-top:1rem" onclick="shopeeCarregarVendas(true)">Tentar novamente</button></div>';
  }
}

function renderShopeeVendas(el, data) {
  var nomesMes  = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var mesNome   = nomesMes[new Date().getMonth()];
  var diasNoMes = new Date().getDate();

  var totalPedidos = data.totalPedidos, totalFaturado = data.totalFaturado;
  var pedidosHoje  = data.pedidosHoje,  faturadoHoje  = data.faturadoHoje;
  var pedidosPorDia = data.pedidosPorDia || {};
  var prodRanking   = data.prodRanking   || {};

  var top5 = Object.keys(prodRanking).map(function(n){ return { nome:n, qtd:prodRanking[n].qtd, receita:prodRanking[n].receita }; });
  top5.sort(function(a,b){ return b.qtd - a.qtd; });
  top5 = top5.slice(0, 5);

  var html =
    '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:1.25rem">' +
      '<span style="font-size:0.85rem;color:var(--text3)">🧡 Shopee * Loja conectada</span>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="btn btn-sm" onclick="shopeeCarregarVendas(true)">🔄 Atualizar</button>' +
        '<button class="btn btn-sm btn-red" onclick="shopeeDesconectar()">Desconectar</button>' +
      '</div>' +
    '</div>' +

    '<div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-bottom:0.5rem">Hoje</div>' +
    '<div class="stats-grid" style="margin-bottom:1.25rem">' +
      '<div class="stat-card"><div class="stat-label">🧡 Pedidos Shopee Hoje</div><div class="stat-value" style="color:#f4630a">' + pedidosHoje + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">💰 Faturado Hoje</div><div class="stat-value">R$ ' + faturadoHoje.toLocaleString('pt-BR',{minimumFractionDigits:2}) + '</div></div>' +
    '</div>' +

    '<div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-bottom:0.5rem">' + mesNome + '</div>' +
    '<div class="stats-grid" style="margin-bottom:1.5rem">' +
      '<div class="stat-card"><div class="stat-label">📅 Pedidos no Mês</div><div class="stat-value">' + totalPedidos + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">💵 Faturado no Mês</div><div class="stat-value">R$ ' + totalFaturado.toLocaleString('pt-BR',{minimumFractionDigits:2}) + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">🎯 Ticket Médio</div><div class="stat-value">R$ ' + (totalPedidos > 0 ? (totalFaturado/totalPedidos).toLocaleString('pt-BR',{minimumFractionDigits:2}) : '0,00') + '</div></div>' +
    '</div>' +

    '<div class="card" style="padding:1.25rem;margin-bottom:1.25rem">' +
      '<div style="font-weight:700;font-size:0.9rem;margin-bottom:1rem">📈 Pedidos por Dia -- ' + mesNome + '</div>' +
      '<div style="position:relative;height:160px;display:flex;align-items:flex-end;gap:3px;padding-bottom:20px">';

  var maxDia = Math.max.apply(null, Object.values(pedidosPorDia).concat([1]));
  for (var d2 = 1; d2 <= diasNoMes; d2++) {
    var qtdDia = pedidosPorDia[d2] || 0;
    var pct    = Math.round((qtdDia / maxDia) * 130);
    var isHoje = d2 === new Date().getDate();
    html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0">' +
      (qtdDia > 0 ? '<div style="font-size:0.55rem;color:var(--text3)">' + qtdDia + '</div>' : '<div style="font-size:0.55rem;color:transparent">0</div>') +
      '<div style="width:100%;height:' + pct + 'px;background:' + (isHoje?'var(--amber)':'#f4630a') + ';border-radius:3px 3px 0 0;opacity:' + (isHoje?'1':'0.8') + ';min-height:2px"></div>' +
      '<div style="font-size:0.55rem;color:var(--text3);margin-top:2px">' + d2 + '</div>' +
    '</div>';
  }

  html += '</div></div>' +
    (top5.length > 0 ?
      '<div class="card" style="padding:1.25rem">' +
        '<div style="font-weight:700;font-size:0.9rem;margin-bottom:1rem">🏆 Top Produtos -- ' + mesNome + '</div>' +
        top5.map(function(p, i) {
          var medalhas = ['🥇','🥈','🥉','4️⃣','5️⃣'];
          var pctBar = top5[0].qtd > 0 ? Math.round((p.qtd / top5[0].qtd) * 100) : 0;
          return '<div style="margin-bottom:12px">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +

async function bindVendas() {

async function vendasCarregarCombinado(forcar) {
  var el = document.getElementById('combinado-content');
  if (!el) return;

  var mlOk     = mlTokenValid();
  var shopeeOk = shopeeTokenValid();

  if (!mlOk && !shopeeOk) {
    el.innerHTML = '<div class="card" style="text-align:center;padding:2rem">Conecte ao menos uma plataforma.</div>';
    return;
  }

  // Usa cache se ambos válidos
  if (!forcar && vendaCacheValido(_mlCache) && (!shopeeOk || vendaCacheValido(_shopeeCache))) {
    renderCombinado(el);
    return;
  }

  el.innerHTML = '<div class="card" style="text-align:center;padding:2rem"><p style="color:var(--text2)">Carregando dados combinados...</p></div>';

  try {
    if (mlOk && !vendaCacheValido(_mlCache)) {
      var r = await mlFetchVendas();
      _mlCache = { data: r, loadedAt: Date.now() }; vendaSalvarCache('costa_ml_cache', _mlCache);
    }
    if (shopeeOk && !vendaCacheValido(_shopeeCache)) {
      await shopeeCarregarDados();
    }
    renderCombinado(el);
  } catch(e) {
    el.innerHTML = '<div class="card" style="text-align:center;padding:2rem;color:var(--red)">⚠ ' + esc(e.message) + '</div>';
  }
}

// Extrai e salva dados da Shopee no cache
async function shopeeCarregarDados() {
  var now       = Math.floor(Date.now() / 1000);
  var dtInicio  = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  var inicioMes = Math.floor(dtInicio.getTime() / 1000);
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var hojeTs = Math.floor(hoje.getTime() / 1000);

  var allOrders = [];
  var cursor = '';
  for (var pg = 0; pg < 20; pg++) {
    var params = { time_range_field:'create_time', time_from:inicioMes, time_to:now, page_size:100, response_optional_fields:'order_status' };
    if (cursor) params.cursor = cursor;
    var resp = await shopeeGet('/api/v2/order/get_order_list', params);
    var list = (resp.response && resp.response.order_list) ? resp.response.order_list : [];
    allOrders = allOrders.concat(list);
    if (!resp.response || !resp.response.more || !resp.response.next_cursor) break;
    cursor = resp.response.next_cursor;
  }

  var totalFaturado = 0, pedidosHoje = 0, faturadoHoje = 0;
  var pedidosPorDia = {}, prodRanking = {};
  var diasNoMes = new Date().getDate();
  for (var d = 1; d <= diasNoMes; d++) pedidosPorDia[d] = 0;

  if (allOrders.length > 0) {
    var chunks = [];
    for (var i = 0; i < allOrders.length; i += 50)
      chunks.push(allOrders.slice(i, i+50).map(function(o){ return o.order_sn; }));
    for (var ci = 0; ci < chunks.length; ci++) {
      var det = await shopeeGet('/api/v2/order/get_order_detail', { order_sn_list: chunks[ci].join(','), response_optional_fields:'total_amount,create_time,item_list' });
      if (!det.response || !det.response.order_list) continue;
      det.response.order_list.forEach(function(o) {
        var val = parseFloat(o.total_amount || 0);
        var ts  = o.create_time || 0;
        totalFaturado += val;
        var dtPed = new Date(ts * 1000);
        if (dtPed.getMonth() === new Date().getMonth() && dtPed.getFullYear() === new Date().getFullYear()) {
          var dia = dtPed.getDate();
          pedidosPorDia[dia] = (pedidosPorDia[dia] || 0) + 1;
        }
        if (ts >= hojeTs) { pedidosHoje++; faturadoHoje += val; }
        if (o.item_list) {
          o.item_list.forEach(function(item) {
            var nome = item.item_name || 'Produto';
            var qtd  = item.model_quantity_purchased || 1;
            if (!prodRanking[nome]) prodRanking[nome] = { qtd: 0, receita: 0 };
            prodRanking[nome].qtd += qtd;
            prodRanking[nome].receita += val;
          });
        }
      });
    }
  }

  var data = { totalPedidos: allOrders.length, totalFaturado, pedidosHoje, faturadoHoje, pedidosPorDia, prodRanking };
  _shopeeCache = { data, loadedAt: Date.now() }; vendaSalvarCache('costa_shopee_cache', _shopeeCache);
  return data;
}

function mlProdMap(orders) {
  var map = {};
  orders.forEach(function(o) {
    if (!o.order_items) return;
    o.order_items.forEach(function(item) {
      var title = item.item ? item.item.title : 'Produto';
      map[title] = (map[title] || 0) + (item.quantity || 1);
    });
  });
  return map;
}

    return s+(o.order_items ? o.order_items.reduce(function(ss,i){ return ss+(i.quantity||0); },0) : 0);
  }, 0);

  // Month stats
  var totalPedidosMes = result.totalMonth;
  var totalVendidoMes = ordersMonth.reduce(function(s,o){ return s+(o.total_amount||0); }, 0);

  // Monthly chart data -- orders per day of month

  ordersMonth.forEach(function(o) {

  // Salva no cache com todos os dados para o combinado

  var maxVal = Math.max.apply(null, chartData) || 1;

    '<div class="stat-card"><div class="stat-icon">🛍️</div><div class="stat-label">Pedidos Hoje</div><div class="stat-value">' + totalPedidosDia + '</div></div>' +

    '<div style="display:flex;align-items:flex-end;gap:3px;height:100px;padding:8px 0">';

  chartData.forEach(function(val, idx) {

    var isToday = idx === now.getDate() - 1;
    var color = isToday ? 'var(--green)' : 'var(--blue,#3b82f6)';

  html += '</div></div>' +

  // Top 5 month ranking
  '<div class="card">' +
    '<div class="card-header"><span class="card-title">🏆 Top 5 do Mês</span></div>';

  if (!topMes.length) {
    html += '<div class="empty-state" style="padding:1rem">' + iconEmpty() + '<p>Sem dados</p></div>';
  } else {
    var medals = ['🥇','🥈','🥉','4️⃣','5️⃣'];
    topMes.forEach(function(p, i) {

  } else {

    var medalsDia = ['🥇','🥈','🥉','4️⃣','5️⃣'];
    topDia.forEach(function(p, i) {
      var barW = Math.round((p[1]/maxDia)*100);

        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">' +
          '<span style="font-size:1rem">' + medalsDia[i] + '</span>' +
          '<span style="flex:1;font-size:0.8rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(p[0]) + '">' + esc(p[0]) + '</span>' +
          '<span style="font-size:0.8rem;font-weight:700;color:var(--green);white-space:nowrap">' + p[1] + ' un.</span>' +
        '</div>' +
        '<div style="background:var(--bg3);border-radius:99px;height:6px">' +
          '<div style="background:var(--amber,#f59e0b);border-radius:99px;height:6px;width:' + barW + '%"></div>' +

async function mlLoadInicio() {
  var chartEl = document.getElementById('inicio-chart-content');
  var diaEl   = document.getElementById('inicio-pedidos-dia');
  var mesEl   = document.getElementById('inicio-pedidos-mes');
  var rankEl  = document.getElementById('inicio-ranking-content');
  if (!chartEl) return;

  // Try to refresh token if expired
  if (!mlTokenValid()) {
    try {
      await mlRefreshToken();
    } catch(e) {
      var noData = '<span style="color:var(--text3);font-size:0.8rem">Conecte o Mercado Livre em Vendas</span>';
      if (chartEl) chartEl.innerHTML = noData;
      if (rankEl)  rankEl.innerHTML  = noData;
      if (diaEl)   diaEl.textContent = '--';
      if (mesEl)   mesEl.textContent = '--';
      return;
    }
  }

  try {
    var result      = await mlFetchVendas();
    var orders      = result.orders;
    var ordersMonth = result.ordersMonth;
    var now         = new Date();

    // Counts
    if (diaEl) diaEl.textContent = result.totalDay;

    // Shopee hoje -- usa cache se disponível, senão tenta carregar
    var shopeeEl = document.getElementById('inicio-pedidos-shopee-dia');
    if (shopeeEl) {
      if (shopeeTokenValid()) {
        if (vendaCacheValido(_shopeeCache)) {
          shopeeEl.textContent = _shopeeCache.data.pedidosHoje || 0;
          if (mesEl) mesEl.textContent = result.totalMonth + (_shopeeCache.data.totalPedidos || 0);
        } else {
          shopeeEl.textContent = '...';
          shopeeCarregarDados().then(function(data) {
            var el2 = document.getElementById('inicio-pedidos-shopee-dia');
            if (el2) el2.textContent = data.pedidosHoje || 0;
            var mesEl2 = document.getElementById('inicio-pedidos-mes');
            if (mesEl2) mesEl2.textContent = result.totalMonth + (data.totalPedidos || 0);
          }).catch(function(){ var el2 = document.getElementById('inicio-pedidos-shopee-dia'); if(el2) el2.textContent = '--'; });
        }
      } else {
        shopeeEl.textContent = '--';
        if (mesEl) mesEl.textContent = result.totalMonth;
      }
    } else {
      if (mesEl) mesEl.textContent = result.totalMonth;
    }

    // Chart SVG
    if (chartEl) {
      var daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
      var chartData = new Array(daysInMonth).fill(0);
      // Also add today's orders from dayData (avoids timezone issues for current day)
      var allForChart = ordersMonth.concat(orders);
      // Deduplicate by order id
      var seenIds = {};
      allForChart = allForChart.filter(function(o) {
        if (!o.id || seenIds[o.id]) return false;
        seenIds[o.id] = true;
        return true;
      });
      allForChart.forEach(function(o) {
        if (!o.date_created) return;
        // Use Brazil timezone (UTC-3) to get correct day
        var d = new Date(new Date(o.date_created).getTime() - 3*60*60*1000);
        var day = d.getUTCDate() - 1;
        var month = d.getUTCMonth();
        var year = d.getUTCFullYear();
        if (year === now.getFullYear() && month === now.getMonth() && day >= 0 && day < daysInMonth) {
          chartData[day]++;
        }
      });
      var maxVal = Math.max.apply(null, chartData) || 1;
      var W = 700, H = 170, padL = 38, padR = 10, padT = 20, padB = 30;
      var iW = W - padL - padR, iH = H - padT - padB;
      var pts = chartData.map(function(v, i) {
        var x = padL + (i / Math.max(daysInMonth-1,1)) * iW;
        var y = padT + iH - (v / maxVal) * iH;
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
      var todayIdx = now.getDate() - 1;
      var tx = (padL + (todayIdx / Math.max(daysInMonth-1,1)) * iW).toFixed(1);
      var ty = (padT + iH - (chartData[todayIdx] / maxVal) * iH).toFixed(1);

      var xLabels = '';
      for (var i = 0; i < daysInMonth; i++) {
        var lx = (padL + (i / Math.max(daysInMonth-1,1)) * iW).toFixed(1);
        // Label every day
        xLabels += '<text x="' + lx + '" y="' + (H-4) + '" fill="var(--text3)" font-size="7.5" text-anchor="middle">' + (i+1) + '</text>';
        // Tick mark
        xLabels += '<line x1="' + lx + '" y1="' + (padT+iH) + '" x2="' + lx + '" y2="' + (padT+iH+3) + '" stroke="var(--border)" stroke-width="1"/>';
      }

      // Y axis labels at 50, 100, 150... up to maxVal rounded to nearest 50
      var yStep = 50;
      var yLines = '';
      for (var yv = yStep; yv <= maxVal; yv += yStep) {
        var ly = (padT + iH - (yv / maxVal) * iH).toFixed(1);
        yLines +=
          '<line x1="' + padL + '" y1="' + ly + '" x2="' + (padL+iW) + '" y2="' + ly + '" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>' +
          '<text x="' + (padL-3) + '" y="' + (parseFloat(ly)+3) + '" fill="var(--text3)" font-size="8" text-anchor="end">' + yv + '</text>';
      }

      chartEl.innerHTML =
        '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' +
          // Axes
          '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT+iH) + '" stroke="var(--border)" stroke-width="1"/>' +
          '<line x1="' + padL + '" y1="' + (padT+iH) + '" x2="' + (padL+iW) + '" y2="' + (padT+iH) + '" stroke="var(--border)" stroke-width="1"/>' +
          // Y grid lines + labels
          yLines +
          // Line chart
          '<polyline points="' + pts + '" fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
          // Today dot + label
          '<circle cx="' + tx + '" cy="' + ty + '" r="4" fill="var(--green)"/>' +
          '<text x="' + tx + '" y="' + (parseFloat(ty)-8) + '" fill="var(--green)" font-size="9" text-anchor="middle" font-weight="bold">' + chartData[todayIdx] + '</text>' +
          // X labels -- every day
          xLabels +
        '</svg>';
    }

    // Ranking top 10
    if (rankEl) {
      var prodMap = mlProdMap(ordersMonth);
      var top10 = Object.entries(prodMap).sort(function(a,b){ return b[1]-a[1]; }).slice(0,10);
      if (!top10.length) {
        rankEl.innerHTML = '<span style="color:var(--text3);font-size:0.8rem">Sem dados do mês</span>';
      } else {
        var maxQ = top10[0][1];
        var medals = ['🥇','🥈','🥉'];
        var html = '<div style="overflow-y:auto;max-height:170px;padding-right:4px">';
        top10.forEach(function(p, i) {
          var bar = Math.round((p[1]/maxQ)*100);
          var icon = i < 3 ? medals[i] : '<span style="font-size:0.75rem;color:var(--text3);min-width:18px;display:inline-block;text-align:center">' + (i+1) + '</span>';
          html +=
            '<div style="margin-bottom:8px">' +
              '<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">' +
                '<span>' + icon + '</span>' +
                '<span style="flex:1;font-size:0.78rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(p[0]) + '">' + esc(p[0]) + '</span>' +
                '<span style="font-size:0.78rem;font-weight:700;color:var(--green);white-space:nowrap">' + p[1] + ' un.</span>' +
              '</div>' +
              '<div style="background:var(--bg3);border-radius:99px;height:4px">' +
                '<div style="background:var(--green);border-radius:99px;height:4px;width:' + bar + '%"></div>' +
              '</div>' +
            '</div>';
        });
        html += '</div>';
        rankEl.innerHTML = html;
      }
    }
  } catch(e) {
    var errMsg = '<span style="color:var(--text3);font-size:0.8rem">Indisponível no momento</span>';
    if (chartEl) chartEl.innerHTML = errMsg;
    if (rankEl)  rankEl.innerHTML  = errMsg;
  }
}

function renderLogs() {
  if (!state.logs.length) return `<div class="card"><div class="empty-state">${iconEmpty()}<p>Nenhuma atividade registrada</p></div></div>`;
  let html = `<div class="card"><div class="card-header"><span class="card-title">Histórico de Atividades</span>
    <button class="btn btn-sm btn-red" onclick="clearLogs()">Limpar Logs</button>
  </div>`;
  state.logs.forEach(l => {
    html += `<div class="log-item">
      <span class="log-time">${l.time}</span>
      <span class="log-user">${esc(l.user)}</span>
      <span class="log-desc">${esc(l.action)}</span>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function clearLogs() {
  if (!confirm('Limpar todos os logs?')) return;
  state.logs = [];
  saveState();
  renderPage();
}

// --- HELPERS ------------------------------------------------------------------

var _prodTab = 'custo'; // 'custo' | 'historico'

function renderProdutos() {
  var tabBar =
    '<div style="display:flex;gap:4px;margin-bottom:1.5rem;border-bottom:1.5px solid var(--border);padding-bottom:0">'+
      '<button class="fin-tab'+(_prodTab==='custo'?' active':'')+'" onclick="prodSetTab(\'custo\')" style="font-size:0.88rem">📦 Custo dos Produtos</button>'+
      '<button class="fin-tab'+(_prodTab==='historico'?' active':'')+'" onclick="prodSetTab(\'historico\')" style="font-size:0.88rem">📈 Histórico de Preços</button>'+
    '</div>';

  if (_prodTab === 'custo') {
    // Garante que custoProdutos está carregado
    var custos = state.financeiro.custoProdutos || {};
    if (Object.keys(custos).length === 0 && !_estoqueCustoCarregando) {
      _estoqueCustoCarregando = true;
      fetch(FIREBASE_URL + '/financeiro/meta.json')
        .then(function(r){ return r.json(); })
        .then(function(meta){
          _estoqueCustoCarregando = false;
          if (meta && meta.custoProdutos) {
            state.financeiro.custoProdutos = meta.custoProdutos;
            if (meta.tarifasSku) state.financeiro.tarifasSku = meta.tarifasSku;
            if (meta.aliquota !== undefined) state.financeiro.aliquota = meta.aliquota;
            var c = document.getElementById('page-content');
            if (c && state.currentPage === 'produtos') c.innerHTML = renderProdutos();
          }
        })
        .catch(function(){ _estoqueCustoCarregando = false; });
    }
    return tabBar + renderEstoqueCusto();
  }

  if (_prodTab === 'historico') {
    return tabBar + renderEstoqueHistorico();
  }

  return tabBar;
}

function prodSetTab(t) {
  _prodTab = t;
  var c = document.getElementById('page-content');
  if (c) c.innerHTML = renderProdutos();
}

function finSetTab(t) {

  _finCardSel = null;
  document.querySelectorAll('.fin-tab').forEach(function(el){
    el.classList.toggle('active', el.dataset.tab === t);
  });
  var sections = { visao: 'fin-visao', upload: 'fin-upload', despesas: 'fin-despesas' };
  Object.values(sections).forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
  var show = document.getElementById(sections[t] || 'fin-visao');
  if (show) show.style.display = '';
}

function finFmt(v) {
  var n = parseFloat(v) || 0;
  return 'R$ ' + Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function finParseBRL(v) {
  if (!v) return 0;
  return parseFloat(String(v).replace(/BRL\s*/g,'').replace(/\./g,'').replace(',','.').trim()) || 0;
}

var ML_INVALID = ['Cancelada pelo comprador','Venda cancelada. Não envie.','Cancelada. Não despache',
  'O seu comprador quer cancelar','Devolução em preparação','Devolução a caminho'];

var SKU_NAMES = {
  'oleo3':'Óleo de Coco 3L','oleo1':'Óleo de Coco 1L','oleo500':'Óleo de Coco 500mL',
  'aveia500':'Aveia Flocos 500g','aveia1':'Aveia Flocos 1Kg','chips50':'Chips Vegetais 50g',
  'chips500':'Chips Vegetais 500g','chia100':'Semente de Chia 100g','chia1':'Semente de Chia 1Kg',
  'chia':'Semente de Chia','caju100':'Castanha de Caju 100g','caju1':'Castanha de Caju 1Kg',
  'uva100':'Uva Passa Preta 100g','uva1':'Uva Passa Preta 1Kg','uva':'Uva Passa Preta',
  'sal100':'Flor de Sal 100g','sal1':'Flor de Sal 1Kg','flordesal':'Flor de Sal',
  'frutas50':'Frutas Tropicais 50g','frutas500':'Frutas Tropicais 500g',
  'psy100':'Psyllium 100g','psy1':'Psyllium 1Kg','psyllium':'Psyllium',
  'nozes100':'Nozes Quartz 100g','nozes1':'Nozes Quartz 1Kg',
  'linhaca100':'Linhaça Dourada 100g','linhaca1':'Linhaça Dourada 1Kg','linhaca':'Linhaça Dourada',
  'beterraba100':'Beterraba 100g','beterraba1':'Beterraba 1Kg',
  'abobora100':'Sem. Abóbora 100g','abobora1':'Sem. Abóbora 1Kg',
  'arroz200':'Flocos Arroz Natural 200g','arroz400':'Flocos Arroz Natural 400g',
  'cacau200':'Flocos Arroz Cacau 200g','cacau500':'Flocos Arroz Cacau 500g','cacau400':'Flocos Arroz Cacau 400g',
  'coco400':'Chips de Coco 400g','coco100':'Chips de Coco 100g',
};

function finCalcMes() {
  var meses = state.financeiro.meses || {};
  if (!_finMesSel) {
    var keys = Object.keys(meses).sort().reverse();
    _finMesSel = keys[0] || '';
  }
  var mes = _finMesSel ? meses[_finMesSel] : null;
  var res = { fat_ml:0, fat_sp:0, fat_tt:0, fat:0, taxas_ml:0, taxas_sp:0, taxas_tt:0, taxas:0,
              despesas:0, imposto:0, lucro:0, skus:[] };
  if (!mes) return res;

  var skuMl={}, skuSp={}, skuTt={};
  var fatSkuMl={}, fatSkuSp={}, fatSkuTt={}; // faturamento por SKU por plataforma
  var tarifas = state.financeiro.tarifasSku || {};
  var usaTarifasCustom = Object.keys(tarifas).length > 0;

  // ML
  if (mes.ml && mes.ml.length) {
    mes.ml.forEach(function(r) {
      var estado = String(r['Estado']||'');
      if (ML_INVALID.some(function(x){ return estado.indexOf(x)!==-1; })) return;
      if (estado.indexOf('Pacote de')!==-1) return;
      var sku = String(r['SKU']||'').trim().toLowerCase();
      if (!sku || sku==='nan') return;
      if (!SKU_NAMES[sku]) return;
      var preco = parseFloat(String(r['Preço unitário de venda do anúncio (BRL)']||'').replace(',','.'))||0;
      var uni   = parseFloat(String(r['Unidades']||'').replace(',','.'))||0;
      var fatLinha = preco * uni;
      res.fat_ml += fatLinha;
      skuMl[sku] = (skuMl[sku]||0) + uni;
      fatSkuMl[sku] = (fatSkuMl[sku]||0) + fatLinha;

      // Tarifa: custom ou da planilha
      if (usaTarifasCustom && tarifas[sku] && tarifas[sku].ml) {
        var t = tarifas[sku].ml;
        res.taxas_ml += fatLinha * ((t.pctVenda||0)/100) + (t.envio||0) * uni;
      } else {
        var tar = parseFloat(String(r['Tarifa de venda e impostos (BRL)']||'').replace(',','.'))||0;
        var env = parseFloat(String(r['Tarifas de envio (BRL)']||'').replace(',','.'))||0;
        res.taxas_ml += Math.abs(tar) + Math.abs(env);
      }
    });
  }

  // Shopee
  if (mes.sp && mes.sp.length) {
    mes.sp.forEach(function(r) {
      var status = String(r['Status do pedido']||'');
      if (status==='Cancelado') return;
      var sku = String(r['Número de referência SKU']||'').trim().toLowerCase();
      if (!sku) return;
      if (!SKU_NAMES[sku]) return;
      var vt  = parseFloat(r['Valor Total'])||0;
      var com = parseFloat(r['Taxa de comissão bruta'])||0;
      var srv = parseFloat(r['Taxa de serviço bruta'])||0;
      var qty = parseInt(r['Quantidade'])||0;
      res.fat_sp += vt;
      skuSp[sku] = (skuSp[sku]||0) + qty;
      fatSkuSp[sku] = (fatSkuSp[sku]||0) + vt;

      if (usaTarifasCustom && tarifas[sku] && tarifas[sku].sp) {
        var ts = tarifas[sku].sp;
        res.taxas_sp += vt * ((ts.pctVenda||0)/100) + (ts.envio||0) * qty;
      } else {
        res.taxas_sp += (com+srv);
      }
    });
  }

  // TikTok
  if (mes.tt && mes.tt.length) {
    var ttSeen = {};
    mes.tt.forEach(function(r) {
      var st = String(r['Order Status']||'');
      if (st==='Cancelado'||st==='Não pago') return;
      var sku = String(r['Seller SKU']||'').trim();
      var oid = String(r['Order ID']||'');
      var qty = parseInt(r['Quantity'])||0;
      // Ignora SKUs que não estão no catálogo da plataforma
      if (!sku || !SKU_NAMES[sku.toLowerCase()]) return;
      // Valor de venda = SKU Subtotal Before Discount - SKU Platform Discount - SKU Seller Discount
      var before   = finParseBRL(r['SKU Subtotal Before Discount']);
      var platDisc = finParseBRL(r['SKU Platform Discount']);
      var sellDisc = finParseBRL(r['SKU Seller Discount']);
      var valVenda = before - platDisc - sellDisc;
      // Fallback para SKU Subtotal After Discount se os campos não existirem
      if (!before && !platDisc && !sellDisc) {
        valVenda = finParseBRL(r['SKU Subtotal After Discount']);
      }
      // Tarifa TikTok: custom ou padrão 12% + R$4
      var tarifa;
      var skuLow = sku.toLowerCase();
      if (usaTarifasCustom && tarifas[skuLow] && tarifas[skuLow].tt) {
        var tt2 = tarifas[skuLow].tt;
        tarifa = valVenda * ((tt2.pctVenda||0)/100) + (tt2.envio||0) * qty;
      } else {
        tarifa = valVenda * 0.12 + 4 * qty;
      }
      var key = oid+'|'+sku;
      if (!ttSeen[key]) {
        ttSeen[key]=true;
        res.fat_tt   += valVenda;
        res.taxas_tt  = (res.taxas_tt||0) + tarifa;
        skuTt[sku]=(skuTt[sku]||0)+qty;
        fatSkuTt[sku]=(fatSkuTt[sku]||0)+valVenda;
      }
    });
  }

  res.fat   = res.fat_ml + res.fat_sp + res.fat_tt;
  res.taxas = res.taxas_ml + res.taxas_sp + (res.taxas_tt||0);

  var despObj = state.financeiro.despesas || {};
  var desp = Array.isArray(despObj) ? despObj : (despObj[_finMesSel] || []);
  res.despesas = desp.reduce(function(s,d){ return s+(d.valor||0);},0);

  var aliq = parseFloat(state.financeiro.aliquota)||0;
  res.imposto = res.fat * (aliq/100);

  // Custo dos produtos — merge correto sem duplicar SKUs entre plataformas
  var custos = state.financeiro.custoProdutos || {};
  res.custoProd = 0;
  res.custoProdDetalhe = []; // para a página de detalhe
  var skuAllKeys = {};
  Object.keys(skuMl).forEach(function(s){ skuAllKeys[s.toLowerCase().trim()] = true; });
  Object.keys(skuSp).forEach(function(s){ skuAllKeys[s.toLowerCase().trim()] = true; });
  Object.keys(skuTt).forEach(function(s){ skuAllKeys[s.toLowerCase().trim()] = true; });
  Object.keys(skuAllKeys).forEach(function(k){
    var c = custos[k];
    var qtdMl  = skuMl[k]  || 0;
    var qtdSp  = skuSp[k]  || 0;
    var qtdTt  = skuTt[k]  || 0;
    var qtd = qtdMl + qtdSp + qtdTt;
    if (!qtd) return;
    if (!c || c.custoFinal === undefined) {
      res.custoProdDetalhe.push({ sku:k, nome:SKU_NAMES[k]||k, qtd:qtd, custo:null, total:null });
      return;
    }
    var total = qtd * c.custoFinal;
    res.custoProd += total;
    res.custoProdDetalhe.push({ sku:k, nome:SKU_NAMES[k]||k, qtd:qtd, custo:c.custoFinal, total:total });
  });
  res.custoProd = Math.round(res.custoProd * 100) / 100;
  res.custoProdDetalhe.sort(function(a,b){ return (b.total||0)-(a.total||0); });

  // Detalhe ML para página de drill-down
  res.mlDetalhe = { linhas:0, filtradas:0, semSku:0 };
  if (mes.ml) {
    mes.ml.forEach(function(r){
      res.mlDetalhe.linhas++;
      var estado = String(r['Estado']||'');
      if (ML_INVALID.some(function(x){ return estado.indexOf(x)!==-1; })) { res.mlDetalhe.filtradas++; return; }
      if (estado.indexOf('Pacote de')!==-1) { res.mlDetalhe.filtradas++; return; }
      var sku = String(r['SKU']||'').trim();
      if (!sku || sku==='nan') { res.mlDetalhe.semSku++; }
    });
  }
  // Detalhe Shopee
  res.spDetalhe = { linhas:0, cancelados:0 };
  if (mes.sp) {
    mes.sp.forEach(function(r){
      res.spDetalhe.linhas++;
      if (String(r['Status do pedido']||'')==='Cancelado') res.spDetalhe.cancelados++;
    });
  }

  res.lucro = res.fat - res.taxas - res.despesas - res.imposto - res.custoProd;

  // SKU merge
  var all = {};
  function addSku(map, plat) {
    Object.keys(map).forEach(function(sku){
      var k = sku.toLowerCase().trim();
      if (!all[k]) all[k]={ name:SKU_NAMES[k]||sku, ml:0, shopee:0, tiktok:0, total:0 };
      all[k][plat] += map[sku];
      all[k].total += map[sku];
    });
  }
  addSku(skuMl,'ml'); addSku(skuSp,'shopee'); addSku(skuTt,'tiktok');
  res.skus = Object.values(all).sort(function(a,b){ return b.total-a.total; });

  return res;
}

function renderFinDetalheCard(calc, desp, aliq, MONTHS) {
  var card = _finCardSel;
  var voltar = '<button onclick="finFecharDetalhe()" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:1.5rem;background:none;border:0.5px solid var(--border2);border-radius:8px;padding:7px 16px;color:var(--text2);cursor:pointer;font-size:0.88rem">← Voltar</button>';

  // ── FATURAMENTO ─────────────────────────────────────────────
  if (card === 'fat') {
    var mes = _finMesSel ? (state.financeiro.meses||{})[_finMesSel] : null;
    var mlRows = [], spRows = [], ttRows = [];
    if (mes && mes.ml) {
      var ML_INVALID_LOCAL = ['Cancelada pelo comprador','Venda cancelada. Não envie.','Cancelada. Não despache','O seu comprador quer cancelar','Devolução em preparação','Devolução a caminho'];
      mes.ml.forEach(function(r){
        var estado = String(r['Estado']||'');
        var invalido = ML_INVALID_LOCAL.some(function(x){ return estado.indexOf(x)!==-1; }) || estado.indexOf('Pacote de')!==-1;
        var sku = String(r['SKU']||'').trim();
        var rec = parseFloat(r['Preço unitário de venda do anúncio (BRL)'])||0;
        mlRows.push({ estado:estado, sku:sku, rec:rec, invalido:invalido, semSku:(!sku||sku==='nan') });
      });
    }
    if (mes && mes.sp) {
      mes.sp.forEach(function(r){
        var status = String(r['Status do pedido']||'');
        var vt = parseFloat(r['Valor Total'])||0;
        spRows.push({ status:status, vt:vt, cancelado:status==='Cancelado' });
      });
    }
    if (mes && mes.tt) {
      var ttSeen2 = {};
      mes.tt.forEach(function(r){
        var st = String(r['Order Status']||'');
        var oid = String(r['Order ID']||'');
        var sku = String(r['Seller SKU']||'').trim();
        var key = oid+'|'+sku;
        var cancelado = st==='Cancelado'||st==='Não pago';
        if (!ttSeen2[key]) { ttSeen2[key]=true; ttRows.push({ status:st, cancelado:cancelado }); }
      });
    }
    var mlFiltradas = mlRows.filter(function(r){ return r.invalido; }).length;
    var mlSemSku = mlRows.filter(function(r){ return !r.invalido && (!r.sku||r.sku==='nan'); }).length;
    var spCancelados = spRows.filter(function(r){ return r.cancelado; }).length;
    var ttCancelados = ttRows.filter(function(r){ return r.cancelado; }).length;

    return voltar +
      '<div style="font-size:1.1rem;font-weight:700;margin-bottom:1.5rem">💰 Detalhe do Faturamento</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.25rem;margin-bottom:1.25rem">'+

        // ML
        '<div class="card" style="padding:1.25rem">'+
